<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUNTER CLASH｜內部流程測試</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><p class="eyebrow">BXH · HUNTER CLASH</p><h1>內部流程測試</h1><p>測試專用環境 · 玩家入口尚未開放</p></header>
<section><h2>登入測試帳號</h2><form id="login"><label>電子郵件<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="off" required></label><button id="signin">登入</button><button id="logout" type="button" disabled>登出</button></form><p id="identity">尚未登入</p></section>
<section><h2>挑戰狀態</h2><form id="load"><label>挑戰編號<input id="challenge" maxlength="128" required pattern="[A-Za-z0-9_-]+"></label><button id="refresh" disabled>讀取最新狀態</button></form><p id="summary">登入後，輸入被指派的挑戰編號。</p><p id="score-summary"></p></section>
<section><h2>提交結果</h2><form id="submit"><div class="scores"><label>A 方得分<input id="score-a" type="number" min="0" max="100" step="1" value="4" required></label><label>B 方得分<input id="score-b" type="number" min="0" max="100" step="1" value="2" required></label></div><button data-operation="submit" disabled>提交結果</button></form></section>
<section><h2>見證認證</h2><div class="actions"><button data-operation="beginVerification" disabled>開始認證</button><button data-operation="verifyResult" data-decision="approve" disabled>確認結果</button><button data-operation="verifyResult" data-decision="dispute" disabled>標記爭議</button></div></section>
<section><h2>風險審查與結算</h2><label>審查理由<textarea id="reason" maxlength="500" rows="3" placeholder="請說明檢查結果或保留風險的原因"></textarea></label><div class="actions"><button data-operation="reviewRisk" data-decision="clear" disabled>放行風險</button><button data-operation="reviewRisk" data-decision="hold" disabled>保留風險</button><button data-operation="settle" disabled>執行結算</button></div></section>
<footer><p id="message" role="status" aria-live="polite">等待登入。</p><button id="retry" hidden>重送上一筆操作</button><p class="note">只有被指派的內部人員可操作。結算後即鎖定結果。</p></footer></main><script type="module" src="/app.mjs"></script></body></html>
