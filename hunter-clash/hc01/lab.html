<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>獵人交鋒｜HC-01 本機驗收</title>
<style>body{margin:0;background:#0d1021;color:#edf0ff;font:16px system-ui;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:30px}p{color:#b7bed7;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#171c34;border:1px solid #3a4364;border-radius:18px;padding:22px}button,select,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #566083;margin:5px 0;background:#242e50;color:white}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.score{font-size:36px;font-weight:800;color:#edd484}.state{color:#a2adff}textarea{box-sizing:border-box;width:100%;height:100px;background:#0f1428;color:white;border:1px solid #566083;word-break:break-all}.row{display:flex;gap:8px;flex-wrap:wrap}#message{padding:12px;color:#edd484} @media(max-width:650px){body{padding:14px}.grid{grid-template-columns:1fr}}</style>
<main><p>BXH ARENA · HUNTER CLASH</p><h1>獵人交鋒</h1><p>本機流程驗收｜測試 A／B 帳號、4 分勝、配對碼 120 秒。資料僅存記憶體，不寫正式生涯或 Rating。此頁不代表手機雲端驗收。</p><div class="grid" id="players"></div><p id="message" role="status"></p></main>
<script type="module">
import{pairingPayload,parsePairingPayload}from'./pairing.mjs';
const state={A:null,B:null},busy={A:false,B:false};
const labels={proposed:'等待對手配對',accepted:'等待雙方準備',in_progress:'對戰中',round_pending:'等待本局確認',final_pending:'等待完賽確認',completed:'完賽紀錄已保存',disputed:'有爭議，保留紀錄',cancelled:'已取消',expired:'配對已過期',rejected:'已拒絕'};
const root=document.getElementById('players');
for(const uid of ['A','B']){const section=document.createElement('section');section.id=uid;section.innerHTML=`<h2>測試玩家 ${uid}</h2><div class="state">尚未配對</div><div class="score">0 : 0</div><p class="round"></p><textarea aria-label="${uid} 配對資料" placeholder="貼上另一方配對資料"></textarea><div class="row"><button data-op="createChallenge">建立挑戰</button><button data-op="accept">接受配對</button><button data-op="getChallenge">刷新</button></div><div class="row"><button data-op="start">我準備好了</button><button data-op="reject">拒絕</button><button data-op="cancel">取消</button></div><div class="row"><select class="winner"><option value="${uid}">我方得分</option><option value="${uid==='A'?'B':'A'}">對方得分</option></select><select class="finish"><option value="spin">轉停 +1</option><option value="knockout">擊飛 +2</option><option value="burst">爆裂 +2</option><option value="extreme">極限 +3</option></select><button data-op="proposeRound">送出本局</button></div><div class="row"><button data-op="confirmRound">確認本局</button><button data-op="confirmFinish">確認完賽</button><button data-op="dispute">有爭議</button></div>`;root.append(section);
section.addEventListener('click',async e=>{const op=e.target.dataset.op;if(!op||busy[uid])return;busy[uid]=true;let c=state[uid],input;
try{if(op==='createChallenge')input={requestId:crypto.randomUUID()};else if(op==='accept'){const p=parsePairingPayload(section.querySelector('textarea').value);input={...p,requestId:crypto.randomUUID(),expectedRevision:0};}else{if(!c)throw Error('請先建立或接受配對');input={challengeId:c.challengeId};if(op!=='getChallenge'){input.requestId=crypto.randomUUID();input.expectedRevision=c.revision;}
if(op==='proposeRound'){input.winnerUid=section.querySelector('.winner').value;input.finish=section.querySelector('.finish').value;}if(op==='confirmRound')input.roundRevision=c.pendingRound?.roundRevision;if(op==='confirmFinish')input.resultRevision=c.resultRevision;}
const response=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json',authorization:'Bearer '+uid},body:JSON.stringify({operation:op,input})});const result=await response.json();if(result.error)throw Error(result.error);state[uid]=result.challenge;
if(result.pairingToken)section.querySelector('textarea').value=pairingPayload(result.challenge.challengeId,result.pairingToken);
document.getElementById('message').textContent=op==='createChallenge'?'配對資料已建立，複製到另一方接受；正式掃碼介面將使用相同內容。':'操作成功。另一方按刷新查看最新狀態。';
}catch(error){document.getElementById('message').textContent=error.message==='revision-conflict'?'對戰狀態已更新，請先刷新。':error.message;}finally{busy[uid]=false;render(uid);}});}
function render(uid){const el=document.getElementById(uid),c=state[uid];el.querySelector('.state').textContent=c?labels[c.status]+' · 版本 '+c.revision:'尚未配對';el.querySelector('.score').textContent=c?c.score.a+' : '+c.score.b:'0 : 0';el.querySelector('.round').textContent=c?.pendingRound?'第 '+c.pendingRound.number+' 局：'+c.pendingRound.winnerUid+' 得 '+c.pendingRound.points+' 分，等待另一方確認。':c?'已確認 '+c.rounds.length+' 局':'';for(const button of el.querySelectorAll('button')){const op=button.dataset.op;button.disabled=busy[uid]||(op==='start'&&(!c||c.status!=='accepted'||c.ready.includes(uid)))||(op==='proposeRound'&&c?.status!=='in_progress')||(op==='confirmRound'&&(c?.status!=='round_pending'||c.pendingRound.confirmedBy.includes(uid)))||(op==='confirmFinish'&&(c?.status!=='final_pending'||c.finishConfirmedBy.includes(uid)))||(op==='dispute'&&!['round_pending','final_pending'].includes(c?.status));}}
render('A');render('B');
</script></html>
