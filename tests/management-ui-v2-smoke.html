<!doctype html><meta charset="utf-8"><title>Management UI V2 smoke tests</title><script src="../management-ui-v2.js"></script><pre id="out"></pre><script>
const M=window.BXH_MANAGEMENT_UI_V2, out=[];
function ok(name,cond){out.push((cond?"PASS ":"FAIL ")+name);if(!cond)document.body.dataset.failed="1"}
const admin=["management","registrations","settings","people","live","bracket","referee","duty","ladder","member-raffles","inventory-admin","operations","history","version"];
const staff=["live","bracket","duty","ladder","operations","history","version"];
ok("admin has five groups",M.visibleGroups(admin).length===5);
ok("field defaults to live",M.firstVisibleTab("field",admin)==="live");
ok("system defaults to operations",M.firstVisibleTab("system",admin)==="operations");
ok("staff event group hidden",!M.visibleGroups(staff).some(g=>g.id==="event"));
ok("staff activity group hidden",!M.visibleGroups(staff).some(g=>g.id==="activity"));
ok("referee resolves field",M.resolveActiveGroup("referee",admin).id==="field");
ok("inventory resolves activity",M.resolveActiveGroup("inventory-admin",admin).id==="activity");
document.getElementById("out").textContent=out.join("\n");
</script>
