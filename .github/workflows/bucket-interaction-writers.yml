name: Bucket interaction writer fences
on:
  pull_request:
    paths:
      - 'release/buckets/interactions/**'
      - 'release/buckets/writer-review-20261103.md'
      - 'tests/four-court-buckets/interactions/**'
      - '.github/workflows/bucket-interaction-writers.yml'
permissions:
  contents: read
jobs:
  isolated-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact patches and captured dependencies
        run: python3 -B tests/four-court-buckets/interactions/verify-package.py
      - name: Check marked-room denial, transaction races and unchanged legacy writes
        run: node tests/four-court-buckets/interactions/probe.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated native Emulator validation dependencies
        run: npm install --prefix /tmp/bucket-interactions --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0
      - name: Real Admin SDK transaction checks in a loopback demo project
        env:
          NODE_PATH: /tmp/bucket-interactions/node_modules
          GCLOUD_PROJECT: demo-bxh-bucket-interactions
          CI: true
        run: /tmp/bucket-interactions/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-bucket-interactions --config tests/four-court-buckets/interactions/firebase.emulator.json 'node tests/four-court-buckets/interactions/native-emulator.cjs'
