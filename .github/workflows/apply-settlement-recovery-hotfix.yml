name: Apply settlement recovery hotfix

on:
  push:
    branches:
      - hotfix/settlement-recovery-20260923
    paths:
      - 'scripts/apply-settlement-recovery-hotfix.py'
      - '.github/workflows/apply-settlement-recovery-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: bxh-settlement-recovery-hotfix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/settlement-recovery-20260923
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply targeted settlement recovery patch
        run: python3 scripts/apply-settlement-recovery-hotfix.py

      - name: Validate Production invariants
        run: |
          node scripts/verify-production-frontend.cjs
          node --experimental-vm-modules tests/ladder-settlement.cjs

      - name: Remove one-shot installer
        run: |
          rm -f scripts/apply-settlement-recovery-hotfix.py
          rm -f .github/workflows/apply-settlement-recovery-hotfix.yml

      - name: Commit patched Production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json scripts/verify-production-frontend.cjs scripts/apply-settlement-recovery-hotfix.py .github/workflows/apply-settlement-recovery-hotfix.yml
          git commit -m "fix(settlement): expose retry for stuck settlement phases"
          git push origin HEAD:hotfix/settlement-recovery-20260923
