name: Seated registration promotion
on:
  pull_request:
    paths: ['registration-promotion/**', 'tests/roster-recovery.test.cjs', 'tests/seated-roster-promotion.test.cjs', 'tests/roster-sync-race.test.cjs', 'modules/main-app/roster-recovery.js', 'modules/cloud/cloud-runtime.js', 'modules/main-app/core.js', '.github/workflows/registration-promotion.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test tests/roster-recovery.test.cjs tests/seated-roster-promotion.test.cjs tests/roster-sync-race.test.cjs
      - run: npm install --prefix /tmp/promotion-deps --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0 @firebase/rules-unit-testing@4.0.1 firebase@11.10.0
      - name: Verify atomic promotion transactions
        env:
          NODE_PATH: /tmp/promotion-deps/node_modules
        run: /tmp/promotion-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-seated-promotion --config registration-promotion/firebase.emulator.json 'node --test registration-promotion/firestore.test.cjs registration-promotion/seat-guard.test.cjs'
