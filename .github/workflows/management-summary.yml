name: Management Summary Browser
on:
  pull_request:
    paths: ['management-summary/**', 'modules/main-app/core.js', 'modules/cloud/cloud-runtime.js', 'tests/management-loading.test.cjs', 'tests/e2e/management-loading.spec.cjs', 'playwright.management-summary.config.cjs', '.github/workflows/management-summary.yml']
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test management-summary/service.test.cjs tests/management-loading.test.cjs tests/partner-workspace-access.test.cjs
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-package-lock --ignore-scripts
      - run: npx playwright test --config=playwright.management-summary.config.cjs --workers=2
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm install --prefix management-summary/functions --no-package-lock --ignore-scripts
      - run: npx firebase emulators:exec --project demo-bxh-management-summary --config management-summary/firebase.emulator.json --only firestore "node --test management-summary/emulator.test.cjs"
