name: Bucket poster metadata writer
on:
  pull_request:
    paths:
      - 'release/buckets/poster/**'
      - 'tests/four-court-buckets/poster/**'
      - '.github/workflows/bucket-poster-writers.yml'
permissions:
  contents: read
jobs:
  poster-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact captured module and protocol overlay
        run: python3 -B tests/four-court-buckets/poster/verify-package.py
      - name: Legacy, bucket metadata, upload failure and generation regressions
        run: node tests/four-court-buckets/poster/probe.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated SDK and emulator dependencies
        run: npm install --prefix /tmp/bucket-poster --no-save --ignore-scripts firebase-tools@14 firebase-admin@14.4.0 firebase-functions@7.3.2
      - name: Native transaction authority, generation and lost-response acceptance
        env:
          NODE_PATH: /tmp/bucket-poster/node_modules
          GCLOUD_PROJECT: demo-bxh-bucket-posters
        run: /tmp/bucket-poster/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-bucket-posters --config tests/four-court-buckets/poster/firebase.json 'node tests/four-court-buckets/poster/native-emulator.cjs'
      - name: Preserve native poster transaction diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-poster-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
