name: ARENA Windows Install Preflight Only
on:
  push:
    branches: ['exp/windows-preflight-20261120']
    paths:
      - 'tests/windows-private-preflight/**'
      - '.github/workflows/windows-private-preflight.yml'
permissions:
  contents: read
concurrency:
  group: arena-windows-preflight-only
  cancel-in-progress: false
jobs:
  windows-preflight:
    if: github.ref == 'refs/heads/exp/windows-preflight-20261120'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: tests/windows-private-preflight
    env:
      CI: 'true'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_ENGINE_STRICT: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      FIREBASE_CLI_DISABLE_USAGE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          architecture: x64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Install lock-resolved test packages only, no lifecycle scripts
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          foreach ($dir in @('functions', 'frontend', 'cli')) {
            Push-Location $dir
            npm ci --ignore-scripts --no-audit --no-fund --engine-strict --update-notifier=false 2>&1 | Tee-Object "../evidence/$dir-install.txt"
            if ($LASTEXITCODE -ne 0) { throw "Package install failed: $dir" }
            npm ls --all --json --offline --ignore-scripts --no-audit --no-fund --update-notifier=false > "../evidence/$dir-tree.json"
            if ($LASTEXITCODE -ne 0) { throw "Package resolution failed: $dir" }
            Pop-Location
          }
      - name: Actual Windows read-only preflight and dummy process tests
        run: |
          node inspect.cjs
          if ($LASTEXITCODE -ne 0) { throw "Preflight failed" }
          node --test process.test.cjs preflight.test.cjs 2>&1 | Tee-Object evidence/process-tests.txt
          if ($LASTEXITCODE -ne 0) { throw "Pure/process tests failed" }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw "Tracked input changed" }
      - name: Retain preflight evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-windows-install-preflight-only
          path: tests/windows-private-preflight/evidence/
          retention-days: 7
          if-no-files-found: warn
