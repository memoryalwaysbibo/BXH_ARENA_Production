name: Deploy Production Pages - Validated Only

on:
  workflow_run:
    workflows:
      - Validate Production Frontend RC1
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

# Safety Gate 2.0: Production is a single-writer resource.
# Never cancel an in-flight deployment; later validated commits wait their turn.
concurrency:
  group: production-pages-single-writer
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated production build
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Queue acquired - verify validated commit is still current main HEAD
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          latest="$(git rev-parse origin/main)"
          validated="${{ github.event.workflow_run.head_sha }}"
          if [ "$latest" != "$validated" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Stale validated commit; skip deploy. validated=$validated latest=$latest"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Validated commit is current main HEAD: $validated"
          fi

      - name: Re-verify production entrypoint before deploy
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          bytes="$(wc -c < index.html | tr -d ' ')"
          lines="$(wc -l < index.html | tr -d ' ')"
          # Core modularization intentionally shrank index.html. Guard the shell
          # entrypoint itself, then verify the modular runtime assets it delegates to.
          if [ "$bytes" -lt 50000 ] || [ "$lines" -lt 150 ]; then
            echo "DEPLOY BLOCKED: index.html looks empty or truncated: bytes=$bytes lines=$lines" >&2
            exit 1
          fi
          test -s modules/main-app/core.js
          test -s modules/cloud/cloud-runtime.js
          test -s modules/main-app/domain-utils.js
          grep -qi '<!doctype html' index.html
          grep -qi '<html' index.html
          grep -q 'BXH ARENA' index.html
          grep -q 'bxh-environment" content="production' index.html
          grep -qi '</html>' index.html
          echo "Deploy guard OK: bytes=$bytes lines=$lines"

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build private-data-free public Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        id: public_site
        shell: bash
        run: |
          set -euo pipefail
          public_site="$(mktemp -d)"
          node scripts/prepare-public-pages.cjs "$public_site"
          echo "path=$public_site" >> "$GITHUB_OUTPUT"

      - name: Upload exact validated site artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.public_site.outputs.path }}

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4


      - name: Verify deployed production build matches validated artifact
        if: steps.freshness.outputs.deploy == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(tr -d '\r\n' < CNAME)"
          if [[ ! "$host" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid production CNAME; refusing public health check." >&2
            exit 1
          fi
          base="https://$host"
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          verified=false
          for attempt in {1..12}; do
            verified=true
            for path in version.json index.html modules/main-app/core.js modules/cloud/cloud-runtime.js modules/main-app/qr-checkin.js modules/main-app/qr-checkin-fence.js modules/main-app/roster-view.js modules/main-app/bracket-commit.js modules/main-app/player-cards.js modules/referee-license/ui.js modules/referee-license/domain.js modules/referee-license/styles.css modules/referee-license/fonts/bxh-kai-subset.ttf; do
              expected="$(sha256sum "$path" | cut -d ' ' -f 1)"
              status="$(curl --silent --show-error --location --compressed --max-time 12 --output "$scratch/served" --write-out '%{http_code}' "$base/$path?deployment_check=$EXPECTED_COMMIT" 2>/dev/null || true)"
              actual="$(sha256sum "$scratch/served" 2>/dev/null | cut -d ' ' -f 1 || true)"
              if [[ "$status" != "200" || "$actual" != "$expected" ]]; then
                verified=false
                echo "Waiting for deployed artifact: path=$path http=$status attempt=$attempt"
                break
              fi
            done
            if [[ "$verified" == "true" ]]; then break; fi
            sleep 5
          done
          if [[ "$verified" != "true" ]]; then
            echo "Production Pages is not serving the exact validated build $EXPECTED_COMMIT." >&2
            exit 1
          fi
          for private_path in qr-checkin/reference/writer-handlers.json referee-certificates/functions/initial-preview.json referee-certificates/functions/identities.cjs referee-certificates/REVIEW-REGRESSION-MAP.md scripts/preview-referee-initialization.cjs tests/room-host-identity-regression.test.cjs; do
            private_status="$(curl --silent --show-error --location --max-time 12 --output /dev/null --write-out '%{http_code}' "$base/$private_path?deployment_check=$EXPECTED_COMMIT")"
            if [[ "$private_status" != "404" ]]; then
              echo "Private source must be absent from public artifact: path=$private_path http=$private_status" >&2
              exit 1
            fi
          done
          echo "Production Pages serves the exact validated artifacts for $EXPECTED_COMMIT."
          build="$(jq -er '.build' version.json)"
          version="$(jq -er '.version' version.json)"
          {
            echo "### Production deployment verified"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            printf '| Build | `%s` |\n' "$build"
            printf '| Version | `%s` |\n' "$version"
            printf '| Source commit | `%s` |\n' "$EXPECTED_COMMIT"
            printf '| Public site | https://%s/ |\n' "$host"
            echo "| Artifact parity | Exact SHA-256 match: version.json, index.html, Core, cloud runtime, QR, player cards and referee runtime; private backend, identity and QA sources absent |"
          } >> "$GITHUB_STEP_SUMMARY"
