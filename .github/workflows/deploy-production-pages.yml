name: Deploy Production Pages - Validated Only

on:
  workflow_run:
    workflows:
      - Validate Production Frontend RC1
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated production build
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify validated commit is still current main HEAD
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          latest="$(git rev-parse origin/main)"
          validated="${{ github.event.workflow_run.head_sha }}"
          if [ "$latest" != "$validated" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Stale validated commit; skip deploy. validated=$validated latest=$latest"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Validated commit is current main HEAD: $validated"
          fi

      - name: Re-verify production entrypoint before deploy
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          bytes="$(wc -c < index.html | tr -d ' ')"
          lines="$(wc -l < index.html | tr -d ' ')"
          if [ "$bytes" -lt 100000 ] || [ "$lines" -lt 1000 ]; then
            echo "DEPLOY BLOCKED: index.html looks empty or truncated: bytes=$bytes lines=$lines" >&2
            exit 1
          fi
          grep -qi '<!doctype html' index.html
          grep -qi '<html' index.html
          grep -q 'BXH ARENA' index.html
          grep -q 'bxh-environment" content="production' index.html
          grep -qi '</html>' index.html
          echo "Deploy guard OK: bytes=$bytes lines=$lines"

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload exact validated site artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
