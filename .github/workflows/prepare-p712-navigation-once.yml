name: Prepare P7.12.1 isolated branch patch
on:
  push:
    branches: [fix/p7-12-navigation-safety-20260925]
    paths: [.github/workflows/prepare-p712-navigation-once.yml]
permissions:
  contents: write
concurrency:
  group: prepare-p712-navigation-once
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'memoryalwaysbibo/BXH_ARENA_Production' && github.ref == 'refs/heads/fix/p7-12-navigation-safety-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p7-12-navigation-safety-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact-marker patch and run offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/p7-12-navigation-safety-20260925'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/prepare-p712-navigation.cjs
          node tests/venue-navigation.test.cjs
          node scripts/verify-production-frontend.cjs
          node --experimental-vm-modules tests/ladder-v1.cjs
          node --experimental-vm-modules tests/ladder-settlement.cjs
          git diff --check
      - name: Commit tested patch to feature branch and remove preparation workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prepare-p712-navigation-once.yml
          git add index.html version.json .github/workflows/validate-production-frontend.yml
          git commit -m 'fix(venue): preserve explicit clears, safe maps and accessible navigation'
          git push origin HEAD:refs/heads/fix/p7-12-navigation-safety-20260925
