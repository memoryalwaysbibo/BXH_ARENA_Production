name: Four-court score buckets lab
on:
  pull_request:
    paths:
      - 'modules/scoring/four-court-buckets.cjs'
      - 'modules/scoring/four-court-client.cjs'
      - 'modules/scoring/four-court-referee-lab.js'
      - 'referee-seats/functions/bucket-*.cjs'
      - 'referee-seats/functions/scoring-core.cjs'
      - 'referee-seats/functions/scoring-service.cjs'
      - 'referee-seats/functions/bucket-legacy-fence.cjs'
      - 'referee-seats/firestore.candidate.rules'
      - 'referee-seats/build-rules.py'
      - 'referee-seats/firebase.buckets-lab.json'
      - 'qr-checkin/backend/firebase-callable.cjs'
      - 'qr-checkin/backend/overlays/roster-service.js'
      - 'qr-checkin/backend/overlays/room-access-service.js'
      - 'qr-checkin/backend/onsite/firestore-store.cjs'
      - 'qr-checkin/backend/overlays/hosting.js'
      - 'qr-checkin/backend/guard-firestore.cjs'
      - 'tests/four-court-buckets/**'
      - 'docs/four-court-buckets.md'
      - '.github/workflows/four-court-buckets-lab.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify routing and isolation
        run: node --test referee-seats/scoring.test.cjs tests/four-court-buckets/unit.test.cjs tests/four-court-buckets/trusted.test.cjs tests/four-court-buckets/legacy-fence.test.cjs tests/four-court-buckets/client.test.cjs
      - name: Install isolated emulator dependencies
        run: npm install --prefix /tmp/bxh-four-court-deps --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0 firebase-functions@6.6.0 playwright@1.55.0 firebase@12 @firebase/rules-unit-testing@5
      - name: Reject legacy client writes for bucket rooms
        env:
          NODE_PATH: /tmp/bxh-four-court-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-four-court-buckets
        run: /tmp/bxh-four-court-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-four-court-buckets --config referee-seats/firebase.buckets-lab.json 'node tests/four-court-buckets/rules-fence.cjs'
      - name: Simulate 6 and 12 courts against Firestore Emulator
        env:
          NODE_PATH: /tmp/bxh-four-court-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-four-court-buckets
        run: /tmp/bxh-four-court-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-four-court-buckets --config tests/four-court-buckets/firebase.json 'node tests/four-court-buckets/emulator.cjs'
      - name: Verify trusted scoring, replay and cross-bucket advancement
        env:
          NODE_PATH: /tmp/bxh-four-court-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-four-court-buckets
        run: /tmp/bxh-four-court-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-four-court-buckets --config tests/four-court-buckets/firebase.json 'node tests/four-court-buckets/trusted-emulator.cjs'
      - name: Install isolated browser
        run: node /tmp/bxh-four-court-deps/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify referee handover and reconnect with Emulator subscriptions
        env:
          NODE_PATH: /tmp/bxh-four-court-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-four-court-buckets
        run: /tmp/bxh-four-court-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-four-court-buckets --config tests/four-court-buckets/firebase.json 'node tests/four-court-buckets/browser-emulator.cjs'
      - name: Retain measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-court-buckets-lab
          path: test-results/four-court-buckets/
          if-no-files-found: warn
          retention-days: 14
