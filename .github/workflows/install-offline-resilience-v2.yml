name: Install Offline Resilience V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-offline-resilience-v2.yml']
permissions:
  contents: write
concurrency:
  group: bxh-arena-offline-resilience-v2
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Apply structural offline patch
        shell: python
        run: |
          from pathlib import Path
          import json
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f"{label}: expected 1 anchor, got {c}")
              s=s.replace(old,new,1)
          if "offline-resilience.js?v=20260930-offline-v2" in s:
              raise SystemExit("offline resilience already wired")
          once('<meta name="bxh-build" content="20260930.3">','<meta name="bxh-build" content="20260930.4">',"meta build")
          once('var CURRENT_BUILD="20260930.3";','var CURRENT_BUILD="20260930.4";',"current build")
          once('const APP_VERSION = "v14.3.12";','const APP_VERSION = "v14.3.13";',"app version")
          once('let cloudTestResult = null;','let cloudTestResult = null;\nlet offlineQueueStatus={pending:0,conflict:0,failed:0,total:0};',"queue status")
          helper=r'''async function queueOfflineMatchConfirmation(matchId,mode,selectedWinnerId){
            const m=getMatch(matchId);if(!m||!state.cloudCode||!window.BXHOfflineQueue)return false;
            const ref=currentRefereeIdentity(),actor=ref.name||adminDisplayName||(userProfile&&userProfile.email)||"admin";
            const ev=mode==="quick_decision"?evaluateQuickDecision(m,selectedWinnerId):evaluateMatchCompletion(m);if(!ev.ok)return false;
            await window.BXHOfflineQueue.enqueue({tournamentCode:String(state.cloudCode).toUpperCase(),matchId:m.id,station:Number(m.station||0),dispatchRevision:m.dispatchRevision||0,mode:mode||"score",selectedWinnerId:ev.winnerId,playerAId:m.a&&m.a.playerId||null,playerBId:m.b&&m.b.playerId||null,scoreA:m.scoreA,scoreB:m.scoreB,log:Array.isArray(m.log)?JSON.parse(JSON.stringify(m.log)):[],faultActions:Array.isArray(m.faultActions)?JSON.parse(JSON.stringify(m.faultActions)):[],actorUid:ref.uid||null,actorName:actor,auditMeta:{recordDuty:ref.isStaff,uid:ref.uid,matchId:m.id,tournamentName:(state.meta&&state.meta.name)||"",station:Number(m.station||0),dispatchRevision:m.dispatchRevision||0,roundLabel:refereeStageLabel(m),playerA:m.a?playerName(m.a.playerId):"",playerB:m.b?playerName(m.b.playerId):"",winnerName:playerName(ev.winnerId),resultMethod:mode==="quick_decision"?"quick_decision":"score",eventAuthority:(state.meta&&state.meta.eventAuthority)||"official"}});
            if(mode==="quick_decision")applyQuickDecisionFields(m,ev,actor);else applyMatchCompletionFields(m,ev,actor);
            m.offlinePendingSync=true;m.offlineOperationQueuedAt=Date.now();rebuildPropagation();await saveRecord(cloneStateForSave(state));render();showToast("目前離線：比賽結果已安全暫存，恢復網路後會自動驗證並同步雲端。",true);return true;
          }

          '''
          once('async function confirmResultWithCloudGuard(matchId){',helper+'async function confirmResultWithCloudGuard(matchId){',"score function")
          score_anchor='''  if(!(state.cloudCode && cloudAvailable() && window.cloudSync.confirmMatchTransaction)){
            return confirmResult(matchId);
          }'''
          score_new='''  if(state.cloudCode && typeof navigator!=="undefined" && navigator.onLine===false){
            return await queueOfflineMatchConfirmation(matchId,"score",localEval.winnerId);
          }
          '''+score_anchor
          once(score_anchor,score_new,"score offline guard")
          quick_anchor='''  if(!(state.cloudCode && cloudAvailable() && window.cloudSync.confirmMatchTransaction)){
            return confirmQuickDecision(matchId, selectedWinnerId);
          }'''
          quick_new='''  if(state.cloudCode && typeof navigator!=="undefined" && navigator.onLine===false){
            return await queueOfflineMatchConfirmation(matchId,"quick_decision",selectedWinnerId);
          }
          '''+quick_anchor
          once(quick_anchor,quick_new,"quick offline guard")
          adapter=r'''  window.BXHCommitOfflineMatch=async function(op){
            if(!op||!op.tournamentCode||!window.cloudSync||!window.cloudSync.confirmMatchTransaction)return {ok:false,reason:"cloud-unavailable"};
            if(currentAuthUid()!==op.actorUid)return {ok:false,reason:"permission-denied"};
            return await window.cloudSync.confirmMatchTransaction(op.tournamentCode,(remoteState)=>{
              rebuildPropagationForState(remoteState);
              const m=(remoteState.matches||[]).find(x=>x.id===op.matchId);if(!m)return{ok:false,reason:"not-found"};
              if(m.completed||m.winnerId)return{ok:false,reason:"already-completed"};
              if(Number(m.station||0)!==Number(op.station||0))return{ok:false,reason:"station-mismatch"};
              if((m.dispatchRevision||0)!==(op.dispatchRevision||0))return{ok:false,reason:"dispatch-stale"};
              if(!m.a||!m.b||m.a.playerId!==op.playerAId||m.b.playerId!==op.playerBId)return{ok:false,reason:"player-mismatch"};
              let ev;if(op.mode==="quick_decision")ev=evaluateQuickDecision(m,op.selectedWinnerId);else{m.scoreA=op.scoreA;m.scoreB=op.scoreB;m.log=Array.isArray(op.log)?op.log:[];m.faultActions=Array.isArray(op.faultActions)?op.faultActions:[];ev=evaluateMatchCompletion(m);}
              if(!ev.ok||ev.winnerId!==op.selectedWinnerId)return{ok:false,reason:(ev&&ev.reason)||"validation-failed"};
              if(op.mode==="quick_decision")applyQuickDecisionFields(m,ev,op.actorName);else applyMatchCompletionFields(m,ev,op.actorName);
              delete m.offlinePendingSync;delete m.offlineOperationQueuedAt;rebuildPropagationForState(remoteState);return{ok:true,state:remoteState};
            },op.auditMeta||{});
          };
          window.addEventListener("bxh-offline-operation-synced",(e)=>{try{const d=e.detail||{},op=d.op||{},r=d.result||{};if(state.cloudCode&&String(state.cloudCode).toUpperCase()===String(op.tournamentCode||"").toUpperCase()&&r.state){const keep=state.cloudCode;state=Object.assign(defaultState(r.state.id),r.state);state.cloudCode=keep;rebuildPropagation();saveRecord(state);cloudStatus="connected";cloudLastSyncAt=Date.now();render();}showToast("離線賽事資料已完成雲端同步");}catch(err){}});
          window.addEventListener("bxh-offline-operation-conflict",()=>{cloudStatus="error";render();showToast("離線資料與雲端賽事發生衝突，系統已停止自動覆寫，請由管理員確認。",true);});
          window.addEventListener("bxh-offline-operation-failed",()=>{cloudStatus="error";render();showToast("離線資料多次同步失敗，已停止自動重試並保留紀錄，請確認網路後再處理。",true);});
          window.addEventListener("bxh-offline-queue-change",(e)=>{offlineQueueStatus=Object.assign({pending:0,conflict:0,failed:0,total:0},(e&&e.detail)||{});render();});

          '''
          once('  tryInitFirebase().then((ok)=>{',adapter+'  tryInitFirebase().then((ok)=>{',"replay adapter")
          once('<script src="activity-points-ui.js?v=20260928-account-frame-fix5"></script>','<script src="offline-resilience.js?v=20260930-offline-v2"></script>\n<script src="activity-points-ui.js?v=20260928-account-frame-fix5"></script>',"module loader")
          # Hard post-patch gates.
          gates={
            "helper":'async function queueOfflineMatchConfirmation(',
            "score":'queueOfflineMatchConfirmation(matchId,"score",localEval.winnerId)',
            "quick":'queueOfflineMatchConfirmation(matchId,"quick_decision",selectedWinnerId)',
            "replay":'window.BXHCommitOfflineMatch=async function(op)',
            "module":'offline-resilience.js?v=20260930-offline-v2'
          }
          for name,needle in gates.items():
              c=s.count(needle)
              if c!=1: raise SystemExit(f"gate {name}: expected 1, got {c}")
          p.write_text(s,encoding="utf-8")
          v=Path("version.json"); d=json.loads(v.read_text(encoding="utf-8"))
          if d.get("version")!="v14.3.12" or d.get("build")!="20260930.3": raise SystemExit("version base changed")
          d.update({"version":"v14.3.13","build":"20260930.4","updatedAt":"2026-09-30T11:30:00+08:00"})
          v.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
      - name: Hard gates and production guard
        run: |
          test -s offline-resilience.js
          grep -Fq 'queueOfflineMatchConfirmation(matchId,"score",localEval.winnerId)' index.html
          grep -Fq 'queueOfflineMatchConfirmation(matchId,"quick_decision",selectedWinnerId)' index.html
          grep -Fq 'window.BXHCommitOfflineMatch=async function(op)' index.html
          grep -Fq 'offline-resilience.js?v=20260930-offline-v2' index.html
          grep -Fq '"version": "v14.3.13"' version.json
          grep -Fq '"build": "20260930.4"' version.json
          node scripts/verify-production-frontend.cjs
      - name: Commit only after PASS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git rm .github/workflows/install-offline-resilience-v2.yml
          git commit -m "feat: enable offline resilience v14.3.13"
          git push origin HEAD:main
