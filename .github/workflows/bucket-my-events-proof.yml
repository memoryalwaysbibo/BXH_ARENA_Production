name: Bucket My Events lifecycle proof
on:
  pull_request:
    paths:
      - 'tests/four-court-buckets/my-events/**'
      - 'tests/four-court-buckets/settlement/**'
      - 'release/buckets/settlement/**'
      - 'release/buckets/my-events/**'
      - '.github/workflows/bucket-my-events-proof.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/four-court-buckets/my-events/probe.cjs
      - run: node tests/four-court-buckets/my-events/candidate-probe.cjs
