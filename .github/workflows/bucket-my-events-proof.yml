name: Bucket My Events lifecycle proof
on:
  pull_request:
    paths:
      - 'tests/four-court-buckets/my-events/**'
      - 'tests/four-court-buckets/settlement/**'
      - 'release/buckets/settlement/**'
      - 'release/buckets/my-events/**'
      - '.github/workflows/bucket-my-events-proof.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/four-court-buckets/my-events/probe.cjs
      - run: node tests/four-court-buckets/my-events/candidate-probe.cjs
      - run: node --test tests/four-court-buckets/my-events/reader-seam.test.cjs
      - run: node --test tests/four-court-buckets/my-events/patch-readers.test.cjs
      - run: node --test tests/four-court-buckets/my-events/repair-target.test.cjs
      - run: node --test tests/four-court-buckets/my-events/repair-engine-patch.test.cjs
      - run: node --test tests/four-court-buckets/my-events/bootstrap-target.test.cjs
      - run: node --test tests/four-court-buckets/my-events/bootstrap-patch.test.cjs
      - run: node --test tests/four-court-buckets/my-events/service-patch.test.cjs
      - run: node --test tests/four-court-buckets/my-events/assembly-patch.test.cjs tests/four-court-buckets/my-events/bootstrap-start-patch.test.cjs
      - run: node --test tests/four-court-buckets/my-events/rebuild-patch.test.cjs
