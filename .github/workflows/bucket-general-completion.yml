name: Bucket general completion and hosting
on:
  pull_request:
    paths:
      - 'release/buckets/completion/**'
      - 'tests/four-court-buckets/completion/**'
      - '.github/workflows/bucket-general-completion.yml'
      - 'scripts/bucketcapturehostsync.py'
permissions:
  contents: read
jobs:
  completion-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify captured hosting sources and exact patches
        run: python3 -B tests/four-court-buckets/completion/verify-package.py
      - name: General completion and hosting regressions
        run: |
          node tests/four-court-buckets/completion/probe.cjs
          node tests/four-court-buckets/completion/hosting-probe.cjs
          python3 -B tests/four-court-buckets/completion/capture-host-sync.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated validation dependencies
        run: npm install --prefix /tmp/bucket-completion --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0 firebase-functions@6.6.0
      - name: Native atomic completion, host count and rebuild contention
        env:
          NODE_PATH: /tmp/bucket-completion/node_modules
          GCLOUD_PROJECT: demo-bxh-four-court-buckets
        run: /tmp/bucket-completion/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-four-court-buckets --config tests/four-court-buckets/completion/native.firebase.json 'node tests/four-court-buckets/completion/native-emulator.cjs'
