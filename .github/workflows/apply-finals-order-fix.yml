name: Apply finals order fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch finals scheduling gate
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function activeSingleElimSchedulePhase(matches=state.matches){
            const unfinished=matches.filter(m=>m.bracket==="SE" && !m.isBye && !m.completed);
            if(!unfinished.length) return null;
            const round=Math.min(...unfinished.map(m=>Number(m.round)||0));
            const inRound=unfinished.filter(m=>Number(m.round||0)===round);
            const tier=Math.min(...inRound.map(m=>singleElimScheduleTier(m,matches)));
            return {round,tier};
          }

          function isInActiveSingleElimPhase(match, phase, matches=state.matches){
            if(!phase) return true;
            return match.bracket==="SE" && Number(match.round||0)===phase.round && singleElimScheduleTier(match,matches)===phase.tier;
          }'''
          new='''function activeSingleElimSchedulePhase(matches=state.matches, meta=state.meta){
            // Global finals gate: when a single-elimination event has an enabled bronze
            // match and both semifinal losers are known, 季殿 must be completed BEFORE
            // 冠亞 can be dispatched on any court.  BZ lives outside the SE tree, so it
            // has to be promoted to an explicit scheduling phase here.
            const bronzeEnabled=!!(meta&&meta.bronzeMatch);
            const bronze=bronzeEnabled?matches.find(m=>m&&m.bracket==="BZ"&&!m.isBye&&!m.completed&&m.a&&m.b):null;
            if(bronze) return {kind:"bronze",matchId:bronze.id};

            const unfinished=matches.filter(m=>m.bracket==="SE" && !m.isBye && !m.completed);
            if(!unfinished.length) return null;
            const round=Math.min(...unfinished.map(m=>Number(m.round)||0));
            const inRound=unfinished.filter(m=>Number(m.round||0)===round);
            const tier=Math.min(...inRound.map(m=>singleElimScheduleTier(m,matches)));
            return {kind:"se",round,tier};
          }

          function isInActiveSingleElimPhase(match, phase, matches=state.matches){
            if(!phase) return true;
            if(phase.kind==="bronze") return match.bracket==="BZ" && match.id===phase.matchId;
            return match.bracket==="SE" && Number(match.round||0)===phase.round && singleElimScheduleTier(match,matches)===phase.tier;
          }'''
          assert s.count(old)==1, 'phase block mismatch'
          s=s.replace(old,new)
          old2='''      const samePhase=available.filter(m=>isInActiveSingleElimPhase(m,phase));
                const laterReady=available.filter(m=>!isInActiveSingleElimPhase(m,phase));
                available=samePhase.concat(laterReady);'''
          new2='''      // Hard global phase gate. Do not merely sort later rounds behind the active
                // phase: on multi-court events another court could otherwise start 冠亞
                // while 季殿 is still pending.
                available=available.filter(m=>isInActiveSingleElimPhase(m,phase));'''
          assert s.count(old2)==1, 'available block mismatch'
          s=s.replace(old2,new2)
          old3='activeSingleElimSchedulePhase(st.matches):null;'
          new3='activeSingleElimSchedulePhase(st.matches,st.meta):null;'
          assert s.count(old3)==1, 'idle court call mismatch'
          s=s.replace(old3,new3)
          p.write_text(s)
      - name: Verify patch
        run: |
          grep -q 'if(bronze) return {kind:"bronze",matchId:bronze.id};' index.html
          grep -q 'available=available.filter(m=>isInActiveSingleElimPhase(m,phase));' index.html
          grep -q 'activeSingleElimSchedulePhase(st.matches,st.meta)' index.html
      - name: Commit
        run: |
          git config user.name 'BXH ARENA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: enforce bronze match before championship final'
          git push origin HEAD:main
