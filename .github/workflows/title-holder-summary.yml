name: Exclusive title holder UI
on:
  pull_request:
    paths: ['modules/main-app/title-utils.js', 'modules/main-app/core.js', 'index.html', 'tests/title-holder-summary.test.cjs', '.github/workflows/title-holder-summary.yml']
  push:
    branches: [main]
    paths: ['modules/main-app/title-utils.js', 'modules/main-app/core.js', 'index.html', 'tests/title-holder-summary.test.cjs', '.github/workflows/title-holder-summary.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/title-holder-summary.test.cjs tests/module-seam-contracts.test.cjs
