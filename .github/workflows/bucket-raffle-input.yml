name: Bucket raffle native input
on:
  pull_request:
    paths:
      - 'release/buckets/raffle/**'
      - 'release/buckets/completion/certificate.cjs'
      - 'release/buckets/completion/protocol/**'
      - 'tests/four-court-buckets/raffle/**'
      - 'tests/four-court-buckets/completion/fixture.cjs'
      - 'tests/four-court-buckets/operations/fixtures/5/**'
      - 'tests/four-court-buckets/operations/fixture-sha256.json'
      - 'release/buckets/operations/patch-manifest.json'
      - 'scripts/build-bucket-raffle-review.py'
      - '.github/workflows/bucket-raffle-input.yml'
permissions:
  contents: read
jobs:
  native-input:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check fixture contract
        run: |
          node tests/four-court-buckets/raffle/input-probe.cjs
          node tests/four-court-buckets/raffle/identity-probe.cjs
          node tests/four-court-buckets/raffle/preview-probe.cjs
          node tests/four-court-buckets/raffle/writer-probe.cjs
          python3 -B tests/four-court-buckets/raffle/verify-provenance.py
      - name: Install isolated SDK and emulator
        run: npm install --prefix /tmp/bucket-raffle-input --no-save --ignore-scripts firebase-tools@14 firebase-admin@14.4.0 firebase-functions@7.3.2
      - name: Verify native snapshots, transactions and authenticated Callable endpoints
        env:
          NODE_PATH: /tmp/bucket-raffle-input/node_modules
          GCLOUD_PROJECT: demo-bxh-bucket-raffle
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8198
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9197
        run: |
          lab="$(mktemp -d "${RUNNER_TEMP}/raffle-native.XXXXXX")"
          cp tests/four-court-buckets/raffle/native.firebase.json "$lab/firebase.json"
          python3 -B scripts/build-bucket-raffle-review.py --fixture-tree --output "$lab/functions"
          ln -s "$NODE_PATH" "$lab/functions/node_modules"
          printf '%s\n' '{"name":"raffle-demo","private":true,"main":"index.cjs","engines":{"node":"22"},"dependencies":{"firebase-admin":"14.4.0","firebase-functions":"7.3.2"}}' > "$lab/functions/package.json"
          cat > "$lab/functions/index.cjs" <<'JS'
          if (process.env.GCLOUD_PROJECT !== 'demo-bxh-bucket-raffle' ||
              process.env.FIRESTORE_EMULATOR_HOST !== '127.0.0.1:8198' ||
              process.env.FIREBASE_AUTH_EMULATOR_HOST !== '127.0.0.1:9197') {
            throw Error('Isolated raffle emulators required');
          }
          require('firebase-admin/app').initializeApp({projectId: process.env.GCLOUD_PROJECT});
          const {previewTournamentRaffle, drawTournamentRaffle, updateTournamentRaffleWinner} = require('./operations.js');
          module.exports = {previewTournamentRaffle, drawTournamentRaffle, updateTournamentRaffleWinner};
          JS
          /tmp/bucket-raffle-input/node_modules/.bin/firebase emulators:exec --only firestore,auth,functions \
            --project "$GCLOUD_PROJECT" --config "$lab/firebase.json" \
            'node tests/four-court-buckets/raffle/native-input.cjs && node tests/four-court-buckets/raffle/native-writers.cjs && node tests/four-court-buckets/raffle/native-rollback.cjs && node tests/four-court-buckets/raffle/native-callable.cjs'
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-raffle-input-diagnostics
          path: |
            firestore-debug.log
            firebase-debug.log
          retention-days: 7
          if-no-files-found: warn
