name: Prepare five-point enchantment frontend
on:
  push:
    branches: [fix/enchantment-five-points-20260929]
    paths: [.github/workflows/enchantment-five-points-20260929.yml]
permissions:
  contents: write
concurrency:
  group: enchantment-five-points-20260929
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'memoryalwaysbibo/BXH_ARENA_Production' && github.ref == 'refs/heads/fix/enchantment-five-points-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enchantment-five-points-20260929
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped threshold, label and release metadata changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import hashlib, re, json
          def read_checked(name, expected):
            raw=Path(name).read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            if actual != expected: raise SystemExit('Source changed; review required: '+name)
            return raw.decode()
          edits = {
            'enchantment-round-core.js': ('f34e8b7c53f5132d5f396b1f25e73a0dfb7b14d2', [
              ('n.scores[side]>=6', 'n.scores[side]>=5', 2),
              ('n.scores.A>=6', 'n.scores.A>=5', 1)]),
            'tests/enchantment-round-core.test.cjs': ('e53d8bcdc4eff25e0b0b60480d404abe59f4ca24', [
              ('six points ends enchantment match; five points continue', 'five points ends enchantment match; four points continue', 1),
              ("flow.create('M6'", "flow.create('M5'", 1),
              ('round<=6', 'round<=5', 1),
              ('round===6', 'round===5', 1)]),
            'enchantment-ui.js': ('42d2eca5b6605e19fb92f098485c1ed713ec52fe', [
              ('<strong data-enchantment-title>附魔之戰｜等待裁判開始', '<strong data-enchantment-title>附魔之戰｜5 分制｜等待裁判開始', 1),
              ("title.textContent='附魔之戰｜'+", "title.textContent='附魔之戰｜5 分制｜'+", 1)])
          }
          for name, (expected, replacements) in edits.items():
            text=read_checked(name,expected)
            for before, after, count in replacements:
              if text.count(before) != count: raise SystemExit('Unexpected match count: '+name+' '+before)
              text=text.replace(before,after)
            Path(name).write_text(text)
          html=read_checked('index.html','34c74505a45f72514d67584c7db1eb74e4804f6f')
          version=json.loads(read_checked('version.json','9800774f0715eb8020c1dd2c6b4f5dc17de4fa39'))
          assert version['build']=='20260929.5' and version['version']=='v14.3.4', version
          for before, after in [
            ('<meta name="bxh-build" content="20260929.5">','<meta name="bxh-build" content="20260929.6">'),
            ('CURRENT_BUILD="20260929.5"','CURRENT_BUILD="20260929.6"'),
            ('enchantment-ui.js?v=20260927-1','enchantment-ui.js?v=20260929-five-points')]:
            assert html.count(before)==1, before
            html=html.replace(before,after)
          pattern=r'''const\s+APP_VERSION\s*=\s*["']v\d+\.\d+\.\d+["']'''
          markers=re.findall(pattern,html)
          assert len(markers)==1, markers
          print('Previous APP_VERSION declaration:',markers[0])
          html=re.sub(pattern,'const APP_VERSION = "v14.3.5"',html)
          Path('index.html').write_text(html)
          version.update(build='20260929.6',version='v14.3.5',updatedAt=datetime.now(timezone(timedelta(hours=8))).replace(microsecond=0).isoformat())
          Path('version.json').write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n')
          print('Release metadata:',json.dumps(version))
          PY
      - name: Validate syntax and enchantment regressions
        run: |
          node --check enchantment-round-core.js
          node --check enchantment-ui.js
          node --test tests/enchantment-hunter-ledger.test.cjs tests/enchantment-score-core.test.cjs tests/enchantment-round-core.test.cjs tests/enchantment-ui-bridge.test.cjs
          node scripts/verify-production-frontend.cjs
      - name: Commit validated files only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/enchantment-five-points-20260929'
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'enchantment-round-core.js','enchantment-ui.js','tests/enchantment-round-core.test.cjs','index.html','version.json'}, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enchantment-round-core.js enchantment-ui.js tests/enchantment-round-core.test.cjs index.html version.json
          git commit -m 'fix(enchantment): publish five-point target and refreshed referee label'
          git push origin HEAD:refs/heads/fix/enchantment-five-points-20260929
          git show --stat --oneline HEAD
