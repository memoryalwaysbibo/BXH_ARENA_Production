name: Public registration roster sync
on:
  pull_request:
    paths: ['public-registration-roster/**', 'modules/main-app/core.js', 'qr-checkin/backend/overlays/registration-roster-core.js', '.github/workflows/public-registration-roster.yml']
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check modules/main-app/core.js
      - run: node --check public-registration-roster/functions/index.js
      - run: node --test public-registration-roster/roster.test.cjs tests/lobby-stable-updates.test.cjs tests/lobby-ordering.test.cjs tests/family-roster-checkin.test.cjs
      - run: python3 public-registration-roster/build.py --output "$RUNNER_TEMP/public-roster-source"
  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-save --ignore-scripts firebase-admin@13.10.0 firebase-functions@6.6.0 firebase-tools@14
      - run: npx firebase emulators:exec --only firestore --project demo-qr-checkin --config qr-checkin/firebase.emulator.json 'node --test public-registration-roster/firestore.emulator.test.cjs'
