name: M5 Referee tail CSS staging probe
on:
  push:
    branches: [refactor/index-css-m5-referee-tail-20261002]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Stage and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = c0f25033b31ebbb73c31861a19fc9c1842359d9a
          test "$(git hash-object index.html)" = 32635b55c812f03bbd2f804bdec0b7114679042c
          python3 tools/stage-m5-referee-tail.py --source . --output "$RUNNER_TEMP/m51"
          cat "$RUNNER_TEMP/m51/m5-referee-tail-manifest.json"
          node "$RUNNER_TEMP/m51/scripts/verify-production-frontend.cjs"
          (cd "$RUNNER_TEMP/m51" && node scripts/run-regression-core.cjs critical)
