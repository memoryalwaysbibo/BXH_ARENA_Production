name: Validate Production Frontend RC1

on:
  workflow_dispatch:
    inputs:
      risk_override:
        description: 'Acceptance-test override (auto/low/medium/high)'
        required: false
        default: auto
        type: choice
        options: [auto, low, medium, high]
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: safety-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change risk
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.risk.outputs.level }}
      run_ui: ${{ steps.risk.outputs.run_ui }}
      run_e2e: ${{ steps.risk.outputs.run_e2e }}
      run_deep: ${{ steps.risk.outputs.run_deep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: risk
        name: Calculate Safety Gate tier
        shell: bash
        env:
          DISPATCH_OVERRIDE: ${{ inputs.risk_override || 'auto' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
            override=auto
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            override=auto
          else
            files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || git ls-files)"
            override="$DISPATCH_OVERRIDE"
          fi
          printf '%s\n' "$files" | sed '/^$/d' | tee "$RUNNER_TEMP/safety-gate-files.txt"
          RISK_OVERRIDE="$override" node scripts/classify-change-risk.cjs < "$RUNNER_TEMP/safety-gate-files.txt" | tee "$RUNNER_TEMP/safety-gate-result.txt"
          grep -E '^(level|run_ui|run_e2e|run_deep)=' "$RUNNER_TEMP/safety-gate-result.txt" >> "$GITHUB_OUTPUT"
          {
            echo "### Safety Gate 2.0"
            echo ""
            sed 's/^/- /' "$RUNNER_TEMP/safety-gate-result.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard production entrypoint integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          bytes="$(wc -c < index.html | tr -d ' ')"
          lines="$(wc -l < index.html | tr -d ' ')"
          if [ "$bytes" -lt 50000 ] || [ "$lines" -lt 150 ]; then
            echo "Production index.html looks empty or truncated: bytes=$bytes lines=$lines" >&2
            exit 1
          fi
          grep -qi '<!doctype html' index.html
          grep -qi '<html' index.html
          grep -q 'BXH ARENA' index.html
          grep -q 'bxh-environment" content="production' index.html
          grep -qi '</html>' index.html
          echo "Production entrypoint integrity OK: bytes=$bytes lines=$lines"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Safety Gate risk classifier
        run: node --test tests/safety-gate-risk.test.cjs
      - name: Verify interface theme account isolation
        run: |
          node tests/theme-entrance-account.test.cjs
          node tests/theme-directive-access.test.cjs
          node tests/theme-three-gods.test.cjs
          node tests/theme-hunter.test.cjs
          node tests/theme-akatsuki.test.cjs
          node tests/theme-clow.test.cjs
          node tests/theme-zeon.test.cjs
      - name: Verify BXH CALL Web Push scripts syntax
        run: |
          node --check court-call-ui.js
          node --check raffle-ui.js
          node --check inventory-ui.js
          node --check firebase-messaging-sw.js

      - name: Verify referee two-fault scoring
        run: |
          node --check referee-fault-core.js
          node tests/referee-fault-core.test.cjs
          node tests/referee-fault-ui.test.cjs

      - name: Verify enchantment rules and connected V3 draw script
        run: |
          node --check enchantment-ui.js
          node --test tests/enchantment-hunter-ledger.test.cjs tests/enchantment-score-core.test.cjs tests/enchantment-round-core.test.cjs tests/enchantment-ui-bridge.test.cjs
          node - <<'JS'
          const fs=require('node:fs');
          const html=fs.readFileSync('enchantment-draw-v3.html','utf8');
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match || html.includes('模擬下局抽卡') || html.includes('尚未連接賽事與裁判計分'))throw Error('connected-draw-missing');
          new Function(match[1]);
          JS

      - name: Verify header logo refresh control
        run: node tests/header-logo-refresh.test.cjs

      - name: Verify referee score panel V2
        run: node tests/referee-score-v2-ui.test.cjs

      - name: Verify Offline Resilience V2 wiring
        run: node tests/offline-resilience-v2-wiring.test.cjs

      - name: Verify compact next-match prepare UI
        run: node tests/court-call-next-prepare-ui.test.cjs

      - name: Verify tournament raffle winner count stepper
        run: node tests/tournament-operations-count-stepper.test.cjs

      - name: Verify tournament operations multi-prize UI
        run: node tests/tournament-operations-multi-prize-ui.test.cjs

      - name: Verify ranked registration T-5 preopen UX
        run: |
          node --check ranked-registration-preopen-ui.js
          node tests/ranked-registration-preopen-ui.test.cjs

      - name: Verify activity poster manager and viewer
        run: |
          node --check event-poster-ui.js
          node tests/event-poster-gallery.test.cjs
      - name: Verify AI poster contract and draft boundary
        run: |
          node --check ai-poster-ui.js
          node tests/ai-poster-ui.test.cjs
          node --check ai-poster-refinements.js
          node tests/ai-poster-refinements.test.cjs

      - name: Verify management list loading and stale responses
        run: node --test tests/management-loading.test.cjs
      - name: Verify roster mutation and snapshot races
        run: node --test tests/roster-sync-race.test.cjs
      - name: Verify community quick registration and cloud contract
        run: node --test tests/community-quick-registration.test.cjs tests/community-quick-registration-cloud.test.cjs tests/community-host-roster-sync.test.cjs tests/community-summary-fixture.test.cjs tests/community-client-cleanup-disabled.test.cjs
      - name: Verify family roster check-in preservation
        run: |
          node --check family-ui.js
          node tests/family-roster-checkin.test.cjs
      - name: Verify venue navigation regressions
        run: node tests/venue-navigation.test.cjs
      - name: Verify HUNTER LOOP P5 raffle confirmation flow
        run: node tests/hunter-loop-p5-ui.test.cjs
      - name: Verify inventory consumable grant and replay safety
        run: node tests/inventory-consumable-ui.test.cjs
      - name: Verify team battle foundation
        run: node tests/team-battle-foundation.test.cjs
      - name: Verify team registration UI
        run: node tests/team-registration-ui.test.cjs
      - name: Verify team bracket formats
        run: node tests/team-bracket-formats.test.cjs
      - name: Verify double-elimination source graph and placements
        run: |
          node --check double-elimination-core.js
          node --test tests/double-elimination-core.test.cjs
      - name: Verify Production frontend invariants
        run: node scripts/verify-production-frontend.cjs
      - name: Verify ladder V1 scoring and inline-script syntax
        run: node --experimental-vm-modules tests/ladder-v1.cjs
      - name: Verify ladder V1 settlement trust boundary
        run: node --experimental-vm-modules tests/ladder-settlement.cjs
      - name: BXH ARENA Regression Core - Critical
        run: node scripts/run-regression-core.cjs critical

      - name: BXH ARENA Regression Core - Warning
        continue-on-error: true
        run: node scripts/run-regression-core.cjs warning
      - name: Verify no Beta runtime target
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests --exclude='RELEASE_*.md' \
            -E 'bxh-arena-beta|beta\.bxh\.com\.tw|BETA 測試站｜非正式環境' .; then
            echo 'Forbidden Beta runtime marker detected.' >&2
            exit 1
          fi
      - name: Verify no deployment workflows are bundled
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude='validate-production-frontend.yml' -E 'firebase deploy|gcloud functions deploy|FirebaseExtended/action-hosting-deploy' .github/workflows; then
            echo 'This candidate is validation-only; deployment action found.' >&2
            exit 1
          fi

  ui_smoke:
    needs: classify
    if: ${{ needs.classify.outputs.run_ui == 'true' }}
    name: UI Smoke - Desktop / iPhone / Android
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install UI test runner
        id: install_ui
        run: npm install --no-package-lock --ignore-scripts
      - name: Run isolated browser smoke tests (one controlled retry)
        shell: bash
        run: |
          set +e
          npm run test:ui-smoke
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning title=TEST_FLAKY_RETRY::UI Smoke failed once; retrying."
            npm run test:ui-smoke
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              echo "TEST_FLAKY_RECOVERED: UI Smoke passed on retry." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=CODE_FAIL_OR_INFRA_FAIL::UI Smoke failed twice."
            exit "$rc"
          fi
      - name: Verify Hunter Clash A1 entry in Chromium
        if: ${{ !cancelled() && steps.install_ui.outcome == 'success' }}
        run: |
          node tests/hunter-clash-a1-browser.cjs
          node tests/hunter-clash-a23-browser.cjs
      - name: Verify isolated community quick registration in Chromium
        if: ${{ !cancelled() && steps.install_ui.outcome == 'success' }}
        run: node tests/e2e/community-quick-registration-browser.cjs
      - name: Verify compact bracket finals labels
        if: ${{ !cancelled() && steps.install_ui.outcome == 'success' }}
        run: node tests/e2e/bracket-final-label-layout.cjs
      - name: Upload community quick registration screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-community-quick-registration-${{ github.run_id }}
          path: test-results/community-quick-registration/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-ui-smoke-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  emulator_e2e:
    needs: classify
    if: ${{ needs.classify.outputs.run_e2e == 'true' }}
    name: Critical E2E - Player Signup / Community Room
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install Java for Firestore Emulator
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
          java -version

      - name: Install E2E dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run critical Firebase Emulator E2E (one controlled retry)
        shell: bash
        run: |
          set +e
          command=(npx firebase emulators:exec --only auth,firestore --project demo-bxh-arena-e2e --config tests/e2e/firebase.json "npm run test:ui-e2e")
          "${command[@]}"
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning title=TEST_FLAKY_RETRY::Critical E2E failed once; retrying."
            "${command[@]}"
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              echo "TEST_FLAKY_RECOVERED: Critical E2E passed on retry." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=CODE_FAIL_OR_INFRA_FAIL::Critical E2E failed twice."
            exit "$rc"
          fi

      - name: Install ARENA PK server SDK for integration tests
        working-directory: hunter-clash/arena
        run: npm ci --ignore-scripts
      - name: Verify ARENA PK with real Auth and Firestore Emulators
        run: npx firebase emulators:exec --only auth,firestore --project demo-arena-pk --config tests/helpers/arena-pk-emulator.json "node tests/hunter-clash-a23-emulator.cjs"

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-critical-e2e-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deep_e2e:
    needs: classify
    if: ${{ needs.classify.outputs.run_deep == 'true' }}
    name: Deep E2E - Finals / Multi-court / Player / Public Watch
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Java for Firestore Emulator
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
          java -version
      - name: Install Deep E2E dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run Deep Emulator E2E (one controlled retry)
        shell: bash
        run: |
          set +e
          command=(npx firebase emulators:exec --only auth,firestore --project demo-bxh-arena-e2e --config tests/e2e/firebase.json "npx playwright test --config=playwright.deep-e2e.config.cjs")
          "${command[@]}"
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning title=TEST_FLAKY_RETRY::Deep E2E failed once; retrying."
            "${command[@]}"
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              echo "TEST_FLAKY_RECOVERED: Deep E2E passed on retry." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=CODE_FAIL_OR_INFRA_FAIL::Deep E2E failed twice."
            exit "$rc"
          fi
      - name: Upload Deep E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-deep-e2e-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
