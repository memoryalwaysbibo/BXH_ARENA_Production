name: PTN expansion offline source review
on:
  pull_request:
    paths:
      - 'operator/PTN_expansion*.py'
      - '.github/workflows/ptn-expansion-source-review.yml'
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile operator/PTN_expansion_source_audit.py operator/PTN_expansion_source_diff.py operator/PTN_expansion_threeway_review.py
      - run: python3 operator/PTN_expansion_threeway_review.py --self-test
