name: Registration V2 isolated waves
on:
  pull_request:
    paths:
      - 'registration-flow-v2/**'
      - 'modules/main-app/registration-feedback.js'
      - 'modules/cloud/cloud-runtime.js'
      - 'family-ui.js'
      - '.github/workflows/registration-flow-v2.yml'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node --test tests/registration-feedback.test.cjs tests/family-roster-checkin.test.cjs tests/community-quick-registration-cloud.test.cjs tests/public-pages-artifact.test.cjs
      - run: npm install --prefix /tmp/registration-v2-deps --no-save --ignore-scripts firebase-tools@13.35.1 firebase-admin@14.4.0 firebase-functions@7.3.2
      - name: Recovery, 320-player start, and 50/100/150 acceptance waves
        run: /tmp/registration-v2-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-registration-v2 --config registration-flow-v2/emulator.json 'node --test registration-flow-v2/tests/recovery.test.cjs && node registration-flow-v2/tests/frontend-waves.cjs && node registration-flow-v2/tests/waves.cjs && node registration-flow-v2/tests/start-320.cjs'
        env:
          NODE_PATH: /tmp/registration-v2-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-registration-v2
          BXH_START_320_REPORT: registration-flow-v2/evidence/start-320.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-v2-isolated-results
          path: registration-flow-v2/evidence/*.json
          if-no-files-found: error
