name: Bucket live Rules reconciliation
on:
  pull_request:
    paths:
      - 'release/buckets/**'
      - 'scripts/build-bucket-release-rules.py'
      - 'referee-seats/reference/firestore.production-20261102.rules'
      - 'referee-seats/firestore.candidate.rules'
      - 'tests/four-court-buckets/live-release-rules.py'
      - 'tests/four-court-buckets/deletion/**'
      - 'modules/cloud/cloud-runtime.js'
      - 'modules/main-app/core.js'
      - 'index.html'
      - '.github/workflows/bucket-live-release-rules.yml'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact live baseline composition
        run: python3 -B scripts/build-bucket-release-rules.py --check
      - name: Obtain Firestore Emulator via isolated CLI
        run: |
          npm install --prefix /tmp/bucket-release-tools --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0 firebase-functions@6.6.0
          /tmp/bucket-release-tools/node_modules/.bin/firebase setup:emulators:firestore
      - name: Check live and candidate permissions against real Emulator
        run: python3 -B tests/four-court-buckets/live-release-rules.py
      - name: Verify pinned deletion package and worker/client recovery
        run: |
          python3 -B tests/four-court-buckets/deletion/verify-package.py
          node tests/four-court-buckets/deletion/deletion-probe.cjs
          node tests/four-court-buckets/deletion/selection-probe.cjs
          node tests/four-court-buckets/deletion/restore-probe.cjs
          node tests/four-court-buckets/deletion/client-probe.cjs
          node tests/four-court-buckets/deletion/access-probe.cjs
      - name: Check deletion leases against real demo Emulator
        run: |
          FIRESTORE_EMULATOR_JAR="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar" python3 -B tests/four-court-buckets/deletion/rules-emulator.py
      - name: Native SDK cross-entrypoint deletion worker checks
        env:
          NODE_PATH: /tmp/bucket-release-tools/node_modules
          GCLOUD_PROJECT: demo-bxh-bucket-delete-native
        run: /tmp/bucket-release-tools/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-bucket-delete-native --config tests/four-court-buckets/deletion/native.firebase.json 'node tests/four-court-buckets/deletion/selection-native.cjs'
      - name: Install isolated full-host browser dependencies
        run: |
          npm install --prefix /tmp/bucket-browser --no-save --ignore-scripts playwright@1.55.0
          node /tmp/bucket-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Actual index and deletion modal through local Firebase transport
        env:
          NODE_PATH: /tmp/bucket-browser/node_modules
        run: node tests/four-court-buckets/deletion/full-host.browser.cjs
