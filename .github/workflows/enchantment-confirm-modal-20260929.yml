name: Validate enchantment local confirm modal
# retry after DOM bridge compatibility fix
# retry 2 after legacy closest stub compatibility
# retry 3 after modal DOM stub update
on:
  push:
    branches: [fix/enchantment-confirm-modal-20260929]
    paths: [.github/workflows/enchantment-confirm-modal-20260929.yml]
permissions:
  contents: write
jobs:
  validate-and-finalize:
    if: github.repository == 'memoryalwaysbibo/BXH_ARENA_Production' && github.ref == 'refs/heads/fix/enchantment-confirm-modal-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enchantment-confirm-modal-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update production cache/version markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html'); text=p.read_text()
          replacements=[
            ('<meta name="bxh-build" content="20260929.6">','<meta name="bxh-build" content="20260929.7">'),
            ('CURRENT_BUILD="20260929.6"','CURRENT_BUILD="20260929.7"'),
            ('enchantment-ui.js?v=20260929-five-points','enchantment-ui.js?v=20260929-confirm-modal'),
            ('const APP_VERSION = "v14.3.7"','const APP_VERSION = "v14.3.8"')
          ]
          for before,after in replacements:
            count=text.count(before)
            if count != 1: raise SystemExit(f'Expected one marker for {before!r}, found {count}')
            text=text.replace(before,after)
          p.write_text(text)
          vpath=Path('version.json'); v=json.loads(vpath.read_text())
          if v.get('build')!='20260929.6' or v.get('version')!='v14.3.7':
            raise SystemExit('version.json changed; review required')
          v.update(build='20260929.7',version='v14.3.8',updatedAt='2026-09-29T22:55:00+08:00')
          vpath.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Validate enchantment and production invariants
        run: |
          node --check enchantment-ui.js
          node --check enchantment-round-core.js
          node --test tests/enchantment-hunter-ledger.test.cjs tests/enchantment-score-core.test.cjs tests/enchantment-round-core.test.cjs tests/enchantment-ui-bridge.test.cjs
          node scripts/verify-production-frontend.cjs
      - name: Commit metadata update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'index.html','version.json'}, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'fix(enchantment): publish local winner confirmation modal v14.3.8'
          git push origin HEAD:refs/heads/fix/enchantment-confirm-modal-20260929
