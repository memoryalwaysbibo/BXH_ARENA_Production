name: ARENA Windows Demo Callable Round Two
on:
  push:
    branches: ['exp/windows-round2-20261120']
    paths: ['tests/windows-round2/**', '.github/workflows/windows-round2.yml']
permissions:
  contents: read
concurrency:
  group: arena-windows-round2-only
  cancel-in-progress: false
jobs:
  demo-callable:
    if: github.ref == 'refs/heads/exp/windows-round2-20261120'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      NPM_CONFIG_ENGINE_STRICT: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      FIREBASE_CLI_DISABLE_USAGE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          architecture: x64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - name: Install same reviewed locks without lifecycle scripts
        run: |
          foreach ($dir in @('functions', 'frontend', 'cli')) {
            Push-Location "tests/windows-private-preflight/$dir"
            npm ci --ignore-scripts --no-audit --no-fund --engine-strict --update-notifier=false
            if ($LASTEXITCODE -ne 0) { throw "Install failed: $dir" }
            Pop-Location
          }
      - name: Download exact official emulator and verify hash
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'firestore-emulator-v1.19.8.jar'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar' -OutFile $jar
          if ((Get-FileHash -Algorithm SHA256 $jar).Hash.ToLower() -ne '9d43599ed6151199e8d604dc87fac51218e49e5f3a48519b1ae560bbe5e3382d') { throw 'JAR hash mismatch' }
          "ARENA_TEST_JAR=$jar" >> $env:GITHUB_ENV
      - name: Demo loopback callable and automatic publication recovery
        run: |
          New-Item -ItemType Directory -Force tests/windows-round2/evidence | Out-Null
          node tests/windows-round2/run.cjs 2>&1 | Tee-Object tests/windows-round2/evidence/orchestrator.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows demo integration failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked input modified' }
      - name: Retain synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arena-windows-round2-demo-only
          path: tests/windows-round2/evidence/
          retention-days: 7
          if-no-files-found: warn
