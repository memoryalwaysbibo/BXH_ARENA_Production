name: M3 Mobile Override CSS staging probe
on:
  push:
    branches:
      - refactor/index-css-m3-mobile-overrides-20261002
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify production main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = c05285e13560b0ddaab5b08c3ebd484c35ffae30
          test "$(git hash-object index.html)" = ac4ae95673e4d96546f1fa9683fb3557de93164f
      - name: Produce isolated M3-1 candidate and immutable digests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage-m3-mobile-overrides.py --source . --output "$RUNNER_TEMP/m31"
          cat "$RUNNER_TEMP/m31/m3-mobile-overrides-manifest.json"
          node "$RUNNER_TEMP/m31/scripts/verify-production-frontend.cjs"
          (cd "$RUNNER_TEMP/m31" && node scripts/run-regression-core.cjs critical)
      - name: Upload staging evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-mobile-overrides-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/m31/m3-mobile-overrides-manifest.json
          retention-days: 7
