name: BXH ARENA Nightly Full Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '30 19 * * *'

permissions:
  contents: read

concurrency:
  group: bxh-arena-nightly-full-regression
  cancel-in-progress: true

jobs:
  four-player-referee-flow:
    name: Full tournament / finals / multi-court deep E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble

    steps:
      - uses: actions/checkout@v4

      - name: Install Java for Firestore Emulator
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
          java -version

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run nightly Deep Emulator E2E (one controlled retry)
        shell: bash
        run: |
          set +e
          command=(npx firebase emulators:exec --only auth,firestore --project demo-bxh-arena-e2e --config tests/e2e/firebase.json "npx playwright test --config=playwright.deep-e2e.config.cjs")
          "${command[@]}"
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning title=TEST_FLAKY_RETRY::Nightly Deep E2E failed once; retrying."
            "${command[@]}"
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              echo "TEST_FLAKY_RECOVERED: Nightly Deep E2E passed on retry." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=CODE_FAIL_OR_INFRA_FAIL::Nightly Deep E2E failed twice."
            exit "$rc"
          fi

      - name: Upload deep E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-deep-e2e-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
