name: Assemble P7.13.1 frontend
on:
  push:
    branches: [fix/p7-13-1-review-time-20260925]
    paths: [.github/workflows/assemble-p713-1.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p7-13-1-review-time-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-guarded application edits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = fix/p7-13-1-review-time-20260925
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          spec=Path('scripts/p713-1-index-edits.json')
          edits=json.loads(spec.read_text())
          p=Path('index.html');raw=p.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert blob==edits['baseBlob'],('source-moved',blob)
          lines=raw.decode().splitlines(keepends=True)
          previous=len(lines)+1
          for e in reversed(edits['edits']):
              assert 0<=e['start']<=e['end']<=previous
              lines[e['start']:e['end']]=e['text'].splitlines(keepends=True)
              previous=e['start']
          p.write_text(''.join(lines))
          v=Path('version.json');data=json.loads(v.read_text())
          data.update(version='v14.2.27',build='20260925.38',updatedAt=datetime.now(timezone.utc).isoformat())
          v.write_text(json.dumps(data,indent=2)+'\n')
          spec.unlink()
          PY
      - name: Validate all frontend regressions
        run: |
          set -euo pipefail
          node --check ai-poster-ui.js
          node --check ai-poster-refinements.js
          node --check inventory-ui.js
          node --check court-call-ui.js
          node --check raffle-ui.js
          node tests/ai-poster-ui.test.cjs
          node tests/ai-poster-refinements.test.cjs
          node tests/venue-navigation.test.cjs
          node tests/hunter-loop-p5-ui.test.cjs
          node tests/inventory-consumable-ui.test.cjs
          node scripts/verify-production-frontend.cjs
          node --experimental-vm-modules tests/ladder-v1.cjs
          node --experimental-vm-modules tests/ladder-settlement.cjs
      - name: Commit application changes only to isolated feature branch
        run: |
          set -euo pipefail
          git config user.name 'BXH validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json scripts/p713-1-index-edits.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'fix(p7.13.1): exact minutes, evidence hints and required-field navigation'
          git push origin HEAD:refs/heads/fix/p7-13-1-review-time-20260925
          git show --stat --oneline HEAD
