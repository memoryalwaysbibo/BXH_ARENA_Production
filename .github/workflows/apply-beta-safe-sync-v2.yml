name: Apply reviewed Beta safe frontend sync v2

on:
  push:
    branches:
      - sync/beta-e630d7f-safe-20260920

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/beta-e630d7f-safe-20260920
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply isolated safe frontend changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'family-ui.js',
              "const close=()=>{if(closed)return;closed=true;clearInterval(timer);dialog.close();dialog.remove();previous?.focus?.();};const timer=setInterval(()=>{if(!valid())close();},500);",
              "const close=()=>{if(closed)return;closed=true;clearInterval(timer);dialog.close();dialog.remove();previous?.focus?.();};const timer=setInterval(()=>{if(document.hidden)return;if(!valid())close();},1000);",
              'family modal watchdog'
          )
          replace_once(
              'family-ui.js',
              '<button class="btn btn-ghost" data-close>返回</button></header><p>請指定要取消本人或哪一位孩子的報名',
              '<button class="btn btn-ghost" data-close>取消</button></header><p>請指定要取消本人或哪一位孩子的報名',
              'family cancellation wording'
          )
          replace_once(
              'family-ui.js',
              "const timer=setInterval(()=>{if(currentAuthUid()!==owner||engagementSessionEpoch!==epoch)finish('auth-required')},500);",
              "const timer=setInterval(()=>{if(document.hidden)return;if(currentAuthUid()!==owner||engagementSessionEpoch!==epoch)finish('auth-required')},1000);",
              'family participant watchdog'
          )

          old_raffle = """setInterval(()=>{\n raffleAnnouncementsState.loaded=false;\n const c=raffleContext();\n if(!c.loading&&!c.busy&&!c.editing&&!c.pending&&c.id&&['open','freezing','locked'].includes(c.detail?.event?.state)&&(appPhase==='raffle-public'||appPhase==='player-center'&&playerActiveTab==='raffles'))loadRaffles();\n},60000);\nfunction playRaffleReplay(detail){"""
          new_raffle = """setInterval(()=>{\n if(document.hidden)return;\n raffleAnnouncementsState.loaded=false;\n const c=raffleContext();\n if(!c.loading&&!c.busy&&!c.editing&&!c.pending&&c.id&&['open','freezing','locked'].includes(c.detail?.event?.state)&&(appPhase==='raffle-public'||appPhase==='player-center'&&playerActiveTab==='raffles'))loadRaffles();\n},60000);\ndocument.addEventListener('visibilitychange',()=>{\n if(document.hidden)return;\n const c=raffleContext();\n if(!c.loading&&!c.busy&&!c.editing&&!c.pending&&c.id&&['open','freezing','locked'].includes(c.detail?.event?.state)&&(appPhase==='raffle-public'||appPhase==='player-center'&&playerActiveTab==='raffles'))loadRaffles();\n});\nfunction playRaffleReplay(detail){"""
          replace_once('raffle-ui.js', old_raffle, new_raffle, 'raffle hidden-tab refresh')

          css = """/* ==== 2026-09-20 player top-nav narrow desktop/tablet fit ==== */
          @media (min-width:560px) and (max-width:900px){
            .stickytop .player-tabs:not(.player-tabs-bottom){
              display:grid!important;
              grid-template-columns:repeat(8,minmax(0,1fr));
              width:100%;
              max-width:100vw;
              overflow-x:hidden!important;
              gap:0;
            }
            .stickytop .player-tabs:not(.player-tabs-bottom) .player-tab-btn{
              min-width:0!important;
              width:auto!important;
              flex:none!important;
              padding-left:5px!important;
              padding-right:5px!important;
              font-size:12px;
              white-space:nowrap;
              overflow:hidden;
              text-overflow:clip;
            }
          }
          @media (max-width:559px){
            .stickytop .player-tabs:not(.player-tabs-bottom){
              overflow-x:auto!important;
              overflow-y:hidden!important;
              touch-action:pan-x;
            }
            .stickytop .player-tabs:not(.player-tabs-bottom) .player-tab-btn{
              flex:0 0 auto!important;
            }
          }

          """.replace('          ', '')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ==== 2026-09-20 player top-nav narrow desktop/tablet fit ==== */'
          anchor = '/* ==== v13.24.8 account dropdown top-layer hotfix ==== */'
          if marker in s:
              raise SystemExit('top-nav patch already present; refusing duplicate application')
          if s.count(anchor) != 1:
              raise SystemExit(f'top-nav anchor mismatch: {s.count(anchor)}')
          p.write_text(s.replace(anchor, css + anchor, 1), encoding='utf-8')

      - name: Verify Production invariants remain intact
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          html=Path('index.html').read_text(encoding='utf-8')
          cname=Path('CNAME').read_text(encoding='utf-8').strip()
          if cname!='arena.bxh.com.tw': raise SystemExit(f'Unexpected CNAME: {cname}')
          required=[
            (r'projectId:\s*["\'\`]bxh-arena["\'\`]', 'Production projectId missing'),
            (r'authDomain:\s*["\'\`]bxh-arena\.firebaseapp\.com["\'\`]', 'Production authDomain missing'),
            (r'Production Public Beta Release Gate', 'Release Gate marker missing'),
            (r'PUBLIC_BETA_OPEN_AT_MS', 'Release Gate open time missing'),
            (r'releaseGateClockVerified', 'server clock verification missing'),
            (r'syncReleaseGateServerClock', 'server clock sync missing'),
            (r'server-date-unavailable', 'server clock failure guard missing'),
            (r'Release Gate 伺服器時間驗證失敗，維持關閉狀態', 'fail-closed warning missing'),
          ]
          for pattern,msg in required:
              if not re.search(pattern,html): raise SystemExit(msg)
          for forbidden in ('bxh-arena-beta','beta.bxh.com.tw','BETA 測試站｜非正式環境'):
              if forbidden in html: raise SystemExit(f'Forbidden Beta runtime marker: {forbidden}')
          subprocess.run(['node','scripts/verify-production-frontend.cjs'],check=True)
          print('PASS Production config / Release Gate / server-clock invariants')

      - name: Verify changed JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check family-ui.js
          node --check raffle-ui.js

      - name: Verify every embedded JavaScript block parses
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),os=require('os'),path=require('path'),cp=require('child_process');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          const dir=fs.mkdtempSync(path.join(os.tmpdir(),'bxh-inline-js-'));
          let m,count=0;
          while((m=re.exec(html))){
            const attrs=m[1]||'', body=m[2]||'';
            if(/\bsrc\s*=/.test(attrs)) continue;
            const type=(attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)||[])[1]?.toLowerCase()||'';
            if(type && !['module','text/javascript','application/javascript'].includes(type)) continue;
            const ext=type==='module'?'.mjs':'.js';
            const file=path.join(dir,`inline-${++count}${ext}`);
            fs.writeFileSync(file,body);
            const r=cp.spawnSync(process.execPath,['--check',file],{encoding:'utf8'});
            if(r.status!==0){
              console.error(`Inline script ${count} failed syntax check`);
              console.error(r.stderr||r.stdout);
              process.exit(1);
            }
          }
          if(!count) throw new Error('No inline JavaScript blocks found');
          console.log(`PASS inline JavaScript syntax: ${count} blocks`);
          NODE

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'family-ui.js\nindex.html\nraffle-ui.js'
          git diff -- index.html | grep -q 'player top-nav narrow desktop/tablet fit'
          if git diff -- index.html | grep -E '^[+-].*(PUBLIC_BETA_OPEN_AT_MS|releaseGateClockVerified|syncReleaseGateServerClock|projectId:|authDomain:)'; then
            echo 'Protected Production marker was modified.' >&2
            exit 1
          fi

      - name: Commit reviewed safe changes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-beta-safe-sync.yml .github/workflows/apply-beta-safe-sync-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-ui.js raffle-ui.js index.html .github/workflows/apply-beta-safe-sync.yml .github/workflows/apply-beta-safe-sync-v2.yml
          git commit -m "Sync Beta safe frontend through e630d7f" -m "Port only reviewed UI/performance changes: narrow player nav, hidden-tab family watchdogs, family cancel wording, and hidden-tab raffle refresh. Preserve Production Firebase config, CNAME, environment, Release Gate and fail-closed server clock. Reviewed Beta through e630d7f; Auth/location/Rules/data changes intentionally excluded."
          git push origin HEAD:sync/beta-e630d7f-safe-20260920
