name: V2 M1 isolated migration validation

on:
  push:
    branches: [refactor/management-v2-migration-m1-20261002]

permissions:
  contents: read

concurrency:
  group: management-v2-m1-isolated
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/refactor/management-v2-migration-m1-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Trust only the checked-out workspace in this container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify fixed main and branch heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = fdd1c73c7e61e97deb0c15c325057b6301bbec37
          test "$(git ls-remote origin refs/heads/refactor/management-v2-migration-m1-20261002 | cut -f1)" = "$GITHUB_SHA"
      - name: Prepare isolated candidate or verify already-wired branch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2-evidence"
          current="$(git hash-object index.html)"
          if [ "$current" = ff61e00a1ed2ca15eff7af9a8de83aeff9141b92 ]; then
            python3 tools/stage-management-v2-migration.py --source . --output "$RUNNER_TEMP/v2-candidate" | tee "$RUNNER_TEMP/v2-evidence/staging.json"
            echo "root=$RUNNER_TEMP/v2-candidate" >> "$GITHUB_OUTPUT"
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            test -f management-v2-migration-manifest.json
            echo "root=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Exact-byte migration contracts and existing critical checks
        shell: bash
        env:
          BXH_PILOT_ROOT: ${{ steps.stage.outputs.root }}
        run: |
          set -euo pipefail
          node --test tools/verify-management-v2-migration.cjs | tee "$RUNNER_TEMP/v2-evidence/contracts.log"
          (cd "$BXH_PILOT_ROOT" && node scripts/verify-production-frontend.cjs) | tee "$RUNNER_TEMP/v2-evidence/verifier.log"
          (cd "$BXH_PILOT_ROOT" && node scripts/run-regression-core.cjs critical) | tee "$RUNNER_TEMP/v2-evidence/critical.log"
      - name: Install pinned isolated browser test runner
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/v2-runner" --no-package-lock --ignore-scripts @playwright/test@1.55.0
      - name: HTTP resource loading and actual browser storage checks
        shell: bash
        env:
          BXH_PILOT_ROOT: ${{ steps.stage.outputs.root }}
          BXH_PILOT_RESULTS: ${{ runner.temp }}/v2-evidence/browser
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/v2-runner/node_modules"
          node "$RUNNER_TEMP/v2-runner/node_modules/@playwright/test/cli.js" test --config=tools/management-v2-http.config.cjs | tee "$RUNNER_TEMP/v2-evidence/http.log"
      - name: Commit only verified wiring to the same isolated branch
        if: steps.stage.outputs.apply == 'true'
        shell: bash
        env:
          BXH_PILOT_ROOT: ${{ steps.stage.outputs.root }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/management-v2-migration-m1-20261002
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = fdd1c73c7e61e97deb0c15c325057b6301bbec37
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          for file in index.html management-ui-v2-preview.html tests/management-ui-v2-smoke.html management-v2-migration-manifest.json; do
            cp "$BXH_PILOT_ROOT/$file" "$file"
            git add -- "$file"
          done
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'index.html','management-ui-v2-preview.html','tests/management-ui-v2-smoke.html','management-v2-migration-manifest.json'}
          if actual != expected: raise SystemExit('Unexpected staged paths: '+repr(actual))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(v2): wire verified M1 assets on isolated pilot branch'
          git push origin HEAD:refs/heads/refactor/management-v2-migration-m1-20261002
      - name: Record tested tree and deployment boundary
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v2-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/v2-evidence/checkout-or-wired-commit.txt"
          printf 'ISOLATED BRANCH ONLY. No merge, Pages deployment, Firebase access, or real-device acceptance.\n' > "$RUNNER_TEMP/v2-evidence/scope.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-v2-m1-${{ github.run_id }}
          path: ${{ runner.temp }}/v2-evidence
          retention-days: 7
