name: Registration forty-client contention candidate
on:
  pull_request:
    paths:
      - 'release/registration-contention/**'
      - 'tests/fixtures/registration-feedback-current-source.json'
      - '.github/workflows/registration-contention.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node --test release/registration-contention/admission.test.cjs
      - run: npm install --prefix /tmp/registration40-deps --no-save --ignore-scripts firebase-tools@13.35.1 firebase-admin@14.4.0
      - run: /tmp/registration40-deps/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-registration40 --config release/registration-contention/emulator.json 'node release/registration-contention/check.cjs'
        env:
          NODE_PATH: /tmp/registration40-deps/node_modules
          GCLOUD_PROJECT: demo-bxh-registration40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration40-emulator-results
          path: release/registration-contention/results.json
          if-no-files-found: ignore
