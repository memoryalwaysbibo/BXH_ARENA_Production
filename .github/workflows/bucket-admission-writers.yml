name: Bucket admission writer fences
on:
  pull_request:
    paths:
      - 'release/buckets/admissions/**'
      - 'tests/four-court-buckets/admissions/**'
      - '.github/workflows/bucket-admission-writers.yml'
permissions:
  contents: read
jobs:
  isolated-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact patches and captured dependency closure
        run: python3 -B tests/four-court-buckets/admissions/verify-package.py
      - name: Ownership, generation and authorization retry checks
        run: node tests/four-court-buckets/admissions/probe.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated Emulator validation dependencies
        run: npm install --prefix /tmp/bucket-admissions --no-save --ignore-scripts firebase-tools@14 firebase-admin@13.10.0 firebase-functions@6.6.0
      - name: Native SDK transactions in a loopback demo project
        env:
          NODE_PATH: /tmp/bucket-admissions/node_modules
          GCLOUD_PROJECT: demo-bxh-bucket-admissions
          CI: true
        run: /tmp/bucket-admissions/node_modules/.bin/firebase emulators:exec --only firestore --project demo-bxh-bucket-admissions --config tests/four-court-buckets/admissions/native.firebase.json 'node tests/four-court-buckets/admissions/native-emulator.cjs'
      - name: Preserve native transaction failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-admissions-native-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
