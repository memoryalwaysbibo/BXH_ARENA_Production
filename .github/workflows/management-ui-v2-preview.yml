name: Management UI V2 Preview Artifact
on:
  push:
    branches:
      - preview/management-ui-v2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preview files
        run: |
          set -euo pipefail
          test -f management-ui-v2-preview.html
          test -f management-ui-v2.js
          test -f management-ui-v2.css
          test -f index.html
          grep -q "BXH ARENA Management UI V2 Preview" management-ui-v2-preview.html
          grep -q 'account-open-interface' index.html
          grep -q 'bxh-management-v2-nav' index.html
      - name: Build isolated navigation preview artifact
        run: |
          mkdir -p preview-artifact
          cp management-ui-v2-preview.html preview-artifact/index.html
          cp management-ui-v2.js preview-artifact/
          cp management-ui-v2.css preview-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: management-ui-v2-preview
          path: preview-artifact
          retention-days: 7
      - name: Build full candidate runtime artifact
        run: |
          mkdir -p candidate-runtime
          find . -maxdepth 1 -type f ! -name 'CNAME' ! -name '*.md' ! -name 'package.json' ! -name 'playwright*.cjs' -exec cp {} candidate-runtime/ \;
          cp -R assets candidate-runtime/assets
          test -s candidate-runtime/index.html
          grep -q 'account-open-interface' candidate-runtime/index.html
          grep -q 'bxh-management-v2-nav' candidate-runtime/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: management-ui-v2-candidate-runtime
          path: candidate-runtime
          retention-days: 7
