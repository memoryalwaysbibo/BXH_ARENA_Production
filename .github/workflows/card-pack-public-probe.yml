name: Read-only public card-pack deployment probe
on:
  push:
    branches: [hotfix/card-pack-projection-20261003]
    paths: [.github/workflows/card-pack-public-probe.yml]
permissions:
  contents: read
jobs:
  public_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public page and referenced assets without authentication
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, hashlib, json, time
          root='https://arena.bxh.com.tw/'
          def read(url):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BXH-ReadOnly-Deployment-Probe'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.read(),r.status
          body,status=read(root+'?bxh_probe='+str(int(time.time())))
          html=body.decode('utf-8')
          print(json.dumps({'pageStatus':status,'bytes':len(body)},ensure_ascii=False))
          for name in ['modules/main-app/mailbox.js','card-reward-mail.js','modules/main-app/card-album.js']:
              urls=[u for u in re.findall(r'<script[^>]+src="([^"]+)"',html) if u.split('?')[0]==name]
              assert len(urls)==1,(name,urls)
              data,code=read(urllib.parse.urljoin(root,urls[0]))
              blob=hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()
              print(json.dumps({'asset':urls[0],'http':code,'bytes':len(data),'gitBlobSha':blob,'recognizesClaimPack':b"action:'claimPack'" in data},ensure_ascii=False))
          version,code=read(root+'version.json?bxh_probe='+str(int(time.time())))
          print('VERSION '+version.decode('utf-8'))
          PY
