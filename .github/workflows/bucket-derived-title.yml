name: Bucket derived title event

on:
  pull_request:
    paths:
      - 'release/buckets/derived/**'
      - 'tests/four-court-buckets/derived/**'
      - '.github/workflows/bucket-derived-title.yml'
  workflow_dispatch:

jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify captured source and exact patch
        run: python3 -B tests/four-court-buckets/derived/verify-package.py
      - name: Verify official title event paths
        run: node tests/four-court-buckets/derived/probe.cjs
