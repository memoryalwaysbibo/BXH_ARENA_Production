name: BEY Catalog Taiwan Names
on:
  pull_request:
    paths:
      - 'modules/bey-catalog/catalog-locale-zh-tw.cjs'
      - 'tests/bey-catalog-locale-zh-tw.test.cjs'
      - 'modules/bey-catalog/catalog-tw02-corrections.cjs'
      - 'tests/bey-catalog-tw02-corrections.test.cjs'
      - 'modules/bey-catalog/catalog-tw03-evidence-audit.cjs'
      - 'tests/bey-catalog-tw03-evidence.test.cjs'
      - 'modules/bey-catalog/catalog-tw03-corrections.cjs'
      - 'tests/bey-catalog-tw03-corrections.test.cjs'
      - 'modules/bey-catalog/catalog-tw04-corrections.cjs'
      - 'tests/bey-catalog-tw04-corrections.test.cjs'
      - 'modules/bey-catalog/catalog-tw05-colors.cjs'
      - 'tests/bey-catalog-tw05-colors.test.cjs'
      - 'modules/bey-catalog/catalog-tw06-review.cjs'
      - 'tests/bey-catalog-tw06-review.test.cjs'
      - '.github/workflows/bey-catalog-zh-tw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locale-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/bey-catalog-locale-zh-tw.test.cjs tests/bey-catalog-tw02-corrections.test.cjs tests/bey-catalog-tw03-evidence.test.cjs tests/bey-catalog-tw03-corrections.test.cjs tests/bey-catalog-tw04-corrections.test.cjs tests/bey-catalog-tw05-colors.test.cjs tests/bey-catalog-tw06-review.test.cjs
