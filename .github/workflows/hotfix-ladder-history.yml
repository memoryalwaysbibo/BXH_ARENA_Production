name: Hotfix Ladder History Mobile Safety

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/hotfix-ladder-history.yml

permissions:
  contents: write

concurrency:
  group: hotfix-ladder-history
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded current-season history query
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          html_path = Path("index.html")
          ui_path = Path("ladder-secondary-ui.js")
          verify_path = Path("scripts/verify-production-frontend.cjs")
          test_path = Path("tests/ladder-ranking-ui.test.cjs")
          version_path = Path("version.json")

          html = html_path.read_text(encoding="utf-8")
          ui = ui_path.read_text(encoding="utf-8")
          verify = verify_path.read_text(encoding="utf-8")
          test = test_path.read_text(encoding="utf-8")
          version = json.loads(version_path.read_text(encoding="utf-8"))

          old_build = str(version["build"])
          old_version = str(version["version"])
          new_build = "20261001.2"
          new_version = "v14.3.15"

          html = replace_once(html, f'<meta name="bxh-build" content="{old_build}">', f'<meta name="bxh-build" content="{new_build}">', "build meta")
          html = replace_once(html, f'CURRENT_BUILD="{old_build}"', f'CURRENT_BUILD="{new_build}"', "current build")
          html = replace_once(html, f'const APP_VERSION = "{old_version}";', f'const APP_VERSION = "{new_version}";', "app version")

          history_entry = (
              '  {version:"v14.3.15",date:"2026/10/01",timezone:"Asia/Taipei",'
              'title:"天梯歷史紀錄防當機與賽季隔離",updateLevel:"patch",added:[],'
              'changed:["近期積分紀錄只顯示目前 S1 並限制最新 100 筆","Firestore 直接依時間索引只下載最新 200 筆，不再把完整歷史集合載入手機"],'
              'fixed:["修復玩家點進歷史資料時因全量下載造成手機凍結或頁面被關閉","S0 歷史保持封存，不再混入 S1 近期紀錄"],'
              'environment:"Production",deployStatus:"Ladder history stability hotfix",'
              'firebaseImpact:"唯讀查詢最佳化；無刪除、無資料結構變更",securityRulesImpact:"無",permissionImpact:"無",'
              'publicSummary:"天梯歷史頁改為輕量化讀取目前賽季，避免手機當機。"},\n'
          )
          html = replace_once(html, "const VERSION_HISTORY = [\n", "const VERSION_HISTORY = [\n" + history_entry, "version history")

          old_query = '''      const s=await fx.getDocs(fx.collection(dbHandle,"ladderTransactions"));
          const out=[]; s.forEach(d=>{const x=Object.assign({id:d.id},d.data()); x.createdAtMs=cloudSafeTimestampMs(x.createdAt); out.push(x);});
          return out.sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0)).slice(0,200);'''
          new_query = '''      const q=fx.query(
            fx.collection(dbHandle,"ladderTransactions"),
            fx.orderBy("createdAt","desc"),
            fx.limit(200)
          );
          const s=await fx.getDocs(q);
          const out=[]; s.forEach(d=>{const x=Object.assign({id:d.id},d.data()); x.createdAtMs=cloudSafeTimestampMs(x.createdAt); out.push(x);});
          return out;'''
          html = replace_once(html, old_query, new_query, "bounded ladder history query")
          html = replace_once(html, 'ladder-secondary-ui.js?v=14.2.55-badge-batch2', 'ladder-secondary-ui.js?v=14.3.15', "ladder cache bust")

          old_sort = '    var rows=Array.isArray(logs)?logs.slice():[];'
          new_sort = '''    var currentSeason=(typeof ladderPublicData!=="undefined"&&ladderPublicData&&ladderPublicData.control&&ladderPublicData.control.currentSeason)||"S1";
              var rows=(Array.isArray(logs)?logs:[]).filter(function(row){
                return String(row&&row.seasonId||"")===String(currentSeason);
              }).slice(0,100);'''
          ui = replace_once(ui, old_sort, new_sort, "current season history filter")
          ui = replace_once(ui, '    var rows=sortedLogs(logs).slice(0,100);', '    var rows=sortedLogs(logs);\n    var currentSeason=(typeof ladderPublicData!=="undefined"&&ladderPublicData&&ladderPublicData.control&&ladderPublicData.control.currentSeason)||"S1";', "history rows")
          ui = replace_once(ui, '<div class="panel-title"><span>近期積分紀錄</span>', '<div class="panel-title"><span>'+chr(39)+'+escLocal(currentSeason)+'+chr(39)+'｜近期積分紀錄</span>', "history title")
          ui = replace_once(ui, '最多顯示最近 100 筆；切換排序不會修改任何積分資料。', '僅顯示 '+chr(39)+'+escLocal(currentSeason)+'+chr(39)+' 最近 100 筆；舊賽季已封存，不會載入玩家手機。', "history note")

          verify = replace_once(verify, 'ladder-secondary-ui.js?v=14.2.55-badge-batch2', 'ladder-secondary-ui.js?v=14.3.15', "verify cache bust")
          verify = replace_once(
              verify,
              "mustInclude('ladder-secondary-ui.js?v=14.3.15','Ladder V2 cache bust missing');",
              "mustInclude('ladder-secondary-ui.js?v=14.3.15','Ladder V2 cache bust missing');\n"
              "mustInclude('fx.orderBy(\"createdAt\",\"desc\")','Ladder history must use server-side newest-first query');\n"
              "mustInclude('fx.limit(200)','Ladder history query must be bounded on mobile');",
              "history invariants",
          )

          test = replace_once(
              test,
              "assert(html.includes('ladder-secondary-ui.js?v=14.2.55-badge-batch2'), 'ladder asset cache-bust version must match release');",
              "assert(source.includes('String(row&&row.seasonId||\"\")===String(currentSeason)'), 'recent history must be isolated to the current season');\n"
              "assert(source.includes('舊賽季已封存，不會載入玩家手機'), 'history archive boundary disclosure missing');\n"
              "assert(html.includes('fx.orderBy(\"createdAt\",\"desc\")'), 'history query must be ordered on the server');\n"
              "assert(html.includes('fx.limit(200)'), 'history query must be bounded before download');\n"
              "assert(html.includes('ladder-secondary-ui.js?v=14.3.15'), 'ladder asset cache-bust version must match release');",
              "ladder history tests",
          )

          version["build"] = new_build
          version["version"] = new_version
          version["updatedAt"] = "2026-10-01T08:58:00+08:00"

          html_path.write_text(html, encoding="utf-8")
          ui_path.write_text(ui, encoding="utf-8")
          verify_path.write_text(verify, encoding="utf-8")
          test_path.write_text(test, encoding="utf-8")
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Verify hotfix
        run: |
          git diff --check
          node --check ladder-secondary-ui.js
          node tests/ladder-ranking-ui.test.cjs
          node scripts/verify-production-frontend.cjs
          node --experimental-vm-modules tests/ladder-v1.cjs
          node --experimental-vm-modules tests/ladder-settlement.cjs

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bxh-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html ladder-secondary-ui.js scripts/verify-production-frontend.cjs tests/ladder-ranking-ui.test.cjs version.json
          git commit -m "fix(ladder): bound and isolate history queries"
          git push origin HEAD:main
