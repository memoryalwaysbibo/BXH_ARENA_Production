name: M4 Main CSS tail staging probe
on:
  push:
    branches: [refactor/index-css-m4-tail-modules-20261002]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Verify production baseline and stage candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 100a8aa4c5c43e20374aab6548737e75a7f877dc
          test "$(git hash-object index.html)" = 99ab90be16347904f050c11ee7086cf11d367620
          python3 tools/stage-m4-main-tail.py --source . --output "$RUNNER_TEMP/m41"
          cat "$RUNNER_TEMP/m41/m4-main-tail-manifest.json"
          node "$RUNNER_TEMP/m41/scripts/verify-production-frontend.cjs"
          (cd "$RUNNER_TEMP/m41" && node scripts/run-regression-core.cjs critical)
      - uses: actions/upload-artifact@v4
        with:
          name: m4-main-tail-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/m41/m4-main-tail-manifest.json
          retention-days: 7
