name: Staff assignment real-name verification
on:
  push:
    branches: [main, fix/staff-assignment-realname-20261002]
    paths:
      - modules/main-app/core.js
      - index.html
      - tests/staff-assignment-realname.test.cjs
      - .github/workflows/staff-assignment-realname-check.yml
  pull_request:
    paths:
      - modules/main-app/core.js
      - index.html
      - tests/staff-assignment-realname.test.cjs
      - .github/workflows/staff-assignment-realname-check.yml
permissions:
  contents: read
jobs:
  real-name-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application syntax
        run: node --check modules/main-app/core.js
      - name: Verify real-name rendering and unchanged UID bindings
        run: node --test tests/staff-assignment-realname.test.cjs
