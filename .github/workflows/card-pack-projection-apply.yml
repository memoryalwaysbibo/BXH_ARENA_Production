name: Apply verified projected-pack compatibility repair
on:
  push:
    branches: [hotfix/card-pack-projection-20261003]
    paths: [.github/workflows/card-pack-projection-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact checked replacements, abort on baseline drift
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('.')
          before={'card-reward-mail.js':'6846dfd6965b38ad1827d482f46b90a2475f54b768943509d84c6258beea2fc2','modules/main-app/mailbox.js':'eeb52060636b89248d475b8ee60d48ec0931613d61664da44ec0e78b0a4d7be1','index.html':'02bd28a1ad6614a1f2e6720ac02a78cb6fab00c2dd687f83841fad51b20857a4','tests/card-album-claim-refresh.test.cjs':'a82ce057eb99cc53ead5e6011b6c3a4ede26b24ba5b402cf21ae56ec89ff7121','version.json':'3718b07aa2a35c68c2fe8d327f51b7943249d16ce6aac4caec0ccdfd27cb2128'}
          for name,digest in before.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,('baseline-drift',name)
          p=root/'card-reward-mail.js'
          s=p.read_text()
          old="function rewardOf(message){return message&&message.type===OCT_CARD_REWARD_TYPE?message.reward:null;}"
          new=r'''// mailboxService intentionally projects attachments to id/name/mime/size and
          // omits reward. Recognize only its reserved pack identity, never a title/name.
          const packReceipts=new WeakMap();
          function packReceiptContext(){return window.BXHMailbox?.mailboxContext?.()||null;}
          function packAttachment(item){
            return item?.id==='gods_pack'&&item?.mime==='application/x-bxh-card-pack'&&
              (item.kind==null||item.kind==='gods_card_pack');
          }
          function projectedPack(message){
            if(message?.type!==OCT_CARD_REWARD_TYPE||message.reward!=null)return null;
            const match=/^gods_pack_(BXH-[A-Z0-9]{6})$/.exec(String(message.id||''));
            if(!match||message.eventCode!==match[1]||!Array.isArray(message.attachments)||
              !message.attachments.some(packAttachment))return null;
            // Unknown is not an unclaimed assertion. Only claimPack may decide/grant.
            return {kind:'gods_card_pack',status:'unknown',eventCode:match[1]};
          }
          function rewardOf(message){
            if(message?.type!==OCT_CARD_REWARD_TYPE)return null;
            const context=packReceiptContext();
            return (context&&packReceipts.get(context)?.get(message.id))||message.reward||projectedPack(message);
          }'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old="return !!(isGodsPack(r)&&item?.kind==='gods_card_pack'&&item?.mime==='application/x-bxh-card-pack');"
          assert s.count(old)==1
          s=s.replace(old,"return !!(isGodsPack(r)&&packAttachment(item));")
          s=s.replace("window.BXHCardRewardUI={",r'''window.BXHCardRewardUI={
            bodyText(message){
              const body=String(message?.body||'');
              return isGodsPack(rewardOf(message))?body.replace(/\\r\\n|\\n|\\r/g,'\n'):body;
            },''',1)
          old="const result=await svc.cardAlbum({action:'claimPack',messageId});\n      if(!result?.ok||!result.cardId)throw Error('card-pack-claim-failed');\n      return {ok:true,card:{id:result.cardId,setId:'gods',name:cardName(result.cardId)},bonus:Array.isArray(result.bonus)?result.bonus:[]};"
          new=r'''if(message?.id!==messageId)throw Error('card-pack-message-mismatch');
                const context=packReceiptContext();
                const result=await svc.cardAlbum({action:'claimPack',messageId});
                if(!result?.ok||!Object.prototype.hasOwnProperty.call(CARD_NAMES,result.cardId)||
                  (result.bonus!=null&&(!Array.isArray(result.bonus)||result.bonus.some(id=>!Object.prototype.hasOwnProperty.call(CARD_NAMES,id)))))throw Error('card-pack-claim-failed');
                const bonus=Array.isArray(result.bonus)?result.bonus.slice():[];
                // Retain only this session's successful server receipt across projected
                // mailbox reloads. Never persist or increment any inventory in the client.
                if(context&&context===packReceiptContext()){
                  if(!packReceipts.has(context))packReceipts.set(context,new Map());
                  packReceipts.get(context).set(messageId,{kind:'gods_card_pack',status:'claimed',
                    eventCode:message.eventCode,cardId:result.cardId,bonus});
                }
                return {ok:true,replayed:result.replayed===true,card:{id:result.cardId,setId:'gods',name:cardName(result.cardId)},bonus};'''
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace("art=cardArt(r),name=cardName(r.cardId);","art=cardArt(r),name=r.cardName||cardName(r.cardId);")
          p.write_text(s)
          p=root/'modules/main-app/mailbox.js';s=p.read_text()
          old="${esc(selected.body||'')}"
          assert s.count(old)==1
          s=s.replace(old,"${esc(window.BXHCardRewardUI?.bodyText?.(selected)??selected.body??'')}")
          old="  if(action==='mailbox-card-reward'){\n    const messageId="
          new="  if(action==='mailbox-card-reward'){\n    // Core may retain this pre-bridge handler; claims must use session guards.\n    const current=window.BXHMailbox?.handleMailbox;\n    if(typeof current==='function'&&current!==handleMailbox)return current(action,target);\n    const messageId="
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          p=root/'tests/card-album-claim-refresh.test.cjs'
          s=p.read_text();s+="\n// Include projected mailbox payload regressions in the existing critical gate.\nrequire('./card-pack-projection.test.cjs');\n";p.write_text(s)
          p=root/'index.html';s=p.read_text();assert s.count('20261003-card-pack-claim-1')==2
          s=s.replace('20261003-card-pack-claim-1','20261003-card-pack-projection-2')
          assert s.count('20261003.2')==2
          s=s.replace('20261003.2','20261003.3');p.write_text(s)
          p=root/'version.json';v=json.loads(p.read_text());v['build']='20261003.3';v['updatedAt']='2026-10-03T17:04:03+08:00';v['releaseTrigger']='card-pack-mailbox-projection-hotfix';p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          after={'card-reward-mail.js':'d54f08fd403692d526d52267567d7127430ff72d82a74c7f07d982c122ca9721','modules/main-app/mailbox.js':'8c463c55a8e8232cc1f679b319d55513fb5ba287b77e82734c3785e1bacbb919','index.html':'c73c351b3fbd7ebb55fe6c2c74a022cc8fbaa5a0ce0a0a653bcdf29802a02ab2','tests/card-album-claim-refresh.test.cjs':'b794ae436e5d4be1687e6419ba1bb7e40e54d3e09db51345c39a84ff20dd75b4','version.json':'0f308de27f69064c7132dfd301e95383065841a5fc86deac5926878669ba148e','tests/card-pack-projection.test.cjs':'7b02c8e9e71d905f3d4f6143938090a100ea59ef10b5316bb5b1dace9441771a'}
          for name,digest in after.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,('candidate-mismatch',name)
          print('PASS all six candidate files match locally verified SHA-256 hashes')
          PY
      - name: Run original and projected-payload regressions
        run: |
          node --check card-reward-mail.js
          node --check modules/main-app/mailbox.js
          node --test tests/card-album-claim-refresh.test.cjs
          node scripts/run-regression-core.cjs critical
          node scripts/verify-production-frontend.cjs
          git diff --check
      - name: Remove branch-only tooling and commit only approved repair
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'hotfix/card-pack-projection-20261003'
          git rm .github/workflows/card-pack-public-probe.yml .github/workflows/card-pack-projection-apply.yml
          git add card-reward-mail.js modules/main-app/mailbox.js index.html version.json tests/card-album-claim-refresh.test.cjs tests/card-pack-projection.test.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix projected gods-pack mailbox rendering with session-safe server receipts'
          git push origin HEAD:hotfix/card-pack-projection-20261003
