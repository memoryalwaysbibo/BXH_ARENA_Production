name: BXH ARENA Emulator E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: bxh-arena-emulator-e2e
  cancel-in-progress: true

jobs:
  player-community-flow:
    name: Player signup and community room E2E
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install Java for Firestore Emulator
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-17-jre-headless
          java -version

      - name: Install test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Run Firebase Emulator E2E
        shell: bash
        run: |
          npx firebase emulators:exec             --only auth,firestore             --project demo-bxh-arena-e2e             --config tests/e2e/firebase.json             "npm run test:ui-e2e"

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bxh-arena-emulator-e2e-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
