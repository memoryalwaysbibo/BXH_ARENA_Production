name: Public Catalog Browser Fixture
on:
  pull_request:
    paths: ['tests/bey-catalog-public-browser.test.cjs', '.github/workflows/catalog-public-browser-fixture.yml']
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.0
      - name: Verify isolated public catalog and clean interception teardown
        run: node --test tests/bey-catalog-public-browser.test.cjs
