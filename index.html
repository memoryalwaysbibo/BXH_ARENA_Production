}

function playFireworks(){
  try{
    clearFireworks();
    const fx = document.getElementById("celebration-fx");
    if(!fx) return;
    const reduced = (typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const isMobile = (typeof window!=="undefined" && window.innerWidth && window.innerWidth<640);
    const colors = ["#D4AF37","#F3D98B","#F7F2E8","#8A6428","#2A090D"];
    let html = "";
    if(reduced){
      const dotCount = isMobile ? 10 : 18;
      for(let i=0;i<dotCount;i++){
        const x = Math.random()*100, y = 10+Math.random()*70;
        html += `<div class="fw-static" style="left:${x}%;top:${y}%;background:${colors[i%colors.length]};"></div>`;
      }
      fx.innerHTML = html;
      return;
    }
    const origins = isMobile
      ? [{x:6,y:28},{x:94,y:28},{x:10,y:55},{x:90,y:55}]
      : [{x:6,y:22},{x:12,y:48},{x:94,y:22},{x:88,y:48},{x:20,y:10},{x:80,y:10}];
    let idx=0;
    origins.forEach((origin, oi)=>{
      const particleCount = isMobile ? 8 : 12;
      for(let i=0;i<particleCount;i++){
        const angle = (Math.PI*2*i)/particleCount + Math.random()*0.4;
        const dist = 55 + Math.random()*65;
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        const color = (idx % 8===7) ? colors[4] : colors[idx % 4]; idx++;
        const delay = (oi*0.4 + Math.random()*0.3).toFixed(2);
        html += `<div class="fw-particle" style="left:${origin.x}%;top:${origin.y}%;background:${color};color:${color};--dx:${dx}px;--dy:${dy}px;animation-delay:${delay}s;"></div>`;
      }
    });
    const confettiCount = isMobile ? 10 : 22;
    for(let i=0;i<confettiCount;i++){
      const x = Math.random()*100;
      const color = (i % 9===8) ? colors[4] : colors[i % 4];
      const delay = (1.2 + Math.random()*2.4).toFixed(2);
      html += `<div class="fw-confetti" style="left:${x}%;top:-20px;background:${color};animation-delay:${delay}s;"></div>`;
    }
    fx.innerHTML = html;
    __fxTimer = setTimeout(()=>{
      const fx2 = document.getElementById("celebration-fx");
      if(fx2) fx2.innerHTML = "";
    }, 8000);
  }catch(e){ /* no-op outside a real browser DOM */ }
}

function renderModal(){
  if(!pendingModal) return "";
  const mm = pendingModal;
  let body = mm.messageIsHtml ? `<div class="modal-rich-content">${mm.message||""}</div>` : `<p>${esc(mm.message).replace(/\n/g,"<br>")}</p>`;
  mm.confirmDisabled = false;
  if(mm.type==="confirm-result"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;
      mm.confirmDisabled = true;
    } else if(m.completed || m.status==="completed"){
      body = `<p>此場比賽已完成確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aName = playerName(m.a.playerId), bName = playerName(m.b.playerId);
      // Winner side is recomputed fresh on every render, straight from the live score.
      // There is no clickable selection here — nothing in this modal can change winnerId.
      const winSide = checkWinnerSide(m);
      if(!winSide){
        const tieMsg = (m.scoreA===m.scoreB) ? "目前比分相同，無法確認獲勝者。" : "比分尚未達到獲勝條件，請重新確認。";
        body = `<p class="result-invalid-msg">${esc(tieMsg)}</p>
        <div class="radio-row">
          <div class="radio-opt result-locked">${esc(aName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreA} 分</span></div>
          <div class="radio-opt result-locked">${esc(bName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreB} 分</span></div>
        </div>`;
        mm.confirmDisabled = true;
      } else {
        const aWins = winSide==="A";
        const winName = aWins ? aName : bName, winScore = aWins ? m.scoreA : m.scoreB;
        const loseName = aWins ? bName : aName, loseScore = aWins ? m.scoreB : m.scoreA;
        body = `<p>系統已依目前比分判定本場獲勝者，請確認比分無誤。</p>
        <div class="radio-row">
          <div class="radio-opt result-winner" aria-disabled="false">
            <span class="result-crown">${WINNER_CROWN_SVG}</span><br>
            ${esc(winName)}<br><span style="font-size:12px;">${winScore} 分</span><br>
            <span class="result-tag result-tag-win">系統判定獲勝</span>
          </div>
        </div>`;
        mm.confirmDisabled = false;
      }
    }
  }
  if(mm.type==="confirm-quick"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;

    } else if(m.completed || m.status==="completed" || m.winnerId){
      body = `<p>本場比賽已完成判定。</p>`;
      mm.confirmDisabled = true;
    } else if(mm.selectedWinnerId!==m.a.playerId && mm.selectedWinnerId!==m.b.playerId){
      body = `<p>賽事資料已變更或不符合判定條件，請重新確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aWins = mm.selectedWinnerId===m.a.playerId;
      const winName = aWins ? playerName(m.a.playerId) : playerName(m.b.playerId);

      body = `<p class="quick-confirm-meta">比賽輪次：${refereeStageLabel(m)} · 第 ${m.indexInRound+1} 場　比賽台：台${m.station}</p>

      mm.confirmDisabled = false;
    }
  }
  if(mm.type==="room-password"){
    body = `<p>此房間受到密碼保護。請輸入主辦提供的房間密碼。</p>
    ${mm.error?`<div class="auth-error">${esc(mm.error)}</div>`:""}

    <p class="hint">驗證成功後會取得此房間的暫時 Access Grant；密碼不會保存在瀏覽器。</p>`;
    mm.confirmDisabled=false;
  }
  if(mm.type==="reauth-unarchive"){
    body = `<p>此賽事已封存為歷史紀錄。更正歷史結果需要重新確認您的身分。</p>
    ${mm.error ? `<div class="auth-error">${esc(mm.error)}</div>` : ""}
    <div class="field"><label>請再次輸入登入密碼</label><input type="password" id="reauth-password-input" autocomplete="current-password"></div>
    <p class="hint" style="margin-top:6px;">驗證成功後，此次操作會記錄修改前的名次資料、修改者與修改時間。</p>`;
    mm.confirmDisabled = false;
  }
  return `<div class="modal-overlay confirmation-overlay" data-action="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box ${mm.type==="confirm-quick"?"quick-confirm-modal":""}">
      <h3>${esc(mm.title)}</h3>
      ${body}
      <div class="btn-row ${(mm.type==="confirm-result"||mm.type==="confirm-quick")?"result-confirm-actions":""}">
        <button id="modal-cancel-btn" class="btn btn-ghost btn-block" data-action="modal-cancel" type="button">${esc(mm.cancelLabel||"取消")}</button>
        <button id="modal-confirm-btn" class="btn ${mm.danger?'btn-danger-solid':'btn-primary'} btn-block" data-action="modal-confirm" type="button" ${(mm.confirmDisabled||mm.confirmBusy)?'disabled':''}>${mm.confirmBusy?'處理中……':esc(mm.confirmLabel||"確認")}</button>
      </div>
    </div>
  </div>`;
}

function historyCloudIdentityKey(){
  return JSON.stringify([currentAuthUid(), currentRole,
    userProfile && userProfile.role, userProfile && userProfile.active,
    engagementSessionEpoch]);
}
function isHistoryCloudView(){
  return appPhase==="app" && activeTab==="history" && hasAdminAccess();
}
function cancelHistoryCloudSync(){
  const request=historyCloudSyncRequest;
  historyCloudSyncRequest=null;
  historyCloudSyncBusy=false;
  if(request) request.cancel();
}
function reconcileHistoryCloudContext(){
  const key=historyCloudIdentityKey();
  const visible=isHistoryCloudView();
  if(key!==historyCloudSyncContextKey){
    cancelHistoryCloudSync();
    // Remove only records imported into this session, not locally authored records.
    recordIndex=recordIndex.filter(r=>!historyCloudRecordCache.has(r.id));
    historyCloudRecordCache.clear();
    viewingRecordId=null; viewingRecordData=null;
    historyCloudSyncLoaded=false; historyCloudSyncError="";
    historyCloudSyncContextKey=key;
  }else if(historyCloudViewActive && !visible){
    cancelHistoryCloudSync();
    historyCloudSyncLoaded=false;
    historyCloudSyncError="";
  }
  historyCloudViewActive=visible;
}
async function syncCompletedCloudRecordsToHistory(force){
  reconcileHistoryCloudContext();
  if(!isHistoryCloudView() || historyCloudSyncBusy) return;
  if(historyCloudSyncLoaded && !force) return;

  // This is an attempt latch, including failure. Rendering is never a retry policy.
  historyCloudSyncLoaded=true;
  historyCloudSyncBusy=true;
  historyCloudSyncError="";
  const request={key:historyCloudIdentityKey(),cancel:()=>{}};
  historyCloudSyncRequest=request;
  const current=()=>historyCloudSyncRequest===request && request.key===historyCloudIdentityKey() && isHistoryCloudView();
  const cancelled=()=>Object.assign(new Error("history-cancelled"),{code:"history-cancelled"});
  const check=()=>{if(!current()) throw cancelled();};
  let timer;
  const stop=new Promise((resolve,reject)=>{
    request.cancel=()=>reject(cancelled());
    timer=setTimeout(()=>reject(Object.assign(new Error("history-timeout"),{code:"history-timeout"})),HISTORY_CLOUD_TIMEOUT_MS);
  });
  render();
  try{
    const result=await Promise.race([(async()=>{
      if(window.cloudSync && window.cloudSync.connect) await window.cloudSync.connect();
      check();
      if(!cloudAvailable()) throw new Error("cloud-unavailable");
      const summaries=await window.cloudSync.queryAdminTournaments();
      check();
      const completed=(Array.isArray(summaries)?summaries:[]).filter(t=>t.archiveStatus==="completed" || t.tournamentPhase==="done");
      const records=[],cloudSummaries=[];
      let failedCount=0;
      for(const item of completed){
        check();
        try{
          const response=await window.cloudSync.joinRoom(item.code);
          check();
          if(!response || !response.ok || !response.data){failedCount++;continue;}
          const rec=Object.assign(defaultState(response.data.id),response.data);
          rec.cloudCode=item.code;
          rec.archiveStatus="completed";
          if(!rec.completedAt) rec.completedAt=item.updatedAt || Date.now();
          if(!rec.archivedAt) rec.archivedAt=rec.completedAt;
          records.push(rec); cloudSummaries.push(summarizeRecord(rec));
        }catch(e){
          check();
          failedCount++;
          console.warn("[history sync] record unavailable",item.code,e);
        }
      }
      const localIndex=await loadIndex();
      check();
      return {records,cloudSummaries,localIndex,failedCount,total:completed.length};
    })(),stop]);
    check();
    // Stage first, commit once. Late responses cannot write the UI or local storage.
    const merged=new Map();
    (Array.isArray(result.localIndex)?result.localIndex:[]).forEach(r=>merged.set(r.id,r));
    historyCloudRecordCache.clear();
    result.records.forEach(rec=>historyCloudRecordCache.set(rec.id,rec));
    result.cloudSummaries.forEach(r=>merged.set(r.id,r));
    recordIndex=Array.from(merged.values());
    if(result.failedCount){
      historyCloudSyncError=`已同步 ${result.records.length} 場賽事；另有 ${result.failedCount} 場讀取失敗。請確認權限或稍後按「重新同步雲端紀錄」。`;
    }
  }catch(e){
    if(!current()) return;
    console.warn("[history sync] failed",e);
    historyCloudSyncError=e && e.code==="permission-denied"
      ? "目前帳號沒有讀取雲端歷史賽事的權限。可切換其他分頁；權限確認後再按「重新同步雲端紀錄」。"
      : e && e.code==="history-timeout"
        ? "雲端紀錄同步逾時，已停止等待。請確認網路後按「重新同步雲端紀錄」。"
        : "雲端賽事紀錄同步失敗。請確認網路後按「重新同步雲端紀錄」，或先切換其他分頁。";
  }finally{
    clearTimeout(timer);
    if(historyCloudSyncRequest===request){
      historyCloudSyncRequest=null;
      historyCloudSyncBusy=false;
      if(request.key===historyCloudIdentityKey() && isHistoryCloudView()) render();
    }
  }
}

function renderHistoryDetail(rec){
  const saved = state;
  state = rec;
  let bracketHtml, stats;
  try{
    const fmt0 = rec.meta.formatType || "single";
    if(!rec.bracketSize){ bracketHtml = '<div class="panel"><div class="empty-state">此賽事尚未產生對戰表</div></div>'; }
    else if(fmt0==="double") bracketHtml = renderDoubleElimBracket();
    else if(fmt0==="roundrobin") bracketHtml = renderRoundRobinBracket();
    else bracketHtml = renderSingleElimBracket();
    bracketHtml = bracketHtml.replace(/data-action="open-match"/g, "").replace(/<button class="btn btn-ghost btn-sm" data-action="print-bracket">[^<]*<\/button>/g, "");
    stats = computeStats();
  } finally { state = saved; }

  const fmt = rec.meta.formatType || "single";
  const realMatches = (rec.matches||[]).filter(m=>!m.isBye);
  const completedMatches=realMatches.filter(m=>m.completed);
  const doneCount = completedMatches.length;
  const pct = realMatches.length ? Math.round(doneCount/realMatches.length*100) : 0;
  const officialParticipantCount=tournamentEligiblePlayers(rec.players,rec.meta,rec.matches).length;
  const startedAt=Number(rec.startedAt||0), completedAt=Number(rec.completedAt||rec.archivedAt||0);
  const durationMin=(startedAt&&completedAt&&completedAt>=startedAt)?Math.round((completedAt-startedAt)/60000):null;
  const matchDurations=completedMatches.map(m=>Number(m.completedAt||0)-Number(m.startedAt||0)).filter(x=>x>0);
  const avgMatchSec=matchDurations.length?Math.round(matchDurations.reduce((a,b)=>a+b,0)/matchDurations.length/1000):null;
  const fmtDuration=sec=>sec==null?"—":sec<60?`${sec} 秒`:`${Math.floor(sec/60)} 分 ${sec%60} 秒`;
  const playerRows = (rec.players||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.checkedIn?'<span class="badge badge-neon">已報到</span>':'<span class="badge badge-metal">未報到</span>'}</td></tr>`).join("");
  const matchRows=completedMatches.slice().sort((a,b)=>(Number(a.seq||0)-Number(b.seq||0))).map((m,i)=>{
    const a=m.a&&m.a.playerId?recName(rec,m.a.playerId):"—", b=m.b&&m.b.playerId?recName(rec,m.b.playerId):"—", winner=m.winnerId?recName(rec,m.winnerId):"—";

    return `<tr><td>${i+1}</td><td>Court ${Number(m.confirmedStation||m.station||0)||"—"}</td><td>${esc(a)} <b>${Number(m.scoreA||0)} : ${Number(m.scoreB||0)}</b> ${esc(b)}</td><td>${esc(winner)}</td><td>${esc(judge)}</td><td>${m.confirmedAt?esc(new Date(Number(m.confirmedAt)).toLocaleString()):"—"}</td></tr>`;
  }).join("");

  const championHtml = rec.championId ? `<div class="panel postmatch-ranking"><div class="panel-title">最終名次</div><div class="postmatch-podium"><div><span>冠軍</span><b>${esc(recName(rec,rec.championId))}</b></div><div><span>亞軍</span><b>${rec.runnerUpId?esc(recName(rec,rec.runnerUpId)):"—"}</b></div><div><span>季軍</span><b>${rec.thirdId?esc(recName(rec,rec.thirdId)):"—"}</b></div><div><span>殿軍</span><b>${rec.fourthId?esc(recName(rec,rec.fourthId)):"—"}</b></div></div><div class="btn-row" style="margin-top:14px;"><button class="btn btn-primary btn-sm" data-action="view-celebration" data-id="${rec.id}">查看最終排名慶祝畫面</button></div></div>` : "";

  return `<div class="postmatch-center">
  <div class="panel postmatch-hero">
    <div class="panel-title"><span>賽後中心｜${esc(rec.meta.name||"未命名賽事")}</span><button class="btn btn-ghost btn-sm" data-action="back-to-history-list">← 返回賽事紀錄</button></div>
    ${renderSystemClosureNotice(rec)}
    ${rec.testLadderSettlementNote?`<p role="status">${esc(rec.testLadderSettlementNote)}</p>`:""}
    <div class="hint">已完成賽事的結果、對戰表、逐場判決與參賽資料集中於此查閱。</div>
    <div class="grid grid-4" style="margin-top:14px;"><div class="stat-box"><div class="label">日期</div><div class="value small">${esc(rec.meta.date||"—")}</div></div><div class="stat-box"><div class="label">地點</div><div class="value small">${esc(rec.meta.location||"—")}</div></div><div class="stat-box"><div class="label">賽制</div><div class="value small">${esc(FORMAT_LABELS[fmt]||"")}</div></div><div class="stat-box"><div class="label">狀態</div><div class="value small">${esc(ARCHIVE_LABELS[rec.archiveStatus]||rec.archiveStatus)}</div></div></div>
    <div class="grid grid-4" style="margin-top:12px;"><div class="stat-box"><div class="label">參賽人數</div><div class="value">${officialParticipantCount}</div></div><div class="stat-box"><div class="label">完成場次</div><div class="value">${doneCount} / ${realMatches.length}</div></div><div class="stat-box"><div class="label">賽事耗時</div><div class="value small">${durationMin==null?"—":durationMin+" 分鐘"}</div></div><div class="stat-box"><div class="label">平均每場</div><div class="value small">${fmtDuration(avgMatchSec)}</div></div></div>
    ${rec.archiveStatus==="completed" && !(rec.systemClosure&&!rec.systemClosure.restoredAt)?`<div class="banner" style="margin-top:14px;"><span>唯讀歷史紀錄｜${isSuperAdmin()?"最高管理員可解除封存進行更正。":"如需更正，請由最高管理員處理。"}</span>${isSuperAdmin()?`<button class="btn btn-ghost btn-sm" data-action="unarchive-record" data-id="${rec.id}">解除封存並編輯</button>`:""}</div>`:""}
  </div>
  ${championHtml}
  <div class="panel"><div class="panel-title">逐場判決紀錄</div>${matchRows?`<div class="rank-scroll"><table class="rank-table postmatch-match-table"><thead><tr><th>#</th><th>戰鬥台</th><th>比分</th><th>勝方</th><th>判決裁判</th><th>確認時間</th></tr></thead><tbody>${matchRows}</tbody></table></div>`:`<div class="empty-state">尚無可追溯的完成場次</div>`}<div class="hint" style="margin-top:10px;">v13.22.0 起的正式判定會保存實際確認裁判；更舊紀錄可能顯示「舊版未記錄」。</div></div>
  <div class="panel"><div class="panel-title">最終排名</div>${renderStandingsTableGeneric(stats, fmt)}</div>
  <div class="panel"><div class="panel-title">參賽名單與報到狀態</div><div class="rank-scroll"><table class="rank-table"><thead><tr><th>選手</th><th>報到狀態</th></tr></thead><tbody>${playerRows}</tbody></table></div></div>
  <div class="panel"><div class="panel-title">完整最終對戰表</div><div class="hint" style="margin-bottom:12px;">以下為賽事完成後保存的唯讀對戰結果。</div>${bracketHtml}</div>
  </div>`;
}

// clamp window.scrollY back to 0. Preserve the viewport only when the user remains

// starts naturally instead of inheriting an unrelated old scroll position.
let __lastRenderedViewportKey = null;
let __viewportRestoreToken = 0;
function currentRenderViewportKey(){
  const safe = (v)=> (v==null ? "" : String(v));
  return [
    safe(appPhase),
    safe(appPhase==="account-management"?superAdminManagementPage:""),
    safe(appPhase==="account-management"&&superAdminManagementPage==="titles"?titleManagementContext().tab:""),

    safe(typeof communityRoomActiveTab!=="undefined" ? communityRoomActiveTab : ""),
    safe(typeof guestActiveTab!=="undefined" ? guestActiveTab : ""),
    safe(typeof viewingRecordId!=="undefined" ? viewingRecordId : ""),
    safe(state && (state.cloudCode || state.id || ""))
  ].join("|");
}
function captureHorizontalNavPositions(){
  if(typeof document==="undefined") return {};
  const out={};
  const selectors={
    adminTabs:"nav.tabs",
    playerTabs:".stickytop .player-tabs:not(.player-tabs-bottom)",
    guestTabs:".guest-tabs"
  };
  Object.entries(selectors).forEach(([key,sel])=>{
    const el=document.querySelector(sel);
    if(el) out[key]=Number(el.scrollLeft||0);
  });
  return out;
}
function restoreHorizontalNavPositions(positions){
  if(!positions || typeof document==="undefined") return;
  const selectors={
    adminTabs:"nav.tabs",
    playerTabs:".stickytop .player-tabs:not(.player-tabs-bottom)",
    guestTabs:".guest-tabs"
  };
  Object.entries(selectors).forEach(([key,sel])=>{
    if(!(key in positions)) return;
    const el=document.querySelector(sel);
    if(!el) return;

  });
}

function captureRenderViewport(){
  const key = currentRenderViewportKey();
  const canReadWindow = typeof window!=="undefined";
  return {
    key,
    preserve: __lastRenderedViewportKey!==null && __lastRenderedViewportKey===key,
    x: canReadWindow ? (window.scrollX || 0) : 0,
    y: canReadWindow ? (window.scrollY || 0) : 0,
    navScroll: captureHorizontalNavPositions()
  };
}
function finishRenderViewport(snapshot){
  if(!snapshot) return;
  __lastRenderedViewportKey = snapshot.key;
  if(typeof window==="undefined") return;

  const token = ++__viewportRestoreToken;
  const restoreNav = ()=>{
    if(token!==__viewportRestoreToken) return;
    restoreHorizontalNavPositions(snapshot.navScroll);
  };
  const restorePage = ()=>{
    if(token!==__viewportRestoreToken) return;
    if(!snapshot.preserve || !window.scrollTo) return;
    if(currentRenderViewportKey()!==snapshot.key) return;
    try{ window.scrollTo(snapshot.x, snapshot.y); }catch(e){}
  };
  const restore = ()=>{ restoreNav(); restorePage(); };

  // Navigation scrollLeft is restored even when the active tab changes. Page
  // scrollY is restored only for the same view key. This separates BUG 006
  // (horizontal tab position) from v13.23.5's page-scroll preservation.
  restore();
  const raf = (typeof requestAnimationFrame==="function") ? requestAnimationFrame : (fn)=>setTimeout(fn,16);
  raf(()=>{ restore(); raf(restore); });
  setTimeout(restore, 80);
  setTimeout(restore, 180);
}

function normalizeInterfaceTheme(value){

  try{return normalizeInterfaceTheme(localStorage.getItem(BXH_INTERFACE_THEME_KEY));}catch(e){return "gold";}
})();

function restoreAccountInterfaceTheme(uid,profile){
  let saved=null;
  try{saved=localStorage.getItem(BXH_INTERFACE_THEME_ACCOUNT_PREFIX+uid);}catch(e){}
  const fromAccount=profile&&typeof profile.interfaceTheme==="string"?profile.interfaceTheme:null;
  interfaceTheme=normalizeInterfaceTheme(saved||fromAccount||"gold");

  try{

function canUseDirectiveTheme(){

  if(firebaseUser || !entranceThemeAccountUid)return false;
  try{return localStorage.getItem(BXH_INTERFACE_THEME_ACCOUNT_PREFIX+entranceThemeAccountUid)==="directive";}catch(e){return false;}

function syncInterfaceThemeVisibility(){
  const visibleTheme=interfaceTheme==="directive" && !canUseDirectiveTheme()?"gold":interfaceTheme;

    document.documentElement.setAttribute("data-bxh-theme",visibleTheme);
  }
}
function applyInterfaceTheme(value,persist=true){
  const nextTheme=normalizeInterfaceTheme(value);
  if(nextTheme==="directive" && !canUseDirectiveTheme())return;
  interfaceTheme=nextTheme;
  syncInterfaceThemeVisibility();
  if(persist){
    try{localStorage.setItem(BXH_INTERFACE_THEME_KEY,interfaceTheme);}catch(e){}
    const uid=firebaseUser?.uid;
    if(uid){
      try{localStorage.setItem(BXH_INTERFACE_THEME_ACCOUNT_PREFIX+uid,interfaceTheme);}catch(e){}
      entranceThemeAccountUid=uid;
      try{localStorage.setItem(BXH_INTERFACE_THEME_ENTRANCE_UID_KEY,uid);}catch(e){}
      if(userProfile)userProfile.interfaceTheme=interfaceTheme;
      if(window.cloudAuth?.saveInterfaceTheme){
        window.cloudAuth.saveInterfaceTheme(uid,interfaceTheme).then(result=>{
          if(!result?.ok && firebaseUser?.uid===uid)showToast("主題已套用於此裝置，帳號同步尚未完成",true);
        }).catch(()=>{if(firebaseUser?.uid===uid)showToast("主題已套用於此裝置，帳號同步尚未完成",true);});

    }
  }

  const rect=badge.getBoundingClientRect();
  const vw=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);
  const margin=12;
  const preferredWidth=Math.max(190,Math.min(280,rect.width+46));
  const width=Math.min(preferredWidth,Math.max(180,vw-margin*2));
  const left=Math.min(Math.max(margin,rect.right-width),Math.max(margin,vw-width-margin));
  const top=Math.max(margin,rect.bottom+8);
  menu.style.width=width+"px";
  menu.style.left=left+"px";
  menu.style.top=top+"px";
  menu.style.right="auto";
}

function presenceContext(){
 const key=currentAuthUid()+':'+engagementSessionEpoch;
 if(presenceState.key!==key)presenceState={key,count:null,asOf:0,error:false,busy:false,lastAttempt:0};
 return presenceState;
}
function presenceAllowed(){return !!firebaseUser?.uid&&userProfile?.active===true&&userProfile?.role==='super_admin'&&!userProfile?.isTestAccount&&!userProfile?.deleted&&!['frozen','disabled','deleted'].includes(userProfile?.accountStatus);}
function presenceLabel(){if(!firebaseUser?.uid)return '登入同步中';if(userProfile?.isTestAccount)return '測試帳號不提供';if(userProfile?.active!==true||userProfile?.deleted||['frozen','disabled','deleted'].includes(userProfile?.accountStatus))return '帳號未啟用';const c=presenceContext();return c.error?'暫無資料':c.count===null?'讀取中…':Date.now()-c.asOf>120000?'等待更新':c.count+' 人';}
function renderOnlinePresence(){
 if(userProfile?.role!=='super_admin')return '';
 return `<div class="online-presence" title="最近 2 分鐘內使用本站的已登入帳號；同帳號多開只算一人，不含遊客。"><span>● 線上人數</span><strong data-presence-count>${presenceLabel()}</strong></div>`;
}
function refreshPresenceBadge(){
 const allowed=userProfile?.role==='super_admin';
 document.querySelectorAll('.online-presence').forEach(el=>{if(!allowed)el.remove();});
 if(!allowed)return;
 document.querySelectorAll('header.topbar .t-conn-heading').forEach(host=>{
  if(!host.querySelector('.online-presence'))host.insertAdjacentHTML('beforeend',renderOnlinePresence());
 });
 document.querySelectorAll('.online-presence [data-presence-count]').forEach(el=>{el.textContent=presenceLabel();});
}
async function tickPresence(){
 const c=presenceContext();refreshPresenceBadge();
 if(document.visibilityState!=='visible'||!firebaseUser?.uid||userProfile?.active!==true||!window.engagementService?.presence||c.busy||Date.now()-c.lastAttempt<45000)return;
 c.busy=true;c.lastAttempt=Date.now();
 try{const r=await window.engagementService.presence({action:'beat'});if(c!==presenceContext())return;if(!r?.ok)throw Error('presence-failed');c.count=Number.isSafeInteger(r.count)?r.count:null;c.asOf=Date.now();c.error=false;}
 catch(e){if(c===presenceContext())c.error=true;}
 finally{if(c===presenceContext()){c.busy=false;refreshPresenceBadge();}}
}
setInterval(tickPresence,5000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tickPresence();});

function cloudStatusBarHtml(){
  const configured = (typeof window!=="undefined" && window.cloudSync && window.cloudSync.isConfigured && window.cloudSync.isConfigured());
  const testBtn = hasAdminAccess() ? `<button class="btn btn-ghost" data-action="cloud-test-connection" ${cloudTestBusy?'disabled':''}>${cloudTestBusy?'測試中……':'測試雲端連線'}</button>` : "";
  const isGuest = currentRole==="guest";
  const isPlayer = currentRole==="player";
  const copyBtn = state.cloudCode ? `<button class="btn btn-ghost" data-action="cloud-copy-code">複製代碼</button>` : "";

  if(state.cloudCode){
    const dotClass = cloudAccessLimited ? "yellow" : (cloudStatus==="connected" ? "green" : (cloudStatus==="connecting" ? "yellow" : (cloudStatus==="error" ? "red" : "gray")));
    const label = cloudAccessLimited ? "⚠ 帳號權限受限" : (cloudStatus==="connected" ? "☁ 雲端已同步" : (cloudStatus==="connecting" ? "☁ 同步中…" : (cloudStatus==="error" ? "⚠ 雲端連線異常" : "☁ 僅本機")));
    let actionBtns = "";
    if(hasAdminAccess()){
      if(cloudStatus!=="connected"){ actionBtns += `<button class="btn btn-ghost" data-action="cloud-retry-connect">重試連線</button>`; }
      actionBtns += copyBtn;
      actionBtns += `<button class="btn btn-ghost" data-action="cloud-switch-tournament">切換賽事</button>`;
    } else if(isGuest || isPlayer){
      actionBtns = copyBtn + `<button class="btn btn-ghost" data-action="cloud-switch-tournament">切換賽事</button>`;
    }
    return `<div class="cloud-status-bar">
      <span class="cloud-dot-v2 ${dotClass}"></span>
      <span>${label}</span>
      <span class="cloud-code-chip">${state.cloudCode ? `代碼 ${esc(state.cloudCode)}` : "草稿賽事｜尚未發布"}</span>
      ${testBtn}
      ${actionBtns}
    </div>`;
  }

  let actionBtns = "";
  let dotClass = "gray";
  let label = "等待賽事架構中";
  if(hasAdminAccess()){
    if(!configured){
      label = "僅本機（未設定雲端）"; dotClass = "gray";
    } else if(cloudStatus==="connecting"){
      label = "☁ 建立雲端賽事中…"; dotClass = "yellow";
    } else if(cloudAccessLimited){
      label = "⚠ 帳號權限受限｜雲端仍已連線"; dotClass = "yellow";
    } else if(cloudStatus==="error"){
      label = "⚠ 雲端連線失敗，暫時使用本機模式"; dotClass = "red";
      actionBtns += `<button class="btn btn-ghost" data-action="cloud-retry-connect">重試連線</button>`;
    } else {
      label = "等待賽事架構中"; dotClass = "gray";
    }
    actionBtns += `<button class="btn btn-ghost" data-action="cloud-open-join-modal">輸入代碼加入</button>`;
  } else if(isGuest || isPlayer){
    label = configured ? "☁ 雲端已連線" : "僅本機（未設定雲端）";
    dotClass = configured ? "green" : "gray";
    actionBtns = `<span>尚未加入賽事</span><button class="btn btn-ghost" data-action="cloud-open-join-modal">輸入賽事代碼</button>`;
  }
  return `<div class="cloud-status-bar">
    <span class="cloud-dot-v2 ${dotClass}"></span>
    <span>${label}</span>
    ${cloudAccessLimited&&cloudAccessMessage?`<span class="hint">${esc(cloudAccessMessage)}</span>`:""}
    ${testBtn}
    ${actionBtns}
  </div>`;
}

function renderTournamentManagementTab(){
  if(!hasAdminAccess()){
    return `<div class="panel"><div class="empty-state">目前身分沒有賽事管理權限。</div></div>`;
  }
  if(!adminTournamentListLoaded && !adminTournamentListBusy){
    setTimeout(()=>{ loadAdminTournamentList(); }, 0);
  }

  const myUid=(firebaseUser&&firebaseUser.uid)||"";
  const allItems=adminTournamentListItems.slice();
  const isMine=t=>!!(myUid && t.createdBy===myUid);
  const mineCount=allItems.filter(isMine).length;
  const otherCount=allItems.length-mineCount;
  const visibleItems=allItems.filter(t=>adminTournamentListFilter==="mine"?isMine(t):adminTournamentListFilter==="others"?!isMine(t):true);
  const filterBar=`<div class="tournament-owner-filter" role="tablist" aria-label="賽事建立者篩選">
    <button class="${adminTournamentListFilter==='all'?'active':''}" data-action="admin-tournament-filter" data-filter="all">全部賽事 <b>${allItems.length}</b></button>
    <button class="${adminTournamentListFilter==='mine'?'active':''}" data-action="admin-tournament-filter" data-filter="mine">我的賽事 <b>${mineCount}</b></button>
    <button class="${adminTournamentListFilter==='others'?'active':''}" data-action="admin-tournament-filter" data-filter="others">其他賽事 <b>${otherCount}</b></button>
  </div>`;

  let body = "";
  if(adminTournamentListBusy && !adminTournamentListLoaded){
    body = `<div class="panel"><div class="empty-state"><div class="big">正在讀取雲端賽事…</div></div></div>`;
  }else if(adminTournamentListError){
    body = `<div class="panel"><div class="auth-error">${esc(adminTournamentListError)}</div><div class="btn-row" style="margin-top:12px;"><button class="btn btn-ghost" data-action="cloud-refresh-admin-list">重新整理</button></div></div>`;
  }else if(!visibleItems.length){
    const emptyLabel=adminTournamentListFilter==="mine"?"目前沒有自己建立的賽事":adminTournamentListFilter==="others"?"目前沒有其他人建立的可管理賽事":"目前沒有可管理的賽事";
    body = `<div class="panel"><div class="empty-state"><div class="big">${emptyLabel}</div><div class="hint">切換上方分類即可查看其他賽事。</div></div></div>`;
  }else{
    body = `<div style="display:flex;flex-direction:column;gap:10px;">${visibleItems.map(t=>{
      const confirmed = Number(t.confirmedCount||0), waiting = Number(t.waitlistCount||0), cap = Number(t.capacity||0);

async function loadAdminTournamentList(){
  if(!hasAdminAccess()) return;
  adminTournamentListBusy = true;
  adminTournamentListError = "";
  render();
  try{
    if(window.cloudSync && window.cloudSync.connect) await window.cloudSync.connect();
    if(!cloudAvailable()) throw new Error("雲端尚未連線");
    if(isTester() && window.cloudSync.cleanupMyExpiredTestRooms) await window.cloudSync.cleanupMyExpiredTestRooms();
    const res = await window.cloudSync.queryAdminTournaments();
    let rawItems = Array.isArray(res) ? res : [];
    if(isTester()) rawItems=rawItems.filter(t=>t.testMode===true&&t.eventAuthority==="test"&&t.createdBy===currentAuthUid());

    const staleCompleted=rawItems.filter(t=>t.archiveStatus==="completed" && t.tournamentPhase!=="done");
    if(staleCompleted.length && window.cloudSync.repairTournamentLifecycle){
      await Promise.all(staleCompleted.map(t=>window.cloudSync.repairTournamentLifecycle(t.code)));
      const refreshed=await window.cloudSync.queryAdminTournaments();
      rawItems=Array.isArray(refreshed)?refreshed:rawItems;
      publicTournamentsCache=null;
      myRegistrationsCache=null;
    }

    // v13.14.1：隱藏「剛建立但尚未填任何活動資料」的空白雲端賽事，避免管理清單被占滿。
    adminTournamentListItems = rawItems.filter(t=>{
      if(t.eventAuthority==="community") return false;
      const hasIdentity = !!String(t.name||"").trim() || !!String(t.eventDate||"").trim() || !!String(t.location||"").trim();
      const hasRegistration = !!t.registrationEnabled || Number(t.confirmedCount||0)>0 || Number(t.waitlistCount||0)>0;
      const hasProgress = (t.tournamentPhase && t.tournamentPhase!=="waiting");
      return hasIdentity || hasRegistration || hasProgress || (state.cloudCode && t.code===state.cloudCode);
    });
  }catch(e){
    console.warn("[adminTournamentList] load failed", e);
    adminTournamentListError = (e && e.code)==="permission-denied" ? "目前帳號沒有讀取賽事清單的權限" : "讀取雲端賽事清單失敗，請稍後再試";
  }finally{
    adminTournamentListBusy = false;
    adminTournamentListLoaded = true;
    render();
  }
}

async function searchPlayerNames(query){
  const names = new Set();
  const q = (query||"").trim();
  const idx = await loadIndex();
  const allRecordIds = idx.map(r=>r.id);
  for(const rid of allRecordIds){
    const rec = rid===state.id ? state : (await loadRecord(rid));
    if(!rec || !rec.players) continue;
    rec.players.forEach(p=>{
      if(!q || p.name.toLowerCase().includes(q.toLowerCase())) names.add(p.name);
    });
  }
  return Array.from(names).sort();
}

async function buildPlayerCenterData(name){
  const idx = await loadIndex();
  const records = [];
  let currentCheckin = "—";
  for(const r of idx){
    const rec = r.id===state.id ? state : (await loadRecord(r.id));
    if(!rec || !rec.players) continue;
    const p = rec.players.find(pl=>pl.name===name);
    if(!p) continue;
    let placement = "—";
    if(rec.championId===p.id) placement="冠軍";
    else if(rec.runnerUpId===p.id) placement="亞軍";
    else if(rec.thirdId===p.id) placement="季軍";
    else if(rec.fourthId===p.id) placement="殿軍";
    else if(rec.matches && rec.matches.some(m=>!m.isBye && m.completed && ((m.a&&m.a.playerId===p.id)||(m.b&&m.b.playerId===p.id)))) placement="已淘汰";
    else placement="—";
    let wins=0, losses=0;
    (rec.matches||[]).forEach(m=>{
      if(m.isBye || !m.completed || !m.winnerId) return;
      const aId = m.a&&m.a.playerId, bId = m.b&&m.b.playerId;
      if(m.winnerId===p.id) wins++;
      else if((aId===p.id||bId===p.id)) losses++;
    });
    records.push({ recordId: rec.id, date: rec.meta.date, eventName: rec.meta.name, formatType: rec.meta.formatType, playerCount: rec.players.length, placement, wins, losses });
    if(r.id===state.id){
      currentCheckin = p.checkedIn ? "已報到" : "未報到";
    }
  }
  records.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  return { name, records, currentCheckin };
}

    const enterFields = ["auth-username","auth-password"];
    enterFields.forEach(id=>{

      if(el){
        el.addEventListener("keydown", (e)=>{
          if(e.key==="Enter"){
            e.preventDefault();
            handleAction("admin-login-submit", el);
          }
        });
      }
    });
    const joinCodeInput = document.getElementById("cloud-join-code-input");

      // keyboard (which also fires a regular Enter keydown for a plain text

      // both submit the dialog — matches spec section 3.
      joinCodeInput.addEventListener("keydown", (e)=>{
        if(e.key==="Enter"){
          e.preventDefault();
          handleAction("cloud-join-room-submit", joinCodeInput);
        }
      });
    }
    const switchCodeInput = document.getElementById("switch-tournament-code-input");

      switchCodeInput.addEventListener("keydown", (e)=>{
        if(e.key==="Enter"){
          e.preventDefault();

        }
      });
    }
    if(typeof document.querySelectorAll === "function"){
      for(const selector of [".mgmt-role-select",".mgmt-active-box",".mgmt-test-box"]){
        document.querySelectorAll(selector).forEach(el=>el.addEventListener("change",()=>captureManagedAccountDraft(el.getAttribute("data-uid"))));

          }
        });

    }
  }catch(e){ /* no-op outside a real browser DOM */ }
}

let boardExpanded=false,boardFullscreenFallback=false,boardExpandedRoom=null,boardBodyOverflow=null,boardFullscreenBusy=false;
function syncBoardFullscreen(){
  const shell=document.getElementById('board-shell');
  if(!shell||boardExpandedRoom!==(state.cloudCode||state.id))boardExpanded=false;
  if(shell){
    shell.classList.toggle('board-expanded',boardExpanded);
    const button=shell.querySelector('[data-action="board-fullscreen"]');
    if(button){button.textContent=boardExpanded?'退出全螢幕':'全螢幕對戰表';button.setAttribute('aria-pressed',String(boardExpanded));}
  }
  if(boardExpanded){
    if(boardBodyOverflow===null)boardBodyOverflow=document.body.style.overflow;
    document.body.style.overflow='hidden';
  }else if(boardBodyOverflow!==null){document.body.style.overflow=boardBodyOverflow;boardBodyOverflow=null;}
}
async function toggleBoardFullscreen(){
  if(boardFullscreenBusy)return;
  const shell=document.getElementById('board-shell');if(!shell)return;
  if(boardExpanded){
    boardExpanded=false;boardFullscreenFallback=false;syncBoardFullscreen();
    try{if(document.fullscreenElement===shell)await document.exitFullscreen();}catch{showToast('請使用瀏覽器的退出全螢幕操作',true);}
    return;
  }
  boardExpanded=true;boardExpandedRoom=state.cloudCode||state.id;boardFullscreenFallback=true;syncBoardFullscreen();
  if(typeof shell.requestFullscreen==='function'){
    boardFullscreenBusy=true;
    try{await shell.requestFullscreen();boardFullscreenFallback=document.fullscreenElement!==shell;}
    catch{boardFullscreenFallback=true;}
    finally{boardFullscreenBusy=false;}
  }
  if(boardExpanded&&boardFullscreenFallback)showToast('已展開整張對戰表；此瀏覽器使用頁內滿版，可按「退出全螢幕」返回。');
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&!boardFullscreenFallback){boardExpanded=false;syncBoardFullscreen();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&boardExpanded&&boardFullscreenFallback){boardExpanded=false;boardFullscreenFallback=false;syncBoardFullscreen();}

let __html2canvasLoadPromise = null;

async function exportBoardAsImage(){

  if(!shell||!content||!viewport){showToast('找不到看板內容，請先切換至賽事看板模式',true);return;}
  boardExportBusy=true;showToast('正在產生完整對戰表 PNG……');
  try{
    await ensureHtml2Canvas();
    if(!shell.isConnected)throw Error('board-changed');
    const width=Math.ceil(Math.max(content.scrollWidth,content.offsetWidth)+48);
    const height=Math.ceil(content.scrollHeight+shell.scrollHeight-viewport.clientHeight+48);
    const scale=Math.min(2,8192/width,8192/height,Math.sqrt(12000000/(width*height)));
    const canvas=await window.html2canvas(shell,{
      backgroundColor:'#070808',scale,useCORS:true,windowWidth:Math.max(width,window.innerWidth),
      onclone:doc=>{
        const copy=doc.getElementById('board-shell'),view=doc.getElementById('board-viewport'),inner=doc.getElementById('board-canvas');
        copy.classList.remove('board-expanded');copy.classList.add('board-export-freeze');
        copy.style.cssText='position:relative;inset:auto;display:block;width:'+width+'px;height:auto;max-height:none;overflow:visible;box-sizing:border-box;padding:18px';
        view.style.cssText='height:auto;min-height:0;overflow:visible;display:block';
        inner.style.transform='none';inner.style.transition='none';
        copy.querySelectorAll('.board-toolbar,.board-help,.share-btn,.event-title-bar').forEach(el=>el.style.display='none');
      }
    });
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(v=>v?resolve(v):reject(Error('png-encode-failed')),'image/png'));
    const dateStr=new Date().toISOString().slice(0,10);
    const safeName=(state.meta.name||'賽事').replace(/[\\\/:*?"<>|]/g,'_');
    const filename='BXH_'+safeName+'_'+dateStr+'_完整對戰表.png';
    let shared=false;
    try{
      if(typeof File==='function'&&navigator&&typeof navigator.share==='function'&&typeof navigator.canShare==='function'){
        const file=new File([blob],filename,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({title:'BXH ARENA｜完整對戰表',text:state.meta.name||'完整對戰表',files:[file]});
          shared=true;
          showToast('已開啟系統分享；iPhone 請選「儲存影像」加入照片相簿。');
        }
      }
    }catch(e){
      if(e&&e.name==='AbortError'){
        showToast('已取消儲存／分享');
        return;
      }
    }
    if(!shared){
      downloadBoardPng(blob,filename);
      showToast('已下載 PNG 圖檔；iPhone 可至下載項目開啟後存入照片。');
    }
  }catch(e){
    console.warn('[board export]',e);
    showToast('匯出圖片失敗，請稍後再試',true);
  }finally{
    boardExportBusy=false;
  }
}

function bindBoardModeInteractions(){
  if(bracketViewMode!=="board") return;
  try{
    const viewport = document.getElementById("board-viewport");
    const canvas = document.getElementById("board-canvas");
    if(!viewport || !canvas) return;

    bindCompletedMatchCorrectionLongPress(viewport);

    viewport.addEventListener("wheel", (e)=>{
      if(!e.ctrlKey) return;
      e.preventDefault();
      setBoardZoom(boardZoom + (e.deltaY<0 ? 0.1 : -0.1));
    }, { passive:false });

    let dragging=false, startX=0, startY=0, startPanX=0, startPanY=0;
    viewport.addEventListener("mousedown", (e)=>{
      dragging=true; startX=e.clientX; startY=e.clientY; startPanX=boardPanX; startPanY=boardPanY;
      viewport.style.cursor="grabbing";
    });
    window.addEventListener("mousemove", (e)=>{
      if(!dragging) return;
      boardPanX = startPanX + (e.clientX-startX);
      boardPanY = startPanY + (e.clientY-startY);
      applyBoardTransform();
    });
    window.addEventListener("mouseup", ()=>{ dragging=false; viewport.style.cursor="grab"; });

    let touchStartDist=0, touchStartZoom=1, touchStartX=0, touchStartY=0, touchStartPanX=0, touchStartPanY=0;
    viewport.addEventListener("touchstart", (e)=>{
      if(e.touches.length===2){
        touchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        touchStartZoom = boardZoom;
      } else if(e.touches.length===1){
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        touchStartPanX = boardPanX; touchStartPanY = boardPanY;
      }
    }, { passive:true });
    viewport.addEventListener("touchmove", (e)=>{
      if(e.touches.length===2){
        e.preventDefault();
        const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        if(touchStartDist>0) setBoardZoom(touchStartZoom * (dist/touchStartDist));
      } else if(e.touches.length===1){
        boardPanX = touchStartPanX + (e.touches[0].clientX-touchStartX);
        boardPanY = touchStartPanY + (e.touches[0].clientY-touchStartY);
        applyBoardTransform();
      }
    }, { passive:false });

    const themeSelect = document.getElementById("board-theme-select");
    if(themeSelect){
      themeSelect.addEventListener("change", ()=>{
        boardTheme = themeSelect.value;
        const shell = document.getElementById("board-shell");
        if(shell) shell.setAttribute("data-board-theme", boardTheme);
        saveBoardThemePreference(boardTheme);
      });
    }
  }catch(e){ /* pointer/touch APIs unavailable outside a real browser; board mode still renders statically */ }
}

 if(!state.cloudCode)return '<div class="panel">請先建立或開啟雲端賽事，再設定抽獎。</div>';
 const o=operationsContext(),d=o.draft,prizes=operationsDraftPrizes(d),pending=readOperationsPending(state.cloudCode),locked=o.busy||o.data?.systemClosed===true;
 const modes={general:'一般抽獎',first_round:'一輪遊抽獎'},statuses={pending:'待領獎',claimed:'已領獎',forfeited:'已棄領',replaced:'已補抽'};
 return `<div class="panel"><div class="panel-title">抽獎與賽事維護</div><p class="hint">${esc(state.meta.name)}｜一般抽獎限本場已報到者；一輪遊限單淘汰第一輪實際淘汰者。僅抽獎品，不變更參賽名單。</p><button class="btn btn-ghost" data-action="ops-load" ${o.busy?'disabled':''}>${o.busy?'處理中…':'載入／重新整理'}</button>${o.error?`<p class="auth-error">${esc(o.error)}</p>`:''}
 ${o.data?`<p class="hint">呆滯賽事自動關閉：${o.data.enabled?'已啟用':'未啟用'}。連續 24 小時無操作才符合條件，實際於後端巡查時關閉；首次觀察與重新啟用均保留 24 小時。</p>${isSuperAdmin()?`<button class="btn btn-ghost" data-action="ops-toggle" ${o.busy?'disabled':''}>${o.data.enabled?'停用':'啟用'}呆滯偵測（全站）</button>`:''}`:'<p class="hint">請先載入設定。若服務尚未更新，會顯示錯誤並保留其他賽事功能。</p>'}</div>
 <div class="panel"><div class="panel-title">系統診斷</div><p class="hint">低頻維護工具集中於此。正常操作時只需看頁首 BXH LIVE LINK；若遇到同步異常，再使用下方測試。</p><div class="btn-row"><button class="btn btn-ghost" data-action="cloud-test-connection" ${cloudTestBusy?'disabled':''}>${cloudTestBusy?'測試中……':'測試雲端連線'}</button>${cloudStatus==="error"?'<button class="btn btn-ghost" data-action="cloud-retry-connect">重試連線</button>':''}</div></div>
 <div class="panel"><div class="panel-title">獎品抽獎</div><p class="hint">可一次新增多個獎品品項；每個品項可設定自己的中獎人數。同一次抽獎不重複得獎。</p>${renderOperationsPrizeDrafts(d,locked||!!pending)}<div class="grid grid-2"><div class="field"><label for="ops-mode">抽獎資格</label><select id="ops-mode" ${locked||pending?'disabled':''}><option value="general" ${d.mode==='general'?'selected':''}>一般抽獎：本場已報到</option><option value="first_round" ${d.mode==='first_round'?'selected':''}>一輪遊：單淘汰第一輪淘汰</option></select></div><label><input id="ops-exclude" type="checkbox" ${d.excludePrevious?'checked':''} ${locked||pending?'disabled':''}>排除本場已中獎者</label></div><div class="btn-row"><button class="btn btn-ghost" data-action="ops-preview" ${locked||pending?'disabled':''}>預覽候選名單</button><button class="btn btn-primary" data-action="ops-draw" ${locked||pending||!o.preview?'disabled':''}>確認抽獎</button>${pending?`<button class="btn btn-primary" data-action="ops-retry" ${o.busy?'disabled':''}>確認／重試上次抽獎</button>`:''}</div>${pending?'<p class="hint">上次抽獎尚未確認結果，請使用同一次請求確認，避免重複抽出。</p>':''}${o.preview?`<p>符合資格：${o.preview.count} 人｜本次設定共抽 ${operationsPrizeTotal(d)} 人</p><details><summary>查看候選名單</summary><p>${o.preview.candidates.map(x=>esc(x.name)).join('、')||'無'}</p></details>`:''}</div>
 ${(o.data?.raffles||[]).map(r=>renderTournamentRaffleRecord(r,modes,statuses,locked)).join('')}
 ${o.data?`<div class="panel"><details><summary>操作紀錄（最近 30 筆）</summary>${o.data.logs.map(x=>`<p class="hint">${esc(operationsDate(x.at))}｜${esc(({'system-close':'系統關閉',restore:'恢復賽事','raffle-draw':'抽獎','raffle-winner':'領獎／棄領／補抽'})[x.type]||x.type)}｜${esc(x.reason||x.title||'')}</p>`).join('')||'<p>尚無操作紀錄</p>'}</details></div>`:''}`;
}
function operationsError(e){const msg=String(e?.message||'');const messages={'first-round-not-complete':'第一輪尚未全部完成，暫時不能抽一輪遊獎項。','first-round-single-only':'一輪遊目前僅支援單淘汰賽。','not-enough-candidates':'符合資格人數不足，請調整人數或資格。','invalid-winner-count':'中獎人數請填 1～100 的整數。','invalid-prizes':'請確認每個獎品品項都有名稱，且中獎人數為 1～100。','too-many-winners':'同一次抽獎合計最多 100 位得獎者。','system-closed':'此賽事已由系統關閉，需由最高管理員恢復。','tournament-access-denied':'目前帳號沒有管理此場賽事的權限。','super-admin-required':'只有最高管理員可以操作。','winner-already-handled':'此人已完成領獎或棄領處理，請重新整理。','candidate-list-changed':'候選名單已改變，請重新預覽後抽獎。','pending-storage-unavailable':'此瀏覽器無法保存抽獎請求，請更換瀏覽器後再試。'};for(const [k,v]of Object.entries(messages))if(msg.includes(k))return v;return '操作未確認完成，請重新整理或重試；若服務尚未部署，請先完成 13.29.8 後端更新。';}
async function handleTournamentOperationsAction(action,target){
 if(!hasAdminAccess())return;
 const o=operationsContext();if(o.busy)return;
 const code=target.getAttribute('data-code')||state.cloudCode;if(!code){showToast('請先開啟雲端賽事',true);return;}
 const key=operationsKey(code),service=window.engagementService;let method='getTournamentOperations',payload={code};
 try{
  if(action==='ops-toggle'){if(!isSuperAdmin()||!o.data)return;if(!confirm((o.data.enabled?'停用':'啟用')+'全站呆滯偵測？啟用後首次觀察保留 24 小時，僅最高管理員可恢復系統關閉的賽事。'))return;method='setTournamentOperations';payload={enabled:!o.data.enabled};}
  else if(action==='ops-restore'){if(!isSuperAdmin())return;const reason=prompt('請填寫恢復賽事原因（至少兩字）');if(!reason||reason.trim().length<2)return;method='restoreIdleTournament';payload={code,reason};}
  else if(action==='ops-prize-add'){if(readOperationsPending(code)||o.data?.systemClosed)return;const prizes=operationsDraftPrizes(o.draft);if(prizes.length>=20){showToast('單次抽獎最多 20 個品項',true);return;}prizes.push(tournamentOpsDefaultPrize());render();return;}
  else if(action==='ops-prize-remove'){if(readOperationsPending(code)||o.data?.systemClosed)return;const prizes=operationsDraftPrizes(o.draft),i=Number(target.getAttribute('data-index'));if(prizes.length<=1||!Number.isInteger(i)||!prizes[i])return;prizes.splice(i,1);render();return;}
  else if(action==='ops-prize-inc'||action==='ops-prize-dec'){if(readOperationsPending(code)||o.data?.systemClosed)return;const prizes=operationsDraftPrizes(o.draft),i=Number(target.getAttribute('data-index'));if(!Number.isInteger(i)||!prizes[i])return;const current=Math.max(1,Math.min(100,Number(prizes[i].quantity)||1)),delta=action==='ops-prize-inc'?1:-1;prizes[i].quantity=Math.max(1,Math.min(100,current+delta));render();return;}
  else if(action==='ops-preview'){method='previewTournamentRaffle';payload={code,mode:o.draft.mode,excludePrevious:o.draft.excludePrevious};}
  else if(action==='ops-draw'||action==='ops-retry'){
   method='drawTournamentRaffle';payload=readOperationsPending(code);
   if(!payload){if(action==='ops-retry')return;const prizes=operationsDraftPrizes(o.draft).map(p=>({name:String(p.name||'').trim(),description:String(p.description||'').trim(),quantity:Number(p.quantity)})),total=prizes.reduce((sum,p)=>sum+(Number.isInteger(p.quantity)?p.quantity:0),0);if(!o.preview||prizes.some(p=>!p.name||!Number.isInteger(p.quantity)||p.quantity<1||p.quantity>100)){showToast('請完成所有獎品品項並預覽候選名單',true);return;}if(total>100){showToast('同一次抽獎合計最多 100 位得獎者',true);return;}if(total>o.preview.count){showToast(`符合資格只有 ${o.preview.count} 人，本次共設定 ${total} 位得獎者`,true);return;}const summary=prizes.map((p,i)=>`${i+1}. ${p.name} × ${p.quantity}`).join('\n');if(!confirm(`從 ${o.preview.count} 人中抽 ${prizes.length} 個品項，共 ${total} 位得獎者？\n\n${summary}`))return;payload={code,mode:o.draft.mode,excludePrevious:o.draft.excludePrevious,prizes,operationId:crypto.randomUUID(),candidateHash:o.preview.candidateHash};try{sessionStorage.setItem(operationsPendingKey(code),JSON.stringify(payload));}catch(e){throw Error('pending-storage-unavailable');}}
  }else if(['ops-claim','ops-forfeit','ops-replace'].includes(action)){
   const a=action.slice(4),reason=a==='claim'?'':prompt(a==='forfeit'?'請填寫棄領原因':'請填寫補抽原因');if(a!=='claim'&&(!reason||reason.trim().length<2))return;if(a==='claim'&&!confirm('確認此玩家已領取獎品？'))return;
   method='updateTournamentRaffleWinner';payload={code,raffleId:target.getAttribute('data-raffle'),winnerKey:target.getAttribute('data-winner'),action:a,reason,operationId:crypto.randomUUID()};
  }
  o.busy=true;o.error='';render();if(!service?.tournamentOperation)throw Error('service-unavailable');
  const result=await service.tournamentOperation(method,payload);if(key!==operationsKey(code))return;if(!result?.ok)throw Error('operation-failed');
  if(method==='previewTournamentRaffle'){o.preview=result;return;}
  if(method==='drawTournamentRaffle'){sessionStorage.removeItem(operationsPendingKey(code));o.preview=null;}
  if(method==='restoreIdleTournament'){const fresh=await window.cloudSync.joinRoom(code);if(key!==operationsKey(code))return;if(fresh?.ok){if(state.cloudCode===code)applyRemoteState(fresh.data,true);if(viewingRecordData?.cloudCode===code)viewingRecordData=fresh.data;}showToast('賽事已恢復，重新起算 24 小時。');}
  o.data=method==='getTournamentOperations'?result:await service.tournamentOperation('getTournamentOperations',{code});
  const pending=readOperationsPending(code);if(pending&&o.data.raffles?.some(r=>r.id===pending.operationId))sessionStorage.removeItem(operationsPendingKey(code));
 }catch(e){if(key===operationsKey(code)){o.error=operationsError(e);if(String(e?.message||'').includes('candidate-list-changed')){sessionStorage.removeItem(operationsPendingKey(code));o.preview=null;}}}
 finally{if(key===operationsKey(code)){o.busy=false;render();}}
}
document.addEventListener('input',event=>{
 const prizeIndex=event.target.getAttribute?.('data-ops-prize'),prizeKey=event.target.getAttribute?.('data-ops-prize-key'),o=operationsContext();
 if(prizeIndex!==null&&prizeIndex!==undefined&&prizeKey){
  const prizes=operationsDraftPrizes(o.draft),i=Number(prizeIndex);if(!Number.isInteger(i)||!prizes[i]||!['name','description','quantity'].includes(prizeKey))return;
  prizes[i][prizeKey]=prizeKey==='quantity'?Math.max(1,Math.min(100,Number(event.target.value)||1)):event.target.value;
  return;
 }
 const name=event.target.id;if(!['ops-mode','ops-exclude'].includes(name))return;
 o.draft[name==='ops-mode'?'mode':'excludePrevious']=name==='ops-exclude'?event.target.checked:event.target.value;
 o.preview=null;const b=document.querySelector('[data-action="ops-draw"]');if(b)b.disabled=true;
});

/* ==== actions ==== */
let headerRefreshBusy=false;
function refreshLatestFromHeaderLogo(target){
  if(headerRefreshBusy)return;
  if(typeof registrationFormDraftDirty!=="undefined"&&registrationFormDraftDirty){
    showToast("目前有尚未儲存的報名設定，請先儲存後再重新整理",true);
    return;
  }
  headerRefreshBusy=true;
  try{
    if(target&&target.classList)target.classList.add("is-refreshing");
    showToast("正在讀取最新資訊…");
    sessionStorage.setItem("bxh_header_refresh_at",String(Date.now()));
  }catch(e){}
  setTimeout(()=>{
    try{
      const u=new URL(location.href);
      u.searchParams.set("bxh_refresh",String(Date.now()));
      location.replace(u.toString());
    }catch(e){
      location.reload();
    }
  },180);
}

function handleAction(action, target){
  if(action==="header-refresh"){refreshLatestFromHeaderLogo(target);return;}
  if(action==="venue-navigation-open"){openVenueNavigation(publicVenueFromTournament(tournamentDetailData));return;}
  if(action==='family-open'){openFamilyPlayers();return;}
  if(action.startsWith("court-call-")){handleCourtCall(action,target);return;}
  if(action.startsWith("raffle-")){handleRaffle(action,target);return;}
  if(action.startsWith("mailbox-")){handleMailbox(action,target);return;}
  if(action.startsWith("inventory-")){handleInventory(action,target);return;}
  if(action.startsWith("mood-")){handleMood(action,target);return;}
  if(action.startsWith("title-recipient-")){handleTitleRecipient(action,target);return;}
  if(action.startsWith('entry-')){handleEntrySelection(action);return;}
  if(state.entrySelection?.status==='drawn'&&['import-roster-from-registrations','update-players','quick-add-players','load-test','random-test-roster','load-online-roster'].includes(action)){showToast('名額已抽定，請使用依序遞補；不能覆寫正式名單',true);return;}
  if(action.startsWith('card-')){handlePlayerCard(action,target);return;}
  if(action==='title-management-tab'){switchTitleManagementTab(target.getAttribute('data-tab'));return;}
  if(action.startsWith('title-list-')){
    if(!isSuperAdmin())return;
    if(action==='title-list-search'){adminTitleListContext().query=(document.getElementById('title-list-query')?.value||'').trim();render();return;}
    if(action==='title-list-grant'){
      if(engagementActionBusy||titleEditorContext().busy)return;
      const t=engagementAdminOverview?.definitions?.find(t=>t.id===target.getAttribute('data-title-id'));
      if(!t||!t.isActive||t.isArchived){showToast('此稱號目前無法冊封',true);return;}
      titleRecipientContext().titleId=t.id;switchTitleManagementTab('grant');return;
    }
    if(action==='title-list-sort'){
      const sort=target.getAttribute('data-sort');
      if(['date-desc','date-asc','rarity-desc','rarity-asc','name'].includes(sort)){
        adminTitleListContext().sort=sort;render();
        document.querySelector('.title-sort-picker > summary')?.focus({preventScroll:true});
      }
      return;
    }
    if(action==='title-list-refresh'){reloadAdminTitleList();return;}
    if(action==='title-list-filter'){adminTitleListContext().filter=target.getAttribute('data-filter');render();return;}
    if(action==='title-list-edit'){
      const c=titleEditorContext();if(c.busy)return;
      const t=engagementAdminOverview?.definitions?.find(t=>t.id===target.getAttribute('data-title-id'));if(!t)return;
      titleManagementContext().creating=false;c.inlineId=t.id;c.draft={...t,titleId:t.id,create:false,expectedVersion:t.version||1};c.message='';render();
      return;
    }
  }
  if(action.startsWith('title-editor-')||action.startsWith('title-pioneer-')){handleTitleEditor(action);return;}

  if(action.startsWith("account-batch-")){handleAccountBatch(action,target);return;}
  const id = target.getAttribute("data-id");
  if(id&&activeTab==="referee"&&["score","undo-score","rematch","confirm-result","correct-previous-score","retract-previous-match","open-quick-confirm","pause-match-status","resume-match-status","skip-match","court-swap-start"].includes(action)){
    state.currentMatchId=id;rememberRefereeWorkstation();
  }
  if(action.startsWith("ops-")){handleTournamentOperationsAction(action,target);return;}
  // Tester accounts may operate their own TEST sandbox and their own player-
// hosted general room. The latter is still a general/community room, so it
// must pass through the community-owner allowlist instead of being rejected
// by the tester sandbox guard before the action handler runs.
const testerCanOperateAction=isOwnTestTournament()||(isCommunityRoomOwner()&&COMMUNITY_OWNER_ACTIONS.has(action));
if(isTester() && ADMIN_ONLY_ACTIONS.has(action) && !testerCanOperateAction && !TESTER_CREATION_ACTIONS.has(action)){
    showToast("封測帳號只能操作自己建立並標示（測試）的賽事。", true);
    return;
  }
  if(isTester() && action==="set-ladder-mode" && target.getAttribute("data-mode")==="ranked" && !isOwnTestTournament() && !isCommunityRoomOwner()){
    showToast("封測帳號只能在自己的測試賽事啟用測試天梯。", true);
    return;
  }
  const profileCanOperateLive = hasPrivilegedTournamentProfile() && !isCommunityRoom() && TOURNAMENT_LIVE_OPERATOR_ACTIONS.has(action);
  if(ADMIN_ONLY_ACTIONS.has(action) && !hasAdminAccess() && !profileCanOperateLive && !(isCommunityRoomOwner() && COMMUNITY_OWNER_ACTIONS.has(action))){
    showToast("目前身分沒有此操作權限。", true);
    return;
  }
  if(SUPER_ADMIN_ONLY_ACTIONS.has(action) && !isSuperAdmin()){
    showToast("只有最高管理員可以管理其他後台帳號。", true);
    return;
  }
  const aiCreateTierAllowed = ADMIN_TIER_ONLY_ACTIONS.has(action) && action.startsWith("ai-create-") && aiCreateBetaActorAllowed();
  if(ADMIN_TIER_ONLY_ACTIONS.has(action) && !isAdminTierOrAbove() && !aiCreateTierAllowed && !(isOwnTestTournament() && TESTER_TIER_ACTIONS.has(action)) && !(isCommunityRoomOwner() && COMMUNITY_OWNER_TIER_ACTIONS.has(action))){
    showToast("目前身分沒有此操作權限。", true);
    return;
  }
  if(action==="event-template-refresh"){
    loadBxhEventTemplate(true);
    return;
  }
  if(action==="event-template-toggle"){
    const enabled=!!target.checked;
    (async()=>{
      let template=bxhEventTemplateContext().template;
      if(enabled && !template) template=await loadBxhEventTemplate(false);
      if(enabled && !template){
        showToast("公版尚未載入，暫時無法套用。",true);
        render();
        return;
      }
      applyBxhTemplateSnapshotToRoom(enabled,template);
      const ok=await saveState();
      render();
      showToast(enabled?"已套用 BXH 賽事公版":"本場已取消套用 BXH 賽事公版");
      if(ok===false) showToast("設定已保存本機，等待雲端同步",true);
    })();
    return;
  }
  if(action==="event-template-edit"){
    const ui=bxhEventTemplateContext();
    if(!ui.template){showToast("請先載入公版",true);return;}
    ui.editing=true;render();return;
  }
  if(action==="event-template-cancel"){
    const ui=bxhEventTemplateContext();ui.editing=false;render();return;
  }
  if(action==="event-template-save"){
    const ui=bxhEventTemplateContext();
    if(ui.saving||!ui.template)return;
    const rules=(document.getElementById("event-template-rules")?.value||"").trim();
    const notices=(document.getElementById("event-template-notices")?.value||"").trim();
    const legalPositioning=(document.getElementById("event-template-legal")?.value||"").trim();
    if(!rules||!notices||!legalPositioning){showToast("公版三個區塊都必須有內容",true);return;}
    (async()=>{
      ui.saving=true;render();
      try{
        const result=await window.engagementService.eventTemplate({
          action:"update",
          name:ui.template.name||"BXH 標準賽事公版",
          expectedVersion:Number(ui.template.version||1),
          rules,notices,legalPositioning
        });
        if(!result||!result.ok||!result.template)throw new Error("save-failed");
        const previousRoomVersion=roomStandardTemplateConfig().version;
        ui.template=result.template;ui.canEdit=result.canEdit===true;ui.editing=false;
        if(roomStandardTemplateSelected() && !state.cloudCode && !(state.meta&&state.meta.publishedAt)){
          applyBxhTemplateSnapshotToRoom(true,ui.template);
          await saveRecord(state);
          showToast("新版公版已發布，並更新目前尚未發布的房間草稿");
        }else{
          showToast("新版 BXH 賽事公版已發布｜"+String(ui.template.versionLabel||""));
          if(previousRoomVersion) showToast("目前房間仍保留原本公版快照，不會自動改寫");
        }
      }catch(e){
        console.warn("[event template save]",e);
        showToast(String(e&&e.message||"").includes("version-conflict")?"公版已被其他人更新，請重新讀取後再編輯":"公版儲存失敗，請稍後再試",true);
      }finally{ui.saving=false;render();}
    })();
    return;
  }
  if(action==="ai-create-open"){
    if(!aiCreateBetaActorAllowed()){
      showToast("AI 協助建立僅開放管理員與工作人員使用。",true);
      return;
    }
    syncSettingsDraftFromDom();
    syncRegistrationDraftFromDom();
    aiCreateReleasePoster();
    aiCreateAssistantOpen=true;
    aiCreateAssistantNotice="";
    if(!String(aiCreateSourceText||"").trim()){
      aiCreateStructuredResult=null;
      aiCreateStructuredErrors=[];
    }
    render();
    setTimeout(()=>{try{document.getElementById("ai-create-source-text")?.focus({preventScroll:true});}catch(e){}},0);
    return;
  }
  if(action==="ai-create-close" || action==="ai-create-close-overlay"){
    aiCreateReleasePoster();
    aiCreateAssistantOpen=false;
    aiCreateAssistantNotice="";
    aiCreateSuggestionSelection={};
    render();
    return;
  }
  if(action==="ai-create-suggestion-toggle"){
    const id=target.getAttribute("data-suggestion-id")||"";
    if(id){aiCreateSuggestionSelection[id]=!!target.checked;render();}
    return;
  }
  if(action==="ai-create-suggestion-select-all"){
    aiCreateSuggestionList().forEach(s=>{aiCreateSuggestionSelection[s.id]=true;});
    render();return;
  }
  if(action==="ai-create-suggestion-apply"){
    const result=applySelectedAiCreateSuggestions();
    if(!result.ok){showToast("目前沒有已勾選的修正建議",true);return;}
    render();
    showToast("已套用 "+result.count+" 項 AI 修正建議；請再檢查審核閘門");
    setTimeout(()=>{try{document.getElementById("ai-create-review-panel")?.scrollIntoView({behavior:"smooth",block:"center"});}catch(e){}},0);
    return;
  }
