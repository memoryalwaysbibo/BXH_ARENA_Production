<script>
(function bxhFreshVersionGuard(){
  var CURRENT_BUILD="20260926.13";
  var CHECK_EVERY_MS=60000;
  var lastCheck=0;
  var checking=false;

  function addUpdateBanner(nextBuild){
    if(document.getElementById("bxh-update-banner")) return;
    try{
      var attemptedAt=Number(sessionStorage.getItem("bxh_update_attempt_"+String(nextBuild||""))||0);
      if(attemptedAt && Date.now()-attemptedAt<15000) return;
    }catch(e){}
    var show=function(){
      if(document.getElementById("bxh-update-banner")) return;
      var bar=document.createElement("div");
      bar.id="bxh-update-banner";
      bar.setAttribute("role","status");
      bar.style.cssText="position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:2147483647;background:#17181b;color:#f4f5f2;border:1px solid #d9b95c;border-radius:12px;padding:12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.45);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:12px";
      var msg=document.createElement("div");
      msg.innerHTML="<strong>BXH ARENA 已更新</strong><div style='font-size:12px;opacity:.78;margin-top:2px'>點一下即可載入最新版本，不需要清快取或開無痕模式。</div>";
      var btn=document.createElement("button");
      btn.type="button";
      btn.textContent="立即更新";
      btn.style.cssText="flex:0 0 auto;border:0;border-radius:9px;padding:9px 13px;background:#d9b95c;color:#111;font-weight:800";
      btn.onclick=function(){
        var targetBuild=String(nextBuild||Date.now());
        btn.disabled=true;
        btn.textContent="更新中…";
        try{ sessionStorage.setItem("bxh_update_attempt_"+targetBuild,String(Date.now())); }catch(e){}
        try{ bar.remove(); }catch(e){}
        try{
          var u=new URL(location.href);
          u.searchParams.set("bxh_build",targetBuild);
          u.searchParams.set("bxh_force",Date.now().toString());
          location.replace(u.toString());
        }catch(e){
          location.reload();
        }
      };
      bar.appendChild(msg); bar.appendChild(btn);
      document.body.appendChild(bar);
    };
    if(document.body) show(); else window.addEventListener("DOMContentLoaded",show,{once:true});
  }

  async function checkFreshVersion(force){
    var now=Date.now();
    if(checking || (!force && now-lastCheck<CHECK_EVERY_MS)) return;
    checking=true; lastCheck=now;
    try{
      var url=new URL("version.json",document.baseURI);
      url.searchParams.set("_",String(now));
      var res=await fetch(url.toString(),{cache:"no-store",credentials:"same-origin"});
      if(!res.ok) return;
      var info=await res.json();
      var next=String(info&&info.build||"");
      if(next && next!==CURRENT_BUILD) addUpdateBanner(next);
    }catch(e){
      /* Update checks are best-effort and must never block app startup. */
    }finally{
      checking=false;
    }
  }

  window.addEventListener("pageshow",function(){ checkFreshVersion(true); });
  window.addEventListener("focus",function(){ checkFreshVersion(false); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkFreshVersion(true); });
  setInterval(function(){ checkFreshVersion(false); },CHECK_EVERY_MS);
})();
</script>

(function(){
  var key="bxh.interface.theme.v1";
  var accountPrefix="bxh.interface.theme.account.v1.";
  var entranceUidKey="bxh.interface.theme.entrance.uid.v1";
  // Restricted skins normally wait for role verification. Once an eligible
  // account has explicitly chosen Directive on this device, its signed-out
  // entrance may be restored immediately as well.
  var allowed={gold:true,blue:true,red:true,green:true};
  var theme="gold";
  try{
    var saved=localStorage.getItem(key);

})();

.bracket-cols{display:flex;gap:34px;min-width:max-content;padding:8px 4px;}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:220px;}
.bracket-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:6px;letter-spacing:1px;}
.match-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.match-box:hover{border-color:var(--neon-dim);}
.match-box.done{border-color:var(--neon-dim);}
.match-box .mb-head{font-size:11px;color:var(--metal-dim);padding:5px 10px;background:var(--panel-3);display:flex;justify-content:space-between;}
.match-box .mb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;border-top:1px solid var(--border-soft);}
.match-box .mb-row.winner{color:var(--neon);font-weight:700;}
.match-box .mb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.match-box .mb-row .sc{font-family:var(--font-d);font-weight:700;}

/* ==== match status system (pending/ready/in_progress/completed/paused) ==== */
.match-box.ms-card-pending{border-color:#3a3d42;}
.match-box.ms-card-in_progress{
  border-color:#D4AF37;
  background:linear-gradient(160deg, rgba(212,175,55,0.06), var(--panel-2));
  box-shadow:0 0 0 1px rgba(212,175,55,0.25), 0 0 14px rgba(212,175,55,0.35);
  animation:ms-breathe-gold 1.8s ease-in-out infinite;
}
@keyframes ms-breathe-gold{
  0%,100%{ box-shadow:0 0 0 1px rgba(212,175,55,0.22), 0 0 10px rgba(212,175,55,0.22); border-color:#b8933f; }
  50%{ box-shadow:0 0 0 1.5px rgba(243,217,139,0.55), 0 0 22px rgba(212,175,55,0.55); border-color:#F3D98B; }
}
.match-box.ms-card-in_progress .mb-head{color:#D4AF37;}
.match-box.ms-card-in_progress .mb-row .sc{color:#F3D98B;font-size:16px;}

.match-box.ms-card-ready{
  border-color:#4CB8FF;
  background:linear-gradient(160deg, rgba(76,184,255,0.05), var(--panel-2));
  box-shadow:0 0 0 1px rgba(76,184,255,0.2), 0 0 12px rgba(76,184,255,0.3);
  animation:ms-breathe-ice 2.7s ease-in-out infinite;
}
@keyframes ms-breathe-ice{
  0%,100%{ box-shadow:0 0 0 1px rgba(76,184,255,0.18), 0 0 8px rgba(76,184,255,0.18); border-color:#3a92c9; }
  50%{ box-shadow:0 0 0 1.5px rgba(169,226,255,0.5), 0 0 18px rgba(76,184,255,0.4); border-color:#A9E2FF; }
}

.match-box.ms-card-completed{border-color:#6b6248;}
.match-box.ms-card-completed .mb-row.winner{color:#D4AF37;font-weight:700;}
.match-box.ms-card-completed .mb-row:not(.winner){opacity:0.55;}

.match-box.ms-card-paused{border-color:#8A6428;border-style:dashed;}

.match-status-bar{
  font-family:var(--font-d);font-size:11px;font-weight:600;
  padding:4px 10px;margin-top:6px;border-radius:4px;
  display:flex;align-items:center;gap:6px;
}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:currentColor;}
.match-status-bar.ms-bar-in_progress{color:#D4AF37;background:rgba(212,175,55,0.12);}
.match-status-bar.ms-bar-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.match-status-bar.ms-bar-ready{color:#4CB8FF;background:rgba(15,30,45,0.55);}
.match-status-bar.ms-bar-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}
.match-status-bar.ms-bar-completed{color:#8FAF72;background:rgba(143,175,114,0.08);}
.match-status-bar.ms-bar-pending{color:var(--metal-dim);background:rgba(255,255,255,0.03);}
.match-status-bar.ms-bar-paused{color:#c9a24d;background:rgba(138,100,40,0.12);}
@keyframes ms-dot-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

.match-status-legend{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:10px 4px 14px;font-size:12px;color:var(--metal);
}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:14px;height:14px;border-radius:3px;border:2px solid;flex-shrink:0;}
.legend-in_progress{border-color:#D4AF37;box-shadow:0 0 6px rgba(212,175,55,0.5);}
.legend-ready{border-color:#4CB8FF;box-shadow:0 0 6px rgba(76,184,255,0.4);}
.legend-completed{border-color:#6b6248;}
.legend-pending{border-color:#3a3d42;}

.match-status-controls{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;padding:8px 12px;background:var(--panel-2);border-radius:8px;border:1px solid var(--border-soft);
}
.msc-label{font-size:12.5px;color:var(--metal);display:flex;align-items:center;gap:8px;}
.msc-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ms-inline{display:inline-flex;align-items:center;gap:6px;font-weight:700;}
.ms-inline-in_progress{color:#D4AF37;}
.ms-inline-ready{color:#4CB8FF;}
.ms-inline-completed{color:#8FAF72;}
.ms-inline-pending{color:var(--metal-dim);}
.ms-inline-paused{color:#c9a24d;}
.ms-inline .ms-dot{animation-play-state:running;}
.ms-inline-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.ms-inline-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}

@media (prefers-reduced-motion: reduce){
  .match-box.ms-card-in_progress{animation:none; box-shadow:0 0 0 1.5px rgba(243,217,139,0.5), 0 0 16px rgba(212,175,55,0.4); border-color:#F3D98B;}
  .match-box.ms-card-ready{animation:none; box-shadow:0 0 0 1.5px rgba(169,226,255,0.45), 0 0 14px rgba(76,184,255,0.32); border-color:#A9E2FF;}
  .match-status-bar .ms-dot, .ms-inline .ms-dot{animation:none !important;}
}
@media (max-width:640px){
  .match-status-legend{gap:10px;font-size:11px;}
  .match-status-controls{flex-direction:column;align-items:stretch;}
}

/* ==== quick decision mode (簡易判定模式) ==== */
.qd-mode-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--gold);text-align:center;margin-top:6px;}
.qd-mode-sub{font-size:13px;color:var(--metal);text-align:center;margin-top:4px;margin-bottom:18px;}
.qd-cards{display:flex;gap:16px;}
.qd-card{
  flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 18px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);
}
.qd-icon{width:44px;height:44px;color:var(--gold-dim);margin-bottom:10px;}
.qd-icon svg{width:100%;height:100%;}
.qd-name{font-family:var(--font-d);font-weight:700;font-size:22px;color:var(--white);word-break:break-word;}
.qd-meta{font-size:12.5px;color:var(--metal);margin-top:6px;margin-bottom:18px;}
.qd-choose-btn{
  width:100%;min-height:56px;border-radius:8px;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,var(--champagne-gold),var(--imperial-gold));color:#141208;
  font-family:var(--font-d);font-weight:700;font-size:15px;
}
.qd-choose-btn:disabled{opacity:0.4;background:var(--panel-3);color:var(--metal-dim);border-color:var(--border);}
.qd-win-tag{color:#D4AF37;font-weight:700;}
.qd-tag{
  display:inline-block;margin-left:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;
  background:rgba(212,175,55,0.15);color:#D4AF37;letter-spacing:0.5px;vertical-align:middle;
}
@media (max-width:640px){
  .qd-cards{flex-direction:column;}
}

.scoring-mode-cards{display:flex;gap:12px;margin-top:10px;}
.scoring-mode-card{
  flex:1;text-align:left;padding:14px 16px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--border);cursor:pointer;
}
.scoring-mode-card.active{border-color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.1), var(--panel-2));}
.scoring-mode-card:disabled{opacity:0.5;cursor:not-allowed;}
.smc-title{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}
.scoring-mode-card.active .smc-title{color:var(--gold);}
.smc-desc{font-size:12px;color:var(--metal);margin-top:4px;}
@media (max-width:640px){
  .scoring-mode-cards{flex-direction:column;}
}

/* ==== v14.0.65 referee scoring mode compact toggle ==== */
.referee-scoring-compact{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;}
.referee-scoring-compact .rsc-label{font-family:var(--font-d);font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.4px;white-space:nowrap;}
.rsc-toggle{display:grid;grid-template-columns:1fr 1fr;width:150px;padding:3px;border:1px solid rgba(217,185,92,.32);border-radius:11px;background:rgba(6,7,8,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);}
.rsc-option{min-height:34px;padding:6px 12px;border:0;border-radius:8px;background:transparent;color:var(--metal);font-family:var(--font-d);font-size:13px;font-weight:800;letter-spacing:.5px;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
.rsc-option.active{color:#171307;background:linear-gradient(180deg,#f3d878,#c89c2b);box-shadow:0 4px 14px rgba(217,185,92,.2),inset 0 1px 0 rgba(255,255,255,.45);}
.rsc-option:disabled{opacity:.45;cursor:not-allowed;}
@media (max-width:420px){
  .referee-scoring-settings{padding:10px 12px;}
  .referee-scoring-compact .rsc-label{font-size:15px;}
  .rsc-toggle{width:136px;}
  .rsc-option{padding:6px 8px;font-size:12px;}
}

/* ==== v14.0.66 bracket completed-match long press correction ==== */
.board-shell .match-box.long-press-correctable{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.board-shell .match-box.long-press-armed{
  outline:2px solid rgba(243,216,120,.78);
  outline-offset:2px;
  filter:brightness(1.1);
}
.round-scoring-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.round-scoring-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border-radius:8px;}
.rsr-label{font-size:13px;color:var(--white);min-width:80px;font-weight:600;}

/* ==== bracket view mode toggle + board (kiosk) mode ==== */
.bracket-view-toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin:0 0 14px;padding:3px;border:1px solid rgba(217,185,92,.24);border-radius:12px;background:rgba(8,9,10,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);}
.bvt-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 14px;border:0;border-radius:9px;background:transparent;color:var(--metal);font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:.35px;cursor:pointer;transition:color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease;}
.bvt-btn svg{width:17px;height:17px;flex:0 0 auto;}
.bvt-btn:hover{color:var(--white);background:rgba(255,255,255,.035);}
.bvt-btn.active{color:#171307;background:linear-gradient(180deg,#f3d878,#c89c2b);box-shadow:0 5px 18px rgba(217,185,92,.22),inset 0 1px 0 rgba(255,255,255,.48);}
.bvt-btn:active{transform:translateY(1px);}
.single-bracket-layout-toggle{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;}
.single-bracket-layout-toggle .btn.active{border-color:var(--gold);color:var(--gold);background:rgba(217,185,92,0.1);}
.match-box.bye-placeholder{visibility:hidden;pointer-events:none;}
.compact-bracket{display:flex;flex-direction:column;gap:18px;}
.compact-round{border:1px solid var(--border);border-radius:12px;background:rgba(15,15,16,0.78);overflow:hidden;}
.compact-round-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--panel-3);border-bottom:1px solid var(--border);}
.compact-round-title{font-family:var(--font-d);font-weight:700;color:var(--gold);font-size:14px;letter-spacing:.5px;}
.compact-round-count{font-size:11px;color:var(--metal-dim);white-space:nowrap;}
.compact-round-matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px;}
.compact-round .match-box{min-width:0;}
@media (max-width:640px){
  .bracket-view-toggle{position:sticky;top:calc(var(--sticky-header-h, 0px) + 6px);z-index:12;margin-bottom:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .bvt-btn{min-height:42px;padding:8px 6px;font-size:12px;}
  .single-bracket-layout-toggle{display:grid;grid-template-columns:1fr 1fr;}
  .single-bracket-layout-toggle .btn{width:100%;}
  .compact-bracket{gap:12px;}
  .compact-round-matches{grid-template-columns:1fr;padding:9px;}
  .compact-round-head{padding:10px 12px;position:sticky;top:0;z-index:2;}
}

.board-shell{
  --board-accent: #d9b95c;
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg, #0d0e0a 0%, #08090a 55%, #030303 100%);
  border:1px solid var(--board-accent);padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.4);
}
.board-shell[data-board-theme="gold"]{ --board-accent:#d9b95c; }
.board-shell[data-board-theme="cyan"]{ --board-accent:#2ee6d6; }
.board-shell[data-board-theme="violet"]{ --board-accent:#b48cff; }
.board-shell[data-board-theme="amber"]{ --board-accent:#f0a94e; }
.board-shell[data-board-theme="red"]{ --board-accent:#ef5b5b; }
.board-shell[data-board-theme="rose"]{ --board-accent:#f082b0; }
.board-shell[data-board-theme="ice"]{ --board-accent:#5fc4ff; }
.board-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:0;}
.board-wm img{width:55%;max-width:520px;opacity:0.05;}
.board-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--board-accent);margin-bottom:14px;}
.board-header-left{display:flex;align-items:center;gap:12px;}
.board-logo{height:44px;width:auto;}
.board-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--board-accent);letter-spacing:1px;}
.board-sub{font-size:12px;color:var(--metal);margin-top:2px;}
.board-status-chip{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;}
.board-status-chip.status-waiting{color:var(--metal);background:rgba(255,255,255,0.05);}
.board-status-chip.status-live{color:var(--danger);background:rgba(255,59,59,0.12);}
.board-status-chip.status-done{color:#8FAF72;background:rgba(143,175,114,0.12);}

.board-toolbar{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;}
.board-toolbar .btn{color:var(--white);}
.board-toolbar .btn:hover{border-color:var(--board-accent);}
.board-zoom-group{display:flex;align-items:center;gap:6px;padding:2px 4px;border:1px solid var(--border);border-radius:8px;}
.board-zoom-group .btn{padding:4px 8px;min-height:0;}
.board-zoom-pct{font-family:var(--font-d);font-weight:700;font-size:12.5px;color:var(--board-accent);min-width:42px;text-align:center;}
.board-theme-select{background:var(--panel-2);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;}

.board-viewport{
  position:relative;z-index:1;overflow:hidden;border-radius:10px;
  background:rgba(0,0,0,0.25);border:1px solid var(--border-soft);
  height:min(70vh,760px);cursor:grab;touch-action:none;
}
.board-canvas{
  transform-origin:0 0;padding:24px;width:max-content;min-width:100%;
  transition:transform .05s linear;
}
.board-champion-area{
  margin-top:26px;padding:22px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg, rgba(217,185,92,0.08), rgba(0,0,0,0.2));

}

.board-champion-name{font-family:var(--font-d);font-weight:700;font-size:22px;margin-top:6px;
  background:linear-gradient(180deg,#FFF0A6,var(--board-accent));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.board-champion-name.pending{color:var(--metal-dim);background:none;-webkit-background-clip:initial;}

.board-footer{position:relative;z-index:1;display:flex;justify-content:flex-end;margin-top:10px;}
.board-code{font-family:var(--font-d);font-size:11px;color:var(--metal-dim);letter-spacing:1px;}

.board-canvas .se-bronze-col .match-box,
.board-canvas .bracket-col.se-bronze-col{border-color:#B87333;}
.board-canvas .se-bronze-col .bracket-col-title{color:#B87333;}

.se-stage-tag{display:none;}

.board-canvas .se-finals-champion-card .board-champion-name{font-size:18px;margin-top:4px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.board-export-freeze .match-box.ms-card-in_progress,

  .board-header{flex-direction:column;align-items:flex-start;gap:10px;}

.board-shell.board-expanded,.board-shell:fullscreen{position:fixed;inset:0;z-index:1900;width:100%;height:100vh;height:100dvh;box-sizing:border-box;border-radius:0;display:flex;flex-direction:column;overflow:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}

/* ---------- multi-court referee grid (dynamic, never hardcoded to N) ---------- */
.court-grid{display:grid;gap:18px;}
.court-grid > .court-card + .court-card{margin-top:0;}
.court-grid-1{grid-template-columns:minmax(0,760px);justify-content:center;}
.court-grid-2,.court-grid-many{grid-template-columns:repeat(2,minmax(0,1fr));}
/* Multiple referee windows are always ordered left→right, then top→bottom: 1 2 / 3 4 / 5 6 ... */
.court-card{
  scroll-margin-top:70px;
  align-self:stretch;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
  border-color:var(--court-accent,var(--border));
  box-shadow:
    0 0 0 1px var(--court-glow-soft,transparent),
    0 0 24px var(--court-glow,transparent),
    inset 0 1px 0 var(--court-glow-soft,transparent);
}
.court-card::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:5px;
  background:var(--court-accent,var(--gold));
  box-shadow:0 0 18px var(--court-accent,var(--gold)),0 0 34px var(--court-glow,transparent);
  pointer-events:none;
}
.court-card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--court-glow-soft,transparent),transparent 44%);
  pointer-events:none;z-index:0;
}
.court-card > *{position:relative;z-index:1;}
.court-card-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-top:4px;}
.court-badge{
  background:var(--court-accent,var(--gold));color:#090a0b;font-family:var(--font-d);font-weight:900;
  font-size:13px;padding:4px 12px;border-radius:8px;letter-spacing:1px;flex-shrink:0;
  box-shadow:0 0 14px var(--court-glow,transparent);
}
.court-next-preview{font-size:12px;color:var(--metal-dim);margin-bottom:10px;}
.court-jump-nav{
  display:none;gap:6px;overflow-x:auto;padding:8px 4px;margin-bottom:10px;
  position:sticky;top:0;z-index:20;background:var(--bg);
}
.court-jump-btn{
  flex-shrink:0;background:var(--panel-2);border:1px solid var(--court-accent,var(--border-soft));color:var(--court-accent,var(--metal));
  padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:800;min-height:36px;
  box-shadow:0 0 10px var(--court-glow,transparent);
}

.hoc-champion-zone{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:26px;animation:hoc-rise 1s ease-out 0.6s both;}
@keyframes hoc-rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.hoc-trophy-wrap{position:relative;width:108px;height:108px;display:flex;align-items:center;justify-content:center;animation:hoc-trophy-drop 1s cubic-bezier(.2,.9,.3,1.3) 0.9s both;}
@keyframes hoc-trophy-drop{from{opacity:0;transform:translateY(-40px) scale(0.7);}to{opacity:1;transform:translateY(0) scale(1);}}
.hoc-trophy-halo{position:absolute;inset:-30%;background:radial-gradient(circle, rgba(243,217,139,0.45) 0%, transparent 70%);animation:hoc-halo-pulse 3s ease-in-out infinite;}
@keyframes hoc-halo-pulse{0%,100%{opacity:0.55;transform:scale(1);}50%{opacity:0.85;transform:scale(1.08);}}
.hoc-trophy-svg{position:relative;width:92px;height:92px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));}
.hoc-champion-title{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:5px;color:var(--champagne-gold);margin-top:10px;}
.hoc-champion-row{display:flex;align-items:center;gap:16px;margin-top:6px;}
.hoc-laurel{width:44px;height:96px;flex-shrink:0;opacity:0.9;}
.hoc-laurel.right{transform:scaleX(-1);}
.hoc-champion-name{
  font-family:var(--font-d);font-weight:700;font-size:44px;line-height:1.15;text-align:center;max-width:440px;
  background:linear-gradient(180deg,#FFF0A6 0%,var(--imperial-gold) 55%,var(--bronze-gold) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  position:relative;
}
.hoc-champion-name::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.75) 48%, transparent 66%);
  background-size:220% 100%;background-position:120% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:hoc-shine 2.6s ease-in-out 1.6s 1;
}
@keyframes hoc-shine{0%{background-position:160% 0;}55%{background-position:-40% 0;}100%{background-position:-40% 0;}}
.hoc-champion-plate{
  margin-top:20px;padding:2px;border-radius:14px;
  background:linear-gradient(135deg,var(--champagne-gold),var(--bronze-gold));
}
.hoc-champion-plate-inner{
  background:linear-gradient(160deg, rgba(20,19,14,0.92), rgba(6,6,5,0.96));
  border-radius:12px;padding:10px 26px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 24px rgba(0,0,0,0.5);
}

.hoc-ranks-row{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:38px;width:100%;flex-wrap:wrap;animation:hoc-rise 1s ease-out 1.5s both;}
.hoc-rank-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  width:156px;padding:16px 12px 18px;border-radius:12px;
  background:linear-gradient(160deg, rgba(255,255,255,0.03), rgba(0,0,0,0.25));
  border:1px solid var(--rank-border, rgba(255,255,255,0.12));
  box-shadow:0 8px 18px rgba(0,0,0,0.35);
}
.hoc-rank-medal{width:38px;height:52px;margin-bottom:8px;}
.hoc-rank-cn{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:1.5px;color:var(--rank-color,var(--ivory));}
.hoc-rank-en{font-family:var(--font-d);font-weight:500;font-size:10px;letter-spacing:2.5px;color:var(--metal);margin-top:1px;}
.hoc-rank-name{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ivory);margin-top:8px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;}
.hoc-rank-silver{--rank-border:rgba(196,201,209,0.4);--rank-color:#D7DCE3;}
.hoc-rank-bronze{--rank-border:rgba(154,109,58,0.45);--rank-color:var(--bronze-gold);}
.hoc-rank-fourth{--rank-border:rgba(90,74,38,0.4);--rank-color:#8f8055;}

.hoc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:36px;position:relative;z-index:2;width:100%;max-width:640px;}
.hoc-btn{
  font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:0.5px;
  height:44px;padding:0 18px;border-radius:8px;flex:1 1 150px;max-width:220px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .08s, box-shadow .15s;
}
.hoc-btn:active{transform:scale(0.97);}
.hoc-btn-primary{background:linear-gradient(180deg,var(--champagne-gold),var(--imperial-gold));color:#141208;border:none;}
.hoc-btn-primary:hover{box-shadow:0 0 0 3px var(--gold-glow);}
.hoc-btn-secondary{background:rgba(7,8,8,0.5);color:var(--champagne-gold);border:1px solid var(--gold-dim);}
.hoc-btn-secondary:hover{border-color:var(--imperial-gold);}

.fw-particle{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;animation:fw-burst 1.5s ease-out forwards;box-shadow:0 0 6px currentColor;}
@keyframes fw-burst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.15);opacity:0;}}
.fw-confetti{position:absolute;width:6px;height:12px;opacity:0;animation:fw-fall 3.6s linear forwards;}
@keyframes fw-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(360px) rotate(320deg);opacity:0;}}
.fw-static{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--champagne-gold);opacity:0.5;}
@media (max-width:640px){
  .hoc-content{padding:20px 14px 0;}
  .celeb-event-name{font-size:15px;}
  .hoc-champion-name{font-size:30px;max-width:280px;}
  .hoc-laurel{width:26px;height:60px;}
  .hoc-trophy-wrap{width:80px;height:80px;}
  .hoc-trophy-svg{width:68px;height:68px;}
  .hoc-ranks-row{flex-direction:column;align-items:center;gap:12px;margin-top:26px;}
  .hoc-rank-card{width:100%;max-width:260px;flex-direction:row;text-align:left;gap:12px;padding:12px 16px;}
  .hoc-rank-medal{margin-bottom:0;}
  .hoc-actions{max-width:100%;}
  .hoc-btn{flex:1 1 45%;max-width:none;}
}
@media (prefers-reduced-motion: reduce){
  .celebration-overlay,.hoc-champion-zone,.hoc-trophy-wrap,.hoc-ranks-row,.celebration-wm{animation:none !important;}
  .hoc-champion-name::after{animation:none !important;}
  .hoc-trophy-halo{animation:none !important;}
}

/* ==== auth / landing screens ==== */
.auth-shell{
  position:fixed;inset:0;z-index:400;
  width:100%;height:100vh;height:100dvh;max-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.09) 0%, transparent 45%),
    linear-gradient(180deg, #0d0e0a 0%, var(--obsidian) 55%, #020303 100%);
  display:block;
  padding:0;
  animation:hoc-bg-fade 0.7s ease-out both;
  isolation:isolate;
}
.auth-bg-layer{
  position:absolute;inset:0;z-index:0;
  pointer-events:none;overflow:hidden;
  contain:paint;
}
.auth-beams{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0.4;
  background:conic-gradient(from 90deg at 50% 0%, transparent 0deg, rgba(212,175,55,0.05) 8deg, transparent 16deg, transparent 40deg, rgba(212,175,55,0.04) 48deg, transparent 56deg);
}
.auth-wm{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;}
.auth-wm img{width:56%;max-width:600px;height:auto;opacity:0.05;filter:saturate(0.6);}
.auth-particles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.auth-dust{position:absolute;bottom:0;width:3px;height:3px;border-radius:50%;background:var(--champagne-gold);opacity:0;animation:hoc-drift 6s linear infinite;}
.auth-scroll{
  position:relative;z-index:1;
  width:100%;height:100%;
  overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  padding:34px 16px 50px;
  box-sizing:border-box;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto;
  touch-action:pan-y;
}
.auth-content{position:relative;z-index:2;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;}
.auth-brand-header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:10px;}
.auth-logo-wrap{position:relative;width:104px;height:104px;margin-bottom:8px;}
.auth-logo-glow{position:absolute;inset:-35%;background:radial-gradient(circle, rgba(212,175,55,0.32) 0%, transparent 70%);}
.auth-logo-wrap img{position:relative;width:100%;height:100%;object-fit:contain;}
.auth-tagline{font-family:var(--font-b);font-size:14px;color:var(--champagne-gold);letter-spacing:1px;margin-top:18px;text-align:center;}
.auth-footnote{margin-top:30px;font-size:12px;color:var(--metal-dim);text-align:center;}

.role-cards{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin-top:26px;width:100%;}
.role-card{
  flex:1 1 200px;max-width:230px;min-height:250px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  padding:26px 18px 20px;border-radius:14px;
  background:linear-gradient(160deg, rgba(255,255,255,0.03), rgba(0,0,0,0.3));
  border:1px solid rgba(255,255,255,0.1);
  transition:transform .15s, border-color .15s, box-shadow .15s;
}
.role-card:hover{transform:translateY(-3px);}
.role-card:focus-visible{outline:2px solid var(--imperial-gold);outline-offset:2px;}
.role-card-icon{width:46px;height:46px;margin-bottom:6px;}
.role-card-icon svg{width:100%;height:100%;}
.role-card-cn{font-family:var(--font-d);font-weight:700;font-size:19px;color:var(--ivory);}
.role-card-en{font-family:var(--font-d);font-weight:600;font-size:11px;letter-spacing:3px;color:var(--metal);}
.role-card-desc{font-size:12.5px;color:var(--metal);line-height:1.5;margin-top:4px;flex:1;}
.role-card-enter{font-family:var(--font-d);font-weight:700;font-size:13px;opacity:0;transition:opacity .15s;margin-top:6px;}
.role-card:hover .role-card-enter{opacity:1;}
.role-card-admin{border-color:rgba(212,175,55,0.5);}
.role-card-admin .role-card-icon{color:var(--imperial-gold);}
.role-card-admin:hover{border-color:var(--imperial-gold);box-shadow:0 0 0 1px var(--imperial-gold), 0 10px 28px rgba(212,175,55,0.18);}
.role-card-admin .role-card-icon svg{filter:drop-shadow(0 0 6px rgba(212,175,55,0.5));}
.role-card-admin .role-card-enter{color:var(--imperial-gold);}
.role-card-player{border-color:rgba(243,217,139,0.35);}
.role-card-player .role-card-icon{color:var(--champagne-gold);}
.role-card-player:hover{border-color:var(--champagne-gold);box-shadow:0 0 0 1px var(--champagne-gold), 0 10px 24px rgba(243,217,139,0.12);}
.role-card-player .role-card-enter{color:var(--champagne-gold);}
.role-card-guest{border-color:rgba(150,150,150,0.35);}
.role-card-guest .role-card-icon{color:#9a9a9a;}
.role-card-guest:hover{border-color:var(--bronze-gold);box-shadow:0 0 0 1px var(--bronze-gold);}
.role-card-guest .role-card-enter{color:var(--bronze-gold);}

.account-menu{
  position:absolute;top:calc(100% + 8px);right:0;min-width:170px;z-index:60;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,0.5);
}
.account-menu button{
  display:block;width:100%;text-align:left;padding:11px 14px;background:none;border:none;
  color:var(--white);font-size:13px;border-bottom:1px solid var(--border-soft);
}
.account-menu button:last-child{border-bottom:none;}
.account-menu button:hover{background:var(--panel-2);}
.account-menu button.danger{color:var(--danger);}
.account-theme-entry{border-top:1px solid rgba(217,185,92,.14);border-bottom:1px solid rgba(217,185,92,.12);}
.account-theme-trigger{
  display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
  width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box;
  padding:13px 14px!important;background:linear-gradient(90deg,rgba(217,185,92,.035),transparent)!important;
  border-bottom:0!important;overflow:hidden;
}
.account-theme-trigger:hover{background:rgba(217,185,92,.07)!important;}
.account-theme-trigger-copy{display:flex;flex-direction:column;gap:2px;min-width:0;}
.account-theme-trigger-title{font-size:13px;font-weight:800;color:var(--ivory);letter-spacing:.2px;}
.account-theme-trigger-sub{font-size:10px;color:var(--metal-dim);letter-spacing:.5px;}
.account-theme-current{display:inline-grid;grid-template-columns:8px minmax(0,1fr) 10px;align-items:center;gap:6px;min-width:0;max-width:96px;padding:5px 0;border:0;background:transparent;}
.account-theme-current-dot{width:8px;height:8px;border-radius:50%;background:var(--theme-dot);box-shadow:0 0 10px color-mix(in srgb,var(--theme-dot) 55%,transparent);}
.account-theme-current-name{min-width:0;max-width:62px;font-size:11px;font-weight:800;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.account-theme-chevron{font-size:12px;color:var(--gold);transition:transform .18s ease;}
.account-theme-entry.open .account-theme-chevron{transform:rotate(90deg);}
.account-theme-panel{width:100%;max-width:100%;min-width:0;box-sizing:border-box;padding:10px 10px 12px;background:linear-gradient(180deg,rgba(255,255,255,.015),rgba(0,0,0,.10));overflow:hidden;}
.account-theme-panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:2px 3px 9px;}
.account-theme-panel-head strong{font-size:11px;color:var(--metal);letter-spacing:.8px;}
.account-theme-panel-head span{font-size:9px;color:var(--metal-dim);}
.account-theme-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;min-width:0;}
.account-theme-card{
  display:grid!important;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:10px 11px!important;border:1px solid rgba(255,255,255,.08)!important;border-radius:10px!important;
  background:rgba(8,9,11,.56)!important;transition:.16s ease;
}
.account-theme-card:hover{border-color:rgba(217,185,92,.28)!important;background:rgba(217,185,92,.045)!important;}
.account-theme-card.is-active{border-color:var(--gold-dim)!important;background:linear-gradient(135deg,rgba(217,185,92,.11),rgba(12,13,15,.72))!important;box-shadow:inset 0 0 0 1px rgba(217,185,92,.06),0 5px 16px rgba(0,0,0,.16);}
.account-theme-preview{position:relative;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(145deg,color-mix(in srgb,var(--theme-dot) 44%,#111),#090a0c);}
.account-theme-preview:after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--theme-dot);box-shadow:0 0 10px color-mix(in srgb,var(--theme-dot) 55%,transparent);}
.account-theme-card-copy{display:flex;flex-direction:column;min-width:0;}
.account-theme-card-copy strong{font-size:12px;color:var(--ivory);font-weight:800;line-height:1.2;}
.account-theme-card-copy small{font-size:9px;color:var(--metal-dim);margin-top:2px;letter-spacing:.6px;}
.account-theme-check{display:flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid rgba(255,255,255,.11);color:transparent;font-size:11px;}
.account-theme-card.is-active .account-theme-check{border-color:var(--gold-dim);color:var(--gold);background:rgba(217,185,92,.08);}

@media(max-width:420px){
  .account-theme-trigger{padding-left:12px!important;padding-right:12px!important;}
  .account-theme-trigger-title{font-size:12.5px;}
  .account-theme-trigger-sub{font-size:8.5px;letter-spacing:.35px;}
  .account-theme-current{max-width:88px;}
  .account-theme-current-name{max-width:54px;font-size:10.5px;}
  .account-theme-panel-head span{display:none;}
}
.mailbox-trigger{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 11px;border:1px solid var(--gold-dim);border-radius:18px;background:rgba(217,185,92,.08);color:var(--ivory);font-family:var(--font-d);font-size:12px;white-space:nowrap;}
.mailbox-trigger.active{border-color:var(--gold);color:var(--gold);background:rgba(217,185,92,.15);}
.mailbox-unread{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#b72235;color:#fff;font-size:11px;font-weight:800;box-shadow:0 0 10px rgba(183,34,53,.45);}
.mailbox-layout{display:grid;grid-template-columns:minmax(250px,360px) minmax(0,1fr);gap:14px;align-items:start;}
.mailbox-list{display:flex;flex-direction:column;gap:8px;}
.mailbox-item{width:100%;text-align:left;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2);color:var(--white);}
.mailbox-item.unread{border-color:var(--gold-dim);background:linear-gradient(135deg,rgba(217,185,92,.12),var(--panel-2));}
.mailbox-item.active{border-color:var(--gold);}
.mailbox-item-title{font-weight:700;color:var(--ivory);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mailbox-item-meta{margin-top:5px;font-size:11px;color:var(--metal);display:flex;justify-content:space-between;gap:8px;}
.mailbox-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;color:var(--ivory);}
.catalog-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.catalog-tabs .btn{min-width:0;padding:10px 4px}.catalog-list{display:grid;gap:8px;margin:12px 0}.catalog-item{margin:0!important;padding:12px!important;min-width:0;overflow-wrap:anywhere}.catalog-item-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.catalog-item-head span{color:var(--metal)}.catalog-item details{margin:8px 0}.catalog-item summary{cursor:pointer;color:var(--gold)}.catalog-item details p{margin:6px 0}.catalog-item .btn{margin-top:6px}
.inventory-grid{gap:8px}.inventory-grid>.inventory-card{margin-top:0;padding:12px}.inventory-card{display:flex;gap:10px;align-items:flex-start;min-width:0}.inventory-card>div{min-width:0;overflow-wrap:anywhere}.inventory-card h3{margin:0 0 3px;color:var(--ivory)}.inventory-card>div>p{margin:0 0 3px;line-height:1.3}.inventory-card>div>p.mailbox-body{margin-bottom:6px;line-height:1.3}.inventory-card>div>p.hint{margin-bottom:6px;line-height:1.3}.inventory-image{width:76px;height:76px;object-fit:contain;border-radius:12px;flex-shrink:0;background:rgba(217,185,92,.08)}.inventory-placeholder{display:grid;place-items:center;font-size:36px}.inventory-recipient{display:block;width:100%;white-space:normal;text-align:left;margin-top:8px}
.raffle-replay{position:fixed;inset:0;z-index:100000;background:#111520;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}.raffle-slot{font-size:clamp(28px,7vw,88px);color:var(--gold);overflow-wrap:anywhere}.raffle-replay-progress{font-size:clamp(18px,3vw,32px)}
.raffle-announcement-window{overflow:hidden;max-width:100%;padding:8px 0;border-bottom:1px solid var(--gold-dim)}
@media(max-width:720px){.inventory-grid{grid-template-columns:1fr!important}.inventory-image{width:56px;height:56px}}
@media(max-width:720px){.mailbox-layout{grid-template-columns:1fr}.mailbox-trigger .mailbox-label{display:none}.mailbox-trigger{padding:7px 9px}.mailbox-compose-grid{grid-template-columns:1fr!important}}
.role-indicator{
  background:var(--panel-2);border-bottom:1px solid var(--border);
  padding:8px 16px;font-size:12.5px;color:var(--metal);text-align:center;
}

.account-menu-caret{font-size:11px;color:var(--gold);margin-left:1px;transition:transform .15s ease;}
.account-menu-wrap{z-index:500;}
.account-menu{z-index:1200;}

@media (max-width:640px){
  /* v13.23.2：管理列在直式手機改為可換行，不再讓 logo + 品牌 + 狀態 + 帳號按鈕撐破 viewport。 */
  .stickytop{
    width:100%;
    max-width:100vw;
    min-width:0;
    overflow:visible;
  }
  header.topbar{
    width:100%;
    max-width:100vw;
    min-width:0;
    flex-wrap:wrap;
    overflow:visible;
  }
  header.topbar .logo-wrap{min-width:0;}
  header.topbar .brandtext{flex:1 1 150px;min-width:0;}
  header.topbar .spacer{display:none;}
  header.topbar .status-pill{
    order:3;
    margin-left:auto;
    max-width:100%;
  }

  /* 帳號控制獨立成第二列，任何 iPhone 直式寬度都能完整點擊。 */
  header.topbar .account-menu-wrap{
    order:4;
    flex:0 0 100%;
    width:100%;
    min-width:0;
    display:flex;
    justify-content:flex-end;
    position:relative;
    margin-top:2px;
  }
  header.topbar .account-badge{
    max-width:100%;
    min-width:0;
    padding:7px 12px;
  }
  header.topbar .account-name{
    min-width:0;
    max-width:42vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  header.topbar .account-role-label{white-space:nowrap;}
  header.topbar .account-menu{
    top:calc(100% + 6px);
    right:0;
    left:auto;
    width:min(280px, calc(100vw - 24px));
    min-width:0;
    max-width:calc(100vw - 24px);
    z-index:1200;
  }

  /* 帳號管理頁：表單改為單欄；表格只在自己的區塊橫向滑動。 */
  .account-management-main{
    width:100%;
    max-width:100vw;
    min-width:0;
    overflow-x:hidden;
    padding-left:12px;
    padding-right:12px;
  }
  .account-management-panel,
  .account-management-panel .panel{
    width:100%;
    max-width:100%;
    min-width:0;
  }
  .account-management-form-grid{
    grid-template-columns:1fr !important;
  }
  .account-management-form-grid .field,
  .account-management-form-grid input,
  .account-management-form-grid select{
    min-width:0;
    width:100%;
    max-width:100%;
  }
  .account-management-table-scroll{
    width:100%;
    max-width:100%;
    min-width:0;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .account-management-table{
    width:max-content;
    min-width:860px;
  }
  .account-management-panel .panel-title{
    align-items:center;
  }
}

@media (max-width:420px){
  header.topbar .account-name{max-width:36vw;}
  header.topbar .account-role-label{font-size:10px;}
  .account-management-main{padding-left:10px;padding-right:10px;}
  .account-management-panel{padding:14px;}
}

.account-partner-grant{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.035)}
.account-partner-grant .field{min-width:0}
/* ==== v13.28.9 compact account management ==== */
.account-management-main{width:min(1180px,100%);margin:0 auto;padding:22px 16px 80px;box-sizing:border-box;}
.account-management-panel{min-width:0;}
.account-overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;}
.account-role-filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding:12px;border:1px solid rgba(217,185,92,.16);border-radius:12px;background:rgba(255,255,255,.018);}
.account-filter-chip{appearance:none;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(8,10,13,.78);color:var(--metal);padding:8px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.16s ease;}
.account-filter-chip:hover{border-color:var(--gold-dim);color:var(--ivory);}
.account-filter-chip.active{border-color:var(--gold);background:rgba(217,178,73,.16);color:#f4d977;box-shadow:0 0 0 1px rgba(217,178,73,.08) inset;}
.account-filter-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(130px,auto)) auto;gap:8px;align-items:end;margin-top:10px;}
.account-filter-search{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px;}
.account-filter-toolbar .field{margin:0;min-width:0;}
.account-filter-toolbar input,.account-filter-toolbar select{width:100%;min-width:0;}
.account-result-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:13px 2px 7px;color:var(--metal-dim);font-size:12px;}
.account-user-list{display:grid;gap:6px;}
.account-user-card{border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(8,10,13,.76);overflow:hidden;transition:.16s ease;}
.account-user-card[open]{border-color:rgba(217,178,73,.34);background:rgba(12,13,15,.9);}
.account-user-card>summary{list-style:none;cursor:pointer;padding:9px 12px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(210px,1.25fr) auto;gap:8px 10px;align-items:center;}
.account-user-card>summary::-webkit-details-marker{display:none;}
.account-user-identity{min-width:0;}
.account-user-name{font-size:15px;font-weight:900;line-height:1.15;color:var(--ivory);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.account-user-gameid{font-size:11px;line-height:1.15;color:var(--metal-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.account-user-email{min-width:0;color:#c8ccd2;font-size:12px;line-height:1.2;overflow-wrap:anywhere;}
.account-user-badges{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-wrap:wrap;}
.account-user-badges .badge{padding:4px 8px;font-size:10.5px;line-height:1.1;white-space:nowrap;}
.account-expand-caret{color:var(--gold);font-size:12px;margin-left:2px;}
.account-user-detail{border-top:1px solid rgba(255,255,255,.07);padding:13px 14px 15px;}
.account-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
.account-detail-item{padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.025);min-width:0;}
.account-detail-item .label{font-size:10px;color:var(--metal-dim);margin-bottom:4px;}
.account-detail-item .value{font-size:12px;color:var(--ivory);overflow-wrap:anywhere;}
.account-user-controls{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.1);}
.account-user-controls .field{margin:0;min-width:190px;}
.account-active-control{display:flex;align-items:center;gap:8px;min-height:38px;color:var(--ivory);font-size:12px;}
.account-user-save-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1 1 100%;width:100%;padding-top:3px;}
.account-user-save-row .badge{flex:0 0 auto;}
.account-user-save-button{min-width:150px;margin-left:auto;}
.account-user-save-button:disabled{opacity:.44;cursor:not-allowed;filter:saturate(.35);}
.account-tools-card{margin-top:14px;border:1px solid rgba(255,255,255,.11);border-radius:13px;background:rgba(8,10,13,.7);overflow:hidden;}
.account-tools-card>summary{list-style:none;cursor:pointer;padding:13px 15px;font-weight:900;color:var(--ivory);display:flex;justify-content:space-between;align-items:center;gap:12px;}
.account-tools-card>summary::-webkit-details-marker{display:none;}
.account-tools-body{padding:14px 15px 15px;border-top:1px solid rgba(255,255,255,.07);}
@media(max-width:900px){
  .account-filter-toolbar{grid-template-columns:repeat(2,minmax(0,1fr));}
  .account-filter-search{grid-column:1/-1;}
  .account-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media(max-width:640px){
  .account-management-main{padding:12px 10px 64px;}
  .account-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .account-filter-toolbar{grid-template-columns:1fr;}
  .account-filter-search{grid-column:auto;}
  .account-filter-toolbar>.btn{width:100%;}
  .account-user-card>summary{grid-template-columns:28px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:2px 8px;padding:8px 10px;}
  .account-user-card>summary>label{grid-column:1;grid-row:1/3;align-self:start;padding-top:2px;}

  .account-user-badges{grid-column:3;grid-row:1/3;align-self:start;max-width:138px;gap:3px;}
  .account-filter-search .btn{padding-left:10px;padding-right:10px;}
  .account-detail-grid{grid-template-columns:1fr;}
  .account-user-controls{align-items:stretch;flex-direction:column;}
  .account-user-controls .field{width:100%;min-width:0;}
  .account-user-save-row{align-items:stretch;flex-direction:column;}
  .account-user-save-button{width:100%;margin-left:0;}
}

/* ---------- player center (Phase 2): tabbed shell ---------- */
.player-main{max-width:720px;margin:0 auto;padding-bottom:76px;}
.player-main,.player-main .panel,.player-profile-data-grid{min-width:0;max-width:100%;}
/* v13.23.4: phone portrait hard containment — no profile card may create horizontal page width. */
html,body,#app{max-width:100%;overflow-x:hidden;}
.player-main{box-sizing:border-box;max-width:100%;min-width:0;}
.player-main > *{max-width:100%;min-width:0;box-sizing:border-box;}
.player-main .panel{max-width:100%;min-width:0;box-sizing:border-box;overflow:hidden;}
.player-profile-data-grid{max-width:100%;min-width:0;overflow:hidden;}
.player-profile-data-grid > .stat-box{width:100%;max-width:100%;min-width:0;box-sizing:border-box;}
.player-profile-data-grid .value,.player-profile-data-grid .value.small{
  max-width:100%;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal;
}
@media (max-width:700px), (orientation:portrait) and (max-width:900px){
  .player-main{padding-left:12px;padding-right:12px;}
  .player-profile-data-grid{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) !important;
    width:100% !important;
    max-width:100% !important;
  }
  .player-profile-data-grid > .stat-box,
  .player-profile-data-grid .player-profile-wide{
    grid-column:1 / -1 !important;
    width:100% !important;
    max-width:100% !important;
  }
}

.player-profile-data-grid > *{min-width:0;}
.player-profile-data-grid .player-profile-wide{grid-column:1 / -1;}
@media (max-width:520px){
  .player-main{width:100%;overflow-x:hidden;}
  .player-main .panel{width:100%;box-sizing:border-box;}
  .player-profile-data-grid{
    width:100%;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
  .player-profile-data-grid .stat-box{padding:11px 12px;}
  .player-profile-data-grid .stat-box .value.small{font-size:16px;line-height:1.35;}
  .player-profile-data-grid .player-profile-wide{grid-column:1 / -1;}
}
@media (max-width:360px){
  .player-profile-data-grid{grid-template-columns:1fr !important;}
  .player-profile-data-grid .player-profile-wide{grid-column:auto;}
}

.profile-primary-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px;}
.profile-primary-tabs .btn{min-height:44px;border-radius:11px;}
.profile-secondary-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;margin:0 0 14px;border:1px solid rgba(217,185,92,.15);border-radius:12px;background:rgba(255,255,255,.018);}
.profile-secondary-tabs .btn{min-height:38px;border-radius:9px;font-size:12.5px;}
.profile-hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:17px 18px;text-align:left!important;border-color:rgba(217,185,92,.28);background:linear-gradient(135deg,rgba(217,185,92,.075),rgba(18,19,21,.92));}
.profile-hero-avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;border:1px solid var(--gold-dim);background:rgba(217,185,92,.07);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 0 3px rgba(217,185,92,.045);}
.profile-hero-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-hero-copy{min-width:0;}
.profile-hero-name{font-family:var(--font-d);font-size:22px;font-weight:900;color:var(--ivory);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.profile-hero-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:11px;color:var(--metal);}
.profile-hero-verified{color:var(--gold);}
.profile-hero-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.profile-info-groups{display:grid;gap:12px;}
.profile-info-group{border:1px solid rgba(255,255,255,.075);border-radius:12px;background:rgba(8,9,11,.34);overflow:hidden;}
.profile-info-group-title{padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--font-d);font-size:12px;font-weight:900;letter-spacing:.7px;color:var(--gold);}
.profile-info-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
.profile-info-row{min-width:0;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.055);}
.profile-info-row:nth-child(odd){border-right:1px solid rgba(255,255,255,.055);}
.profile-info-row:nth-last-child(-n+2){border-bottom:0;}
.profile-info-label{font-size:10.5px;color:var(--metal-dim);margin-bottom:4px;}
.profile-info-value{font-size:13px;font-weight:800;color:var(--ivory);overflow-wrap:anywhere;}
.profile-info-sub{font-size:9.5px;color:var(--metal);margin-top:3px;}
.profile-account-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
@media(max-width:520px){
  .profile-hero{grid-template-columns:68px minmax(0,1fr);gap:13px;padding:15px;}
  .profile-hero-avatar{width:68px;height:68px;}
  .profile-hero-name{font-size:20px;}
  .profile-info-list{grid-template-columns:1fr;}
  .profile-info-row,.profile-info-row:nth-child(odd){border-right:0;}
  .profile-info-row:nth-last-child(-n+2){border-bottom:1px solid rgba(255,255,255,.055);}
  .profile-info-row:last-child{border-bottom:0;}
}.player-avatar-large{width:92px;height:92px;}
.player-avatar-large img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;}

.half-hour-datetime{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.half-hour-datetime .half-hour-date{flex:1 1 180px;min-width:160px}
.half-hour-clock{display:flex;align-items:center;gap:8px}
.half-hour-clock select{min-width:78px}
.half-hour-clock .time-colon{font-weight:800;font-size:18px;opacity:.8}
@media (max-width:560px){
  .half-hour-datetime{align-items:stretch}
  .half-hour-datetime .half-hour-date{flex-basis:100%;width:100%}
  .half-hour-clock{width:100%}
  .half-hour-clock select{flex:1}
}

.test-roster-box{
  margin:0 0 18px;
  padding:14px;
  border:1px dashed var(--gold-dim);
  border-radius:var(--radius-sm);
  background:rgba(217,185,92,.045);
}
.test-roster-box .btn-row{gap:8px;flex-wrap:wrap;}

.ladder-hero{border-color:var(--gold-dim);background:linear-gradient(150deg,rgba(217,185,92,.09),var(--panel));}
.ladder-season-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px;}
.ladder-season-grid .stat-box{min-height:116px;display:flex;flex-direction:column;justify-content:center;}
.ladder-season-grid .label{font-size:13px;line-height:1.35;}
.ladder-season-grid .value{font-family:var(--font-d);font-size:27px!important;line-height:1.15;font-weight:800;letter-spacing:.2px;white-space:nowrap;}
.ladder-location-filter{border-color:rgba(217,185,92,.28);background:linear-gradient(150deg,rgba(217,185,92,.055),var(--panel));}
.ladder-location-filter .grid{gap:12px;}
.ladder-location-filter select{min-height:44px;}
.ladder-season-grid .season-status-card{position:relative;overflow:hidden;}
.ladder-season-grid .season-status-card:after{content:"";position:absolute;inset:auto -24px -34px auto;width:92px;height:92px;border-radius:50%;background:rgba(217,185,92,.08);pointer-events:none;}
.ladder-season-status-note{font-size:11px;color:var(--metal);margin-top:6px;}
.ladder-season-progress{margin-top:16px;padding:13px 14px;border:1px solid rgba(217,185,92,.18);border-radius:10px;background:rgba(0,0,0,.16);}
.ladder-season-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--metal);margin-bottom:8px;}
.ladder-season-progress-track{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.04);}
.ladder-season-progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));box-shadow:0 0 12px rgba(217,185,92,.22);}
.ladder-season-progress-foot{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:10px;color:var(--metal-dim);}
.ladder-season-state-pre .value{color:var(--ivory);}
.ladder-season-state-live .value{color:var(--gold);}
.ladder-season-state-urgent .value{color:#f0cf74;text-shadow:0 0 10px rgba(217,185,92,.18);}
.ladder-season-state-ended .value{color:var(--metal);}
@media(max-width:560px){
  .ladder-season-grid{gap:10px;}
  .ladder-season-grid .stat-box{min-height:106px;padding:14px 12px;}
  .ladder-season-grid .value{font-size:24px!important;}
  .ladder-season-progress{padding:12px;}
}
.ladder-rank-table .rank-num{min-width:64px;}
.ladder-rank-table strong{color:var(--neon);font-family:var(--font-d);}
.ladder-tier-0{color:#a9adb5;border-color:#545861;}
.ladder-tier-1{color:#d9a574;border-color:#96653c;}
.ladder-tier-2{color:#d8dde5;border-color:#9ca3ad;}
.ladder-tier-3{color:#ffd85b;border-color:#a98a1e;}
.ladder-tier-4{color:#7de5d8;border-color:#3e9188;}
.ladder-tier-5{color:#75d7ff;border-color:#3588aa;}
.ladder-tier-6{color:#d69cff;border-color:#8254a3;}
.ladder-tier-7{color:#ff6d77;border-color:#ad3038;box-shadow:0 0 10px rgba(255,109,119,.2);}

/* ==== guest lobby / public ladder ==== */
.guest-lobby-content{max-width:1040px;}
.guest-lobby-shell{width:100%;min-width:0;}
.guest-lobby-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;margin:4px 0 12px;
}
.guest-mode-label{font-size:11px;color:var(--metal-dim);letter-spacing:1px;}
.guest-tabs{
  width:100%;display:flex;gap:4px;padding:4px;
  background:rgba(20,21,23,.86);border:1px solid var(--border);border-radius:10px;
  margin-bottom:14px;
}
.guest-tab{
  flex:1;border:none;background:transparent;color:var(--metal);
  padding:10px 14px;border-radius:7px;font-family:var(--font-d);font-weight:700;font-size:14px;
  transition:.2s ease;
}
.guest-tab.active{background:rgba(217,185,92,.12);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-dim);}
.guest-tab-content{width:100%;min-width:0;}
.guest-ladder-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:18px 20px;margin-bottom:12px;
  border:1px solid var(--gold-dim);border-radius:12px;
  background:linear-gradient(135deg,rgba(217,185,92,.12),rgba(10,10,10,.72));
}
.guest-ladder-kicker{font-family:var(--font-d);font-size:11px;letter-spacing:3px;color:var(--gold-dim);}
.guest-ladder-title{font-family:var(--font-d);font-size:27px;font-weight:800;color:var(--ivory);letter-spacing:1px;}
.guest-ladder-sub{font-size:12px;color:var(--metal);margin-top:3px;}
.guest-ladder-search-wrap{position:relative;width:100%;margin-bottom:12px;}
.guest-ladder-search-wrap input{
  width:100%;height:44px;padding:0 44px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--white);
  outline:none;font-size:14px;
}
.guest-ladder-search-wrap input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(217,185,92,.08);}
.guest-search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:20px;pointer-events:none;}
.guest-search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:none;border-radius:50%;background:var(--panel-3);color:var(--metal);font-size:18px;
}
.guest-ladder-board{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:rgba(15,16,18,.88);}
.guest-ladder-columns,.guest-ladder-row{
  display:grid;grid-template-columns:76px minmax(160px,1.7fr) 110px 110px 110px 72px 72px;
  align-items:center;column-gap:8px;
}
.guest-ladder-columns{
  padding:9px 14px;background:#111214;color:var(--gold);font-size:11px;font-weight:700;border-bottom:1px solid var(--gold-dim);
}
.guest-ladder-row{
  min-height:50px;padding:8px 14px;border-bottom:1px solid var(--border-soft);
  transition:background .15s ease;
}
.guest-ladder-row:last-child{border-bottom:none;}
.guest-ladder-row:hover{background:rgba(217,185,92,.045);}
.guest-ladder-row:nth-child(-n+3){background:linear-gradient(90deg,rgba(217,185,92,.055),transparent 48%);}
.guest-rank{font-family:var(--font-d);font-weight:800;color:var(--gold);font-size:15px;}
.guest-player-name{font-weight:700;color:var(--white);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.guest-player-mobile-meta{display:none;}
.guest-pts strong{font-family:var(--font-d);color:var(--neon);font-size:17px;margin-right:3px;}
.guest-pts span,.guest-career,.guest-events,.guest-champs{font-size:12px;color:var(--metal);}
.guest-ladder-more{padding:12px;text-align:center;border-top:1px solid var(--border);}
.guest-ladder-note{font-size:11px;color:var(--metal-dim);text-align:center;margin-top:10px;line-height:1.5;}

@media (max-width:720px){
  .guest-lobby-content{max-width:100%;}
  .guest-lobby-topbar{align-items:center;}
  .guest-mode-label{font-size:9.5px;}
  .guest-ladder-head{padding:14px 15px;align-items:center;}
  .guest-ladder-title{font-size:22px;}
  .guest-ladder-columns{
    grid-template-columns:58px minmax(0,1fr) 78px;
  }
  .guest-ladder-columns > div:nth-child(3),
  .guest-ladder-columns > div:nth-child(5),
  .guest-ladder-columns > div:nth-child(6),
  .guest-ladder-columns > div:nth-child(7){display:none;}
  .guest-ladder-row{
    grid-template-columns:58px minmax(0,1fr) 78px;
    padding:9px 10px;column-gap:5px;
  }
  .guest-tier,.guest-career,.guest-events,.guest-champs{display:none;}
  .guest-player-mobile-meta{display:block;font-size:10px;color:var(--metal-dim);margin-top:2px;}
  .guest-pts{text-align:right;}
  .guest-player-name{font-size:13px;}
  .guest-rank{font-size:13px;}
}

  margin:0 0 18px;padding:0 2px;
}

.ai-create-assist-btn{
  border-color:rgba(217,185,92,.52)!important;
  background:linear-gradient(135deg,rgba(217,185,92,.12),rgba(255,255,255,.025))!important;

.title-card.rarity-limited{border-color:rgba(255,93,145,.40);background:linear-gradient(135deg,rgba(255,65,125,.09),rgba(255,255,255,.02))}
.title-card.rarity-eternal{border-color:rgba(255,240,166,.52);background:linear-gradient(135deg,rgba(255,190,52,.12),rgba(255,255,255,.045),rgba(142,96,255,.10));box-shadow:inset 0 0 18px rgba(255,244,194,.035),0 0 18px rgba(153,101,255,.05)}
.title-setting-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px;}

.mood-station{border:1px solid #766739;background:linear-gradient(120deg,#1d1b14,#141619);padding:16px;margin-bottom:16px;overflow:hidden}

.venue-navigation-address{font-size:14px;line-height:1.6;user-select:text;overflow-wrap:anywhere;}
.venue-navigation-links{display:grid;gap:8px;margin-top:14px;}
.venue-navigation-links a,.venue-navigation-links button{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);color:var(--white);font:inherit;text-decoration:none;}
.venue-navigation-note,.venue-navigation-status{font-size:12px;line-height:1.6;color:var(--metal);}

/* P7.13: scoped compact poster controls, never affect competition cards. */
.ai-poster-input{border:1px solid var(--gold-dim);border-radius:10px;padding:12px;margin-bottom:14px;min-width:0;}
.ai-poster-input input[hidden]{display:none;}
.ai-poster-pick{display:block!important;width:100%;min-height:44px;margin:10px 0;white-space:normal;}

.ai-poster-preview strong{font-size:12px;overflow-wrap:anywhere;}

.ai-poster-evidence summary{cursor:pointer;min-height:28px;}

.mode-management-context:empty{

}

  min-height:46px;

}

  padding:6px 10px!important;
  white-space:nowrap;
}
@media(max-width:640px){

.court-swap-selection-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:10px 12px;border:1px solid rgba(61,220,132,.46);border-radius:10px;background:rgba(61,220,132,.055);}

/* P7.11A — Event Info V2 compatibility layer.
   Legacy state.meta remains authoritative during this phase. Event Info V2 is
   a structured shadow model that is refreshed before persistence so upcoming
   AI/template/navigation features do not need to keep expanding meta. */
const EVENT_INFO_SCHEMA_VERSION="bxh.event-info.v2";

function emptyEventInfoV2(){
  return {
    schemaVersion:EVENT_INFO_SCHEMA_VERSION,
    basic:{name:"",date:"",organizer:""},
    schedule:{checkInStart:"",checkInEnd:"",startAt:"",endAt:""},
    venue:{name:"",address:"",googleMapsUrl:"",navigationEnabled:false,legacyText:""},
    registration:{enabled:false,openAt:null,closeAt:null,capacity:null,waitlistCapacity:0,fee:null,targetGroup:"open"},
    prizes:[],
    content:{customDescription:"",specialNotes:""},
    standardTemplate:{enabled:false,templateId:null,version:null,snapshot:null},
    source:{type:"manual",originalText:"",poster:null,parsedAt:null}
  };
}

function splitLegacyVenueText(value){
  const text=String(value||"").trim();
  if(!text) return {name:"",address:"",legacyText:""};
  const parts=text.split("｜").map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2) return {name:parts[0],address:parts.slice(1).join("｜"),legacyText:text};
  return {name:text,address:"",legacyText:text};
}

function buildLegacyVenueText(venue){
  const v=venue&&typeof venue==="object"?venue:{};
  const name=String(v.name||"").trim();
  const address=String(v.address||"").trim();
  if(name&&address) return name+"｜"+address;
  return name||address||String(v.legacyText||"").trim();
}

function normalizeGoogleMapsUrl(value){
  if(typeof value!=="string")return "";
  const raw=value.trim();
  if(!raw||raw.length>2048||/[\s\u0000-\u001f\u007f\\]/.test(raw)||/%(?:00|0a|0d)/i.test(raw))return "";
  try{
    const u=new URL(raw);
    if(u.protocol!=="https:"||u.username||u.password||u.port)return "";
    const host=u.hostname.toLowerCase();
    if(host==="maps.app.goo.gl"&&/^\/[A-Za-z0-9_-]+\/?$/.test(u.pathname))return u.href;
    if(host==="maps.google.com"&&(u.pathname==="/"||/^\/maps(?:\/|$)/.test(u.pathname)))return u.href;
    if(["www.google.com","google.com","www.google.com.tw","google.com.tw"].includes(host)&&/^\/maps(?:\/|$)/.test(u.pathname))return u.href;
  }catch(e){}
  return "";
}
function extractGoogleMapsUrlsFromText(text){
  const source=String(text||"");
  const candidates=source.match(/https:\/\/[^\s<>"']+/ig)||[];
  const urls=[];
  for(const candidate of candidates){
    let raw=candidate.replace(/[\]}>，。！？、,;；]+$/g,"");
    while(raw.endsWith(")")&&(raw.match(/\)/g)||[]).length>(raw.match(/\(/g)||[]).length)raw=raw.slice(0,-1);
    const normalized=normalizeGoogleMapsUrl(raw);
    if(normalized&&!urls.includes(normalized))urls.push(normalized);
  }
  return urls;
}
function extractGoogleMapsUrlFromText(text){
  const urls=extractGoogleMapsUrlsFromText(text);
  return urls.length===1?urls[0]:"";
}
function googleMapsNavigationUrl(venue){
  const v=venue&&typeof venue==="object"?venue:{};
  const direct=normalizeGoogleMapsUrl(v.googleMapsUrl);
  if(direct)return direct;
  const address=String(v.address||"").trim();
  if(!address)return ""; // Do not guess a branch from its name alone.
  const url="https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(address);
  return url.length<=2048?url:"";
}
function appleMapsNavigationUrl(venue){
  const address=String(venue&&venue.address||"").trim();
  if(!address)return "";
  const url="https://maps.apple.com/?daddr="+encodeURIComponent(address);
  return url.length<=2048?url:"";
}
function applyVenueDraftToState(d,st=state){
  if(!st||!d)return;
  const info=normalizeEventInfoV2(st.eventInfo);
  const explicit=Object.prototype.hasOwnProperty.call(d,"venueName")||Object.prototype.hasOwnProperty.call(d,"venueAddress");
  const legacy=explicit?{name:"",address:""}:splitLegacyVenueText(d.location);
  const venue={
    name:String(explicit?(d.venueName||""):legacy.name).trim(),
    address:String(explicit?(d.venueAddress||""):legacy.address).trim(),
    googleMapsUrl:normalizeGoogleMapsUrl(d.googleMapsUrl),
    navigationEnabled:d.navigationEnabled===true,
    legacyText:""
  };
  venue.legacyText=buildLegacyVenueText(venue);
  if(!venue.address&&!venue.googleMapsUrl)venue.navigationEnabled=false;
  info.venue=venue;
  st.eventInfo=info;
  st.meta=st.meta||{};
  st.meta.location=venue.legacyText;
}
function venueForEventState(st){
  const m=st&&st.meta||{};
  const raw=st&&st.eventInfo&&st.eventInfo.venue||{};
  const text=String(m.location||"").trim();
  const structuredText=buildLegacyVenueText({name:raw.name,address:raw.address});
  const changed=text!==structuredText;
  const legacy=splitLegacyVenueText(text);
  const v={
    name:changed?legacy.name:String(raw.name||"").trim(),
    address:changed?legacy.address:String(raw.address||"").trim(),
    googleMapsUrl:changed?"":normalizeGoogleMapsUrl(raw.googleMapsUrl),
    navigationEnabled:!changed&&raw.navigationEnabled===true,
    legacyText:text
  };
  if(!v.address&&!v.googleMapsUrl)v.navigationEnabled=false;
  return v;
}
function publicVenueFromTournament(t){
  const pd=t&&t.parsedData||{};
  const raw=pd.eventInfo&&pd.eventInfo.venue;
  const legacyText=String(t&&t.location||pd.meta&&pd.meta.location||"");
  if(raw&&typeof raw==="object"){
    const location=Object.prototype.hasOwnProperty.call(t||{},"location")?String(t.location||""):buildLegacyVenueText(raw);
    return venueForEventState({meta:{location},eventInfo:{venue:raw}});
  }
  const legacy=splitLegacyVenueText(legacyText);
  return {name:legacy.name,address:legacy.address,googleMapsUrl:"",navigationEnabled:false};
}
function renderVenueNavigationMenu(venue){
  const v=venue&&typeof venue==="object"?venue:{};
  if(v.navigationEnabled!==true||(!googleMapsNavigationUrl(v)&&!appleMapsNavigationUrl(v)))return "";
  return '<button type="button" class="venue-nav-open" data-action="venue-navigation-open" aria-haspopup="dialog" aria-label="開啟場地導航與完整地址">🧭 導航</button>';
}
async function copyVenueAddress(address,dialog,status){
  let ok=false;
  try{
    if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error("clipboard-unavailable");
    await navigator.clipboard.writeText(address);ok=true;
  }catch(e){
    const area=document.createElement("textarea");
    area.value=address;area.setAttribute("aria-label","可手動複製的地址");
    dialog.appendChild(area);area.select();
    try{ok=document.execCommand("copy")===true;}catch(ignore){}
    area.remove();
  }
  status.textContent=ok?"地址已複製":"無法自動複製，請長按上方完整地址手動複製。";
  return ok;
}
function openVenueNavigation(venue){
  const v=venue&&typeof venue==="object"?venue:{};
  if(v.navigationEnabled!==true)return;
  const google=googleMapsNavigationUrl(v),apple=appleMapsNavigationUrl(v);
  if(!google&&!apple)return;
  const prior=document.getElementById("bxh-venue-navigation-dialog");
  if(prior){if(typeof prior.close==="function"&&prior.open)prior.close();else prior.remove();}
  const opener=document.activeElement;
  const dialog=document.createElement("dialog");
  dialog.id="bxh-venue-navigation-dialog";
  dialog.className="venue-navigation-dialog";
  dialog.setAttribute("aria-labelledby","venue-navigation-title");
  const address=String(v.address||"").trim();
  dialog.innerHTML='<div class="venue-navigation-heading"><h2 id="venue-navigation-title">場地導航</h2><button type="button" data-venue-close aria-label="關閉導航">✕</button></div>'+
    '<strong class="venue-navigation-name">'+esc(v.name||"活動地點")+'</strong>'+
    (address?'<p class="venue-navigation-address">'+esc(address)+'</p>':'<p class="venue-navigation-note">未提供地址；僅開啟主辦提供的 Google Maps 連結。</p>')+
    '<div class="venue-navigation-links">'+
    (google?'<a href="'+esc(google)+'" target="_blank" rel="noopener noreferrer">Google Maps</a>':'')+
    (apple?'<a href="'+esc(apple)+'" target="_blank" rel="noopener noreferrer">Apple 地圖</a>':'')+
    (address?'<button type="button" data-venue-copy>複製地址</button>':'')+'</div>'+
    '<p class="venue-navigation-note">Google 優先使用主辦提供的地圖連結；Apple 依地址查詢。請在地圖確認目的地後開始導航。</p>'+
    '<p class="venue-navigation-status" role="status" aria-live="polite"></p>';
  document.body.appendChild(dialog);
  const close=()=>{if(typeof dialog.close==="function"&&dialog.open)dialog.close();else{dialog.remove();if(opener&&opener.isConnected)opener.focus();}};
  dialog.querySelector('[data-venue-close]').addEventListener('click',close);
  dialog.addEventListener('close',()=>{dialog.remove();if(opener&&opener.isConnected)opener.focus();},{once:true});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)close();}});
  dialog.querySelector('[data-venue-copy]')?.addEventListener('click',()=>copyVenueAddress(address,dialog,dialog.querySelector('[role="status"]')));
  if(typeof dialog.showModal==="function")dialog.showModal();
  else{dialog.setAttribute('open','');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');dialog.classList.add('venue-navigation-fallback');}
  dialog.querySelector('[data-venue-close]').focus();
}

function normalizeEventInfoV2(raw){
  const base=emptyEventInfoV2();
  const input=raw&&typeof raw==="object"?raw:{};
  const section=(key)=>input[key]&&typeof input[key]==="object"?input[key]:{};
  return {
    schemaVersion:EVENT_INFO_SCHEMA_VERSION,
    basic:Object.assign({},base.basic,section("basic")),
    schedule:Object.assign({},base.schedule,section("schedule")),
    venue:Object.assign({},base.venue,section("venue")),
    registration:Object.assign({},base.registration,section("registration")),
    prizes:Array.isArray(input.prizes)?input.prizes.slice():[],
    content:Object.assign({},base.content,section("content")),
    standardTemplate:Object.assign({},base.standardTemplate,section("standardTemplate")),
    source:Object.assign({},base.source,section("source"))
  };
}

function syncEventInfoV2FromLegacy(st){
  if(!st||typeof st!=="object") return emptyEventInfoV2();
  const m=st.meta&&typeof st.meta==="object"?st.meta:{};
  const info=normalizeEventInfoV2(st.eventInfo);
  const venue=venueForEventState(st);
  info.basic.name=String(m.name||"");
  info.basic.date=String(m.date||"");
  info.schedule.checkInStart=String(m.checkin||"");
  info.schedule.startAt=String(m.startTime||"");
  info.venue=venue;
  info.registration.enabled=!!m.registrationEnabled;
  info.registration.openAt=m.registrationOpenAt||null;
  info.registration.closeAt=m.registrationCloseAt||null;
  info.registration.capacity=m.registrationCapacity==null?null:Number(m.registrationCapacity);
  info.registration.waitlistCapacity=Math.max(0,Number(m.waitlistCapacity)||0);
  info.registration.fee=m.registrationFee==null?null:Number(m.registrationFee);
  info.registration.targetGroup=(m.targetGroup==="children")?"children":"open";
  info.content.customDescription=String(m.eventDescription||"");
  st.eventInfo=info;
  return info;
}

/* Future-facing adapter: Event Info V2 can be applied back to legacy meta only
   when an explicit workflow (AI review/template editor/etc.) chooses to do so.
   P7.11A does NOT call this automatically. */
function applyEventInfoV2ToLegacy(st){
  if(!st||typeof st!=="object") return st;
  if(!st.meta||typeof st.meta!=="object") st.meta={};
  const info=normalizeEventInfoV2(st.eventInfo);
  const m=st.meta;
  m.name=String(info.basic.name||m.name||"");
  m.date=String(info.basic.date||m.date||"");
  const location=buildLegacyVenueText(info.venue);
  if(location) m.location=location;
  m.checkin=String(info.schedule.checkInStart||m.checkin||"");
  m.startTime=String(info.schedule.startAt||m.startTime||"");
  m.registrationEnabled=!!info.registration.enabled;
  m.registrationOpenAt=info.registration.openAt||null;
  m.registrationCloseAt=info.registration.closeAt||null;
  m.registrationCapacity=info.registration.capacity==null?null:Number(info.registration.capacity);
  m.waitlistCapacity=Math.max(0,Number(info.registration.waitlistCapacity)||0);
  m.waitlistEnabled=m.waitlistCapacity>0;
  m.registrationFee=info.registration.fee==null?null:Number(info.registration.fee);
  m.targetGroup=info.registration.targetGroup==="children"?"children":"open";
  m.eventDescription=String(info.content.customDescription||"");
  st.eventInfo=info;
  return st;
}

async function fileToPlayerAvatarDataUrl(file){
  if(!file || !file.type || !file.type.startsWith("image/")) throw new Error("invalid-file");
  if(file.size > 10 * 1024 * 1024) throw new Error("file-too-large");

  const bitmap = await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });

  const side=Math.min(bitmap.naturalWidth||bitmap.width, bitmap.naturalHeight||bitmap.height);
  const sx=((bitmap.naturalWidth||bitmap.width)-side)/2;
  const sy=((bitmap.naturalHeight||bitmap.height)-side)/2;
  const canvas=document.createElement("canvas");
  canvas.width=256; canvas.height=256;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(bitmap,sx,sy,side,side,0,0,256,256);
  return canvas.toDataURL("image/jpeg",0.82);
}

async function copyTextToClipboard(text, successMessage){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
      return true;
    }
    throw new Error("no clipboard api");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      showToast(successMessage);
      return true;
    }catch(e2){
      showToast("複製失敗，請手動選取文字複製", true);
      return false;
    }
  }
}

function matchResultSummaryText(m){
  if(!m || !m.winnerId) return "";
  const winName = playerName(m.winnerId);
  if(m.resultMethod==="quick_decision"){
    return winName + " 勝";
  }
  const loserName = m.loserId ? playerName(m.loserId) : "";
  const winScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreA : m.scoreB;
  const loseScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreB : m.scoreA;
  return winName + " " + winScore + "：" + loseScore + " " + loserName;
}

    const fx = document.getElementById("celebration-fx");
