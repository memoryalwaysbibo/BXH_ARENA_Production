<script>
(function bxhFreshVersionGuard(){
  var CURRENT_BUILD="20260925.39";
  var CHECK_EVERY_MS=60000;
  var lastCheck=0;
  var checking=false;

  function addUpdateBanner(nextBuild){
    if(document.getElementById("bxh-update-banner")) return;
    try{
      var attemptedAt=Number(sessionStorage.getItem("bxh_update_attempt_"+String(nextBuild||""))||0);
      if(attemptedAt && Date.now()-attemptedAt<15000) return;
    }catch(e){}
    var show=function(){
      if(document.getElementById("bxh-update-banner")) return;
      var bar=document.createElement("div");
      bar.id="bxh-update-banner";
      bar.setAttribute("role","status");
      bar.style.cssText="position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:2147483647;background:#17181b;color:#f4f5f2;border:1px solid #d9b95c;border-radius:12px;padding:12px 14px;box-shadow:0 10px 34px rgba(0,0,0,.45);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;display:flex;align-items:center;justify-content:space-between;gap:12px";
      var msg=document.createElement("div");
      msg.innerHTML="<strong>BXH ARENA 已更新</strong><div style='font-size:12px;opacity:.78;margin-top:2px'>點一下即可載入最新版本，不需要清快取或開無痕模式。</div>";
      var btn=document.createElement("button");
      btn.type="button";
      btn.textContent="立即更新";
      btn.style.cssText="flex:0 0 auto;border:0;border-radius:9px;padding:9px 13px;background:#d9b95c;color:#111;font-weight:800";
      btn.onclick=function(){
        var targetBuild=String(nextBuild||Date.now());
        btn.disabled=true;
        btn.textContent="更新中…";
        try{ sessionStorage.setItem("bxh_update_attempt_"+targetBuild,String(Date.now())); }catch(e){}
        try{ bar.remove(); }catch(e){}
        try{
          var u=new URL(location.href);
          u.searchParams.set("bxh_build",targetBuild);
          u.searchParams.set("bxh_force",Date.now().toString());
          location.replace(u.toString());
        }catch(e){
          location.reload();
        }
      };
      bar.appendChild(msg); bar.appendChild(btn);
      document.body.appendChild(bar);
    };
    if(document.body) show(); else window.addEventListener("DOMContentLoaded",show,{once:true});
  }

  async function checkFreshVersion(force){
    var now=Date.now();
    if(checking || (!force && now-lastCheck<CHECK_EVERY_MS)) return;
    checking=true; lastCheck=now;
    try{
      var url=new URL("version.json",document.baseURI);
      url.searchParams.set("_",String(now));
      var res=await fetch(url.toString(),{cache:"no-store",credentials:"same-origin"});
      if(!res.ok) return;
      var info=await res.json();
      var next=String(info&&info.build||"");
      if(next && next!==CURRENT_BUILD) addUpdateBanner(next);
    }catch(e){
      /* Update checks are best-effort and must never block app startup. */
    }finally{
      checking=false;
    }
  }

  window.addEventListener("pageshow",function(){ checkFreshVersion(true); });
  window.addEventListener("focus",function(){ checkFreshVersion(false); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkFreshVersion(true); });
  setInterval(function(){ checkFreshVersion(false); },CHECK_EVERY_MS);
})();
</script>

body{

header.topbar .logo-glow{

}
header.topbar img.logo{position:relative;z-index:1;height:84px;width:auto;display:block;flex-shrink:0;}
header.topbar .brandtext{display:flex;flex-direction:column;line-height:1.15;min-width:0;position:relative;z-index:1;}
header.topbar .brandtext .t1{
  font-family:var(--font-d);font-weight:700;font-size:25px;letter-spacing:3px;

header.topbar .brandtext .t1 .w-bxh{color:var(--white);text-shadow:0 0 1px rgba(255,255,255,0.25);}

  font-size:13.5px;color:#c7cad0;letter-spacing:2.5px;margin-top:6px;white-space:nowrap;font-weight:500;
}
header.topbar .brandtext .top-connection-state{
  position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"kicker kicker" "rail rail" "status status";
  gap:4px;margin-top:8px;padding-left:10px;max-width:190px;
}
header.topbar .brandtext .top-connection-state::before{
  content:"";position:absolute;left:0;top:2px;width:2px;height:30px;
  background:linear-gradient(180deg,var(--gold),rgba(217,185,92,.16));
  transform:skewX(-18deg);box-shadow:0 0 8px rgba(217,185,92,.24);

  grid-area:rail;position:relative;overflow:visible;width:132px;height:13px;margin:0;border-radius:999px;color:#45ef98;

  content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;transform:translateY(-50%);border-radius:999px;

header.topbar .brandtext .t-rule.limited{color:#e8c547;}
header.topbar .brandtext .t-rule.limited::after{animation-duration:1.6s;}
header.topbar .brandtext .t-rule.error::after{animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-rule.local{color:#7a8088;}
header.topbar .brandtext .t-rule.local::after{animation-duration:2.8s;opacity:.58;}
header.topbar .brandtext .t-conn-status{
  grid-area:status;display:flex;align-items:center;gap:6px;min-width:0;font-size:9.5px;letter-spacing:.7px;color:#aeb5bf;font-weight:750;line-height:1.1;

header.topbar .brandtext .t-conn-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 10px currentColor;}
header.topbar .brandtext .t-conn-dot.connected{background:#3ddc84;color:#3ddc84;}
header.topbar .brandtext .t-conn-dot.connecting{background:#e8c547;color:#e8c547;animation:cloud-pulse 1s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.error{background:#ff6666;color:#ff6666;animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.limited{background:#e8c547;color:#e8c547;animation:cloud-pulse 1.4s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.local{background:#7a8088;color:#7a8088;}
@keyframes topbarLifeDot{
  0%{left:0;top:50%;opacity:.15}
  8%{opacity:1}
  42%{left:44%;top:50%}
  48%{left:50%;top:5%}
  54%{left:56%;top:50%}
  92%{opacity:1}
  100%{left:calc(100% - 7px);top:50%;opacity:.12}
}
@keyframes topbarLifeError{0%,100%{opacity:.28;transform:translate(54px,-50%) scale(.82)}50%{opacity:1;transform:translate(54px,-50%) scale(1.18)}}

/* ---------- multi-court referee grid (dynamic, never hardcoded to N) ---------- */
.court-grid{display:grid;gap:18px;}
.court-grid > .court-card + .court-card{margin-top:0;}

/* Multiple referee windows are always ordered left→right, then top→bottom: 1 2 / 3 4 / 5 6 ... */
.court-card{
  scroll-margin-top:70px;
  align-self:stretch;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
  border-color:var(--court-accent,var(--border));
  box-shadow:
    0 0 0 1px var(--court-glow-soft,transparent),
    0 0 24px var(--court-glow,transparent),
    inset 0 1px 0 var(--court-glow-soft,transparent);
}
.court-card::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:5px;
  background:var(--court-accent,var(--gold));
  box-shadow:0 0 18px var(--court-accent,var(--gold)),0 0 34px var(--court-glow,transparent);
  pointer-events:none;
}
.court-card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--court-glow-soft,transparent),transparent 44%);
  pointer-events:none;z-index:0;
}
.court-card > *{position:relative;z-index:1;}

}

.hoc-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:36px;position:relative;z-index:2;width:100%;max-width:640px;}

.fw-confetti{position:absolute;width:6px;height:12px;opacity:0;animation:fw-fall 3.6s linear forwards;}
@keyframes fw-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(360px) rotate(320deg);opacity:0;}}
.fw-static{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--champagne-gold);opacity:0.5;}

@media (prefers-reduced-motion: reduce){

/* ==== auth / landing screens ==== */
.auth-shell{
  position:fixed;inset:0;z-index:400;
  width:100%;height:100vh;height:100dvh;max-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(212,175,55,0.09) 0%, transparent 45%),
    linear-gradient(180deg, #0d0e0a 0%, var(--obsidian) 55%, #020303 100%);

  isolation:isolate;
}
.auth-bg-layer{

}

.auth-particles{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}

.auth-content{position:relative;z-index:2;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;}

.auth-logo-wrap{position:relative;width:104px;height:104px;margin-bottom:8px;}

.auth-tagline{font-family:var(--font-b);font-size:14px;color:var(--champagne-gold);letter-spacing:1px;margin-top:18px;text-align:center;}
.auth-footnote{margin-top:30px;font-size:12px;color:var(--metal-dim);text-align:center;}

.role-cards{display:flex;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin-top:26px;width:100%;}
.role-card{

/* ==== v14.0.11 collapsible test ladder ==== */
.test-ladder-toggle{
  width:100%;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px;
  border:0;
  background:transparent;
  color:var(--white);
  font:700 16px var(--font-d);
  text-align:left;
  cursor:pointer;
}
.test-ladder-toggle .hint{margin-left:auto;font-size:11px;font-weight:600;white-space:nowrap;}
.test-ladder-toggle .chev{color:var(--gold);transition:transform .16s ease;}
.test-ladder-toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}
.test-ladder-body{padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.07);}
.test-ladder-panel{padding:0!important;overflow:hidden;border-color:var(--gold-dim)!important;}

  .test-ladder-toggle{min-height:46px;padding:10px 12px;font-size:15px;}

}

/* ==== v14.0.10 compact admin context HUD ==== */
.admin-context-hud{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  min-height:36px;
  padding:5px 8px;
  margin-bottom:10px;
  border:1px solid var(--border-soft);
  border-radius:10px;
  background:rgba(255,255,255,.018);
  font-family:var(--font-d);
  font-size:11.5px;
}
.admin-context-hud .room-status{
  min-height:26px;
  padding:3px 8px;
  border-radius:7px;
  background:rgba(255,255,255,.025);
}
.admin-context-code{
  appearance:none;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:28px;
  max-width:100%;
  padding:3px 9px;
  border:1px solid rgba(217,185,92,.38);
  border-radius:8px;
  background:rgba(217,185,92,.055);
  color:var(--gold);
  font:700 11.5px var(--font-d);
  letter-spacing:1.4px;
  cursor:pointer;
}
.admin-context-code:hover{background:rgba(217,185,92,.10);}
.admin-context-code:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.admin-context-code .copy-mark{font-size:12px;letter-spacing:0;color:var(--metal);}
.admin-context-cloud-alert{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:28px;
  padding:3px 8px;
  border-radius:8px;
  border:1px solid rgba(255,77,77,.35);
  color:#ff8a8a;
  background:rgba(255,77,77,.055);
}
.admin-context-cloud-alert.warn{
  border-color:rgba(232,197,71,.35);
  color:#e8c547;
  background:rgba(232,197,71,.055);
}
.admin-context-hud .btn{min-height:28px!important;padding:4px 9px!important;font-size:11px!important;}
@media(max-width:640px){
  .admin-context-hud{padding:5px 6px;gap:6px;margin-bottom:8px;}
  .admin-context-code{flex:0 1 auto;min-width:0;}
}

.cloud-status-bar{
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  background:var(--panel-2);border-bottom:1px solid var(--border);
  padding:7px 14px;font-size:12px;font-family:var(--font-d);
}
.cloud-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cloud-dot.connected{background:var(--ok);box-shadow:0 0 6px var(--ok);}
.cloud-dot.connecting{background:var(--gold);animation:cloud-pulse 1s ease-in-out infinite;}
.cloud-dot.local{background:var(--metal-dim);}
.cloud-dot.error{background:var(--danger);}
@keyframes cloud-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
.cloud-dot-v2{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cloud-dot-v2.green{background:#3ddc84;box-shadow:0 0 6px #3ddc84;}
.cloud-dot-v2.yellow{background:#e8c547;box-shadow:0 0 6px #e8c547;animation:cloud-pulse 1s ease-in-out infinite;}
.cloud-dot-v2.red{background:#ff4d4d;box-shadow:0 0 6px #ff4d4d;}
.cloud-dot-v2.gray{background:#6c7078;}
.cloud-code-chip{background:var(--panel-3);border:1px solid var(--gold-dim);color:var(--gold);padding:2px 10px;border-radius:10px;letter-spacing:2px;font-weight:700;}

.switch-preview-row .label{color:var(--metal-dim);flex-shrink:0;}
.switch-preview-row .value{color:var(--white);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cloud-status-bar button{font-size:11.5px;padding:4px 10px;min-height:0;}
@media (max-width:640px){
  .role-cards{flex-direction:column;align-items:stretch;}
  .role-card{max-width:none;min-height:0;}
  .auth-logo-wrap{width:80px;height:80px;}
}


@media print{
  @page{ size: landscape; margin: 12mm; }
  body *{visibility:hidden;}
  #print-bracket, #print-bracket *{visibility:visible;}
  #print-bracket{position:absolute;top:0;left:0;width:100%;background:#fff;color:#111;padding:20px;}
  #print-bracket .match-box{border:1px solid #999;background:#fff;}

.profile-primary-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px;}
.profile-primary-tabs .btn{min-height:44px;border-radius:11px;}
.profile-secondary-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;margin:0 0 14px;border:1px solid rgba(217,185,92,.15);border-radius:12px;background:rgba(255,255,255,.018);}
.profile-secondary-tabs .btn{min-height:38px;border-radius:9px;font-size:12.5px;}
.profile-hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;padding:17px 18px;text-align:left!important;border-color:rgba(217,185,92,.28);background:linear-gradient(135deg,rgba(217,185,92,.075),rgba(18,19,21,.92));}
.profile-hero-avatar{width:78px;height:78px;border-radius:50%;overflow:hidden;border:1px solid var(--gold-dim);background:rgba(217,185,92,.07);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2),0 0 0 3px rgba(217,185,92,.045);}
.profile-hero-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.profile-hero-copy{min-width:0;}
.profile-hero-name{font-family:var(--font-d);font-size:22px;font-weight:900;color:var(--ivory);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.profile-hero-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:11px;color:var(--metal);}
.profile-hero-verified{color:var(--gold);}
.profile-hero-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.profile-info-groups{display:grid;gap:12px;}
.profile-info-group{border:1px solid rgba(255,255,255,.075);border-radius:12px;background:rgba(8,9,11,.34);overflow:hidden;}
.profile-info-group-title{padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--font-d);font-size:12px;font-weight:900;letter-spacing:.7px;color:var(--gold);}
.profile-info-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
.profile-info-row{min-width:0;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.055);}
.profile-info-row:nth-child(odd){border-right:1px solid rgba(255,255,255,.055);}
.profile-info-row:nth-last-child(-n+2){border-bottom:0;}
.profile-info-label{font-size:10.5px;color:var(--metal-dim);margin-bottom:4px;}
.profile-info-value{font-size:13px;font-weight:800;color:var(--ivory);overflow-wrap:anywhere;}
.profile-info-sub{font-size:9.5px;color:var(--metal);margin-top:3px;}
.profile-account-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
@media(max-width:520px){
  .profile-hero{grid-template-columns:68px minmax(0,1fr);gap:13px;padding:15px;}
  .profile-hero-avatar{width:68px;height:68px;}
  .profile-hero-name{font-size:20px;}
  .profile-info-list{grid-template-columns:1fr;}
  .profile-info-row,.profile-info-row:nth-child(odd){border-right:0;}
  .profile-info-row:nth-last-child(-n+2){border-bottom:1px solid rgba(255,255,255,.055);}
  .profile-info-row:last-child{border-bottom:0;}
}.player-avatar-large{width:92px;height:92px;}
.player-avatar-large img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;}

.half-hour-datetime{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.half-hour-datetime .half-hour-date{flex:1 1 180px;min-width:160px}
.half-hour-clock{display:flex;align-items:center;gap:8px}
.half-hour-clock select{min-width:78px}
.half-hour-clock .time-colon{font-weight:800;font-size:18px;opacity:.8}
@media (max-width:560px){
  .half-hour-datetime{align-items:stretch}
  .half-hour-datetime .half-hour-date{flex-basis:100%;width:100%}
  .half-hour-clock{width:100%}
  .half-hour-clock select{flex:1}
}

.test-roster-box{
  margin:0 0 18px;
  padding:14px;
  border:1px dashed var(--gold-dim);
  border-radius:var(--radius-sm);
  background:rgba(217,185,92,.045);
}
.test-roster-box .btn-row{gap:8px;flex-wrap:wrap;}

.ladder-hero{border-color:var(--gold-dim);background:linear-gradient(150deg,rgba(217,185,92,.09),var(--panel));}
.ladder-season-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px;}
.ladder-season-grid .stat-box{min-height:116px;display:flex;flex-direction:column;justify-content:center;}
.ladder-season-grid .label{font-size:13px;line-height:1.35;}
.ladder-season-grid .value{font-family:var(--font-d);font-size:27px!important;line-height:1.15;font-weight:800;letter-spacing:.2px;white-space:nowrap;}
.ladder-location-filter{border-color:rgba(217,185,92,.28);background:linear-gradient(150deg,rgba(217,185,92,.055),var(--panel));}
.ladder-location-filter .grid{gap:12px;}
.ladder-location-filter select{min-height:44px;}
.ladder-season-grid .season-status-card{position:relative;overflow:hidden;}
.ladder-season-grid .season-status-card:after{content:"";position:absolute;inset:auto -24px -34px auto;width:92px;height:92px;border-radius:50%;background:rgba(217,185,92,.08);pointer-events:none;}
.ladder-season-status-note{font-size:11px;color:var(--metal);margin-top:6px;}
.ladder-season-progress{margin-top:16px;padding:13px 14px;border:1px solid rgba(217,185,92,.18);border-radius:10px;background:rgba(0,0,0,.16);}
.ladder-season-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--metal);margin-bottom:8px;}
.ladder-season-progress-track{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.04);}
.ladder-season-progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--gold-dim),var(--gold));box-shadow:0 0 12px rgba(217,185,92,.22);}
.ladder-season-progress-foot{display:flex;justify-content:space-between;gap:12px;margin-top:7px;font-size:10px;color:var(--metal-dim);}
.ladder-season-state-pre .value{color:var(--ivory);}
.ladder-season-state-live .value{color:var(--gold);}
.ladder-season-state-urgent .value{color:#f0cf74;text-shadow:0 0 10px rgba(217,185,92,.18);}
.ladder-season-state-ended .value{color:var(--metal);}
@media(max-width:560px){
  .ladder-season-grid{gap:10px;}
  .ladder-season-grid .stat-box{min-height:106px;padding:14px 12px;}
  .ladder-season-grid .value{font-size:24px!important;}
  .ladder-season-progress{padding:12px;}
}
.ladder-rank-table .rank-num{min-width:64px;}
.ladder-rank-table strong{color:var(--neon);font-family:var(--font-d);}
.ladder-tier-0{color:#a9adb5;border-color:#545861;}
.ladder-tier-1{color:#d9a574;border-color:#96653c;}
.ladder-tier-2{color:#d8dde5;border-color:#9ca3ad;}
.ladder-tier-3{color:#ffd85b;border-color:#a98a1e;}
.ladder-tier-4{color:#7de5d8;border-color:#3e9188;}
.ladder-tier-5{color:#75d7ff;border-color:#3588aa;}
.ladder-tier-6{color:#d69cff;border-color:#8254a3;}
.ladder-tier-7{color:#ff6d77;border-color:#ad3038;box-shadow:0 0 10px rgba(255,109,119,.2);}

/* ==== guest lobby / public ladder ==== */
.guest-lobby-content{max-width:1040px;}
.guest-lobby-shell{width:100%;min-width:0;}
.guest-lobby-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;margin:4px 0 12px;
}
.guest-mode-label{font-size:11px;color:var(--metal-dim);letter-spacing:1px;}
.guest-tabs{
  width:100%;display:flex;gap:4px;padding:4px;
  background:rgba(20,21,23,.86);border:1px solid var(--border);border-radius:10px;
  margin-bottom:14px;
}
.guest-tab{
  flex:1;border:none;background:transparent;color:var(--metal);
  padding:10px 14px;border-radius:7px;font-family:var(--font-d);font-weight:700;font-size:14px;
  transition:.2s ease;
}
.guest-tab.active{background:rgba(217,185,92,.12);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-dim);}
.guest-tab-content{width:100%;min-width:0;}
.guest-ladder-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding:18px 20px;margin-bottom:12px;
  border:1px solid var(--gold-dim);border-radius:12px;
  background:linear-gradient(135deg,rgba(217,185,92,.12),rgba(10,10,10,.72));
}
.guest-ladder-kicker{font-family:var(--font-d);font-size:11px;letter-spacing:3px;color:var(--gold-dim);}
.guest-ladder-title{font-family:var(--font-d);font-size:27px;font-weight:800;color:var(--ivory);letter-spacing:1px;}
.guest-ladder-sub{font-size:12px;color:var(--metal);margin-top:3px;}
.guest-ladder-search-wrap{position:relative;width:100%;margin-bottom:12px;}
.guest-ladder-search-wrap input{
  width:100%;height:44px;padding:0 44px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--white);
  outline:none;font-size:14px;
}
.guest-ladder-search-wrap input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(217,185,92,.08);}
.guest-search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:20px;pointer-events:none;}
.guest-search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border:none;border-radius:50%;background:var(--panel-3);color:var(--metal);font-size:18px;
}
.guest-ladder-board{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:rgba(15,16,18,.88);}
.guest-ladder-columns,.guest-ladder-row{
  display:grid;grid-template-columns:76px minmax(160px,1.7fr) 110px 110px 110px 72px 72px;
  align-items:center;column-gap:8px;
}
.guest-ladder-columns{
  padding:9px 14px;background:#111214;color:var(--gold);font-size:11px;font-weight:700;border-bottom:1px solid var(--gold-dim);
}
.guest-ladder-row{
  min-height:50px;padding:8px 14px;border-bottom:1px solid var(--border-soft);
  transition:background .15s ease;
}
.guest-ladder-row:last-child{border-bottom:none;}
.guest-ladder-row:hover{background:rgba(217,185,92,.045);}
.guest-ladder-row:nth-child(-n+3){background:linear-gradient(90deg,rgba(217,185,92,.055),transparent 48%);}
.guest-rank{font-family:var(--font-d);font-weight:800;color:var(--gold);font-size:15px;}
.guest-player-name{font-weight:700;color:var(--white);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.guest-player-mobile-meta{display:none;}
.guest-pts strong{font-family:var(--font-d);color:var(--neon);font-size:17px;margin-right:3px;}
.guest-pts span,.guest-career,.guest-events,.guest-champs{font-size:12px;color:var(--metal);}
.guest-ladder-more{padding:12px;text-align:center;border-top:1px solid var(--border);}
.guest-ladder-note{font-size:11px;color:var(--metal-dim);text-align:center;margin-top:10px;line-height:1.5;}

@media (max-width:720px){
  .guest-lobby-content{max-width:100%;}
  .guest-lobby-topbar{align-items:center;}
  .guest-mode-label{font-size:9.5px;}
  .guest-ladder-head{padding:14px 15px;align-items:center;}
  .guest-ladder-title{font-size:22px;}
  .guest-ladder-columns{
    grid-template-columns:58px minmax(0,1fr) 78px;
  }
  .guest-ladder-columns > div:nth-child(3),
  .guest-ladder-columns > div:nth-child(5),
  .guest-ladder-columns > div:nth-child(6),
  .guest-ladder-columns > div:nth-child(7){display:none;}
  .guest-ladder-row{
    grid-template-columns:58px minmax(0,1fr) 78px;
    padding:9px 10px;column-gap:5px;
  }
  .guest-tier,.guest-career,.guest-events,.guest-champs{display:none;}
  .guest-player-mobile-meta{display:block;font-size:10px;color:var(--metal-dim);margin-top:2px;}
  .guest-pts{text-align:right;}
  .guest-player-name{font-size:13px;}
  .guest-rank{font-size:13px;}
}

/* ==== v13.20.0 settings workflow integration ==== */
.settings-toolbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin:0 0 18px;padding:0 2px;
}

.ai-create-assist-btn{
  border-color:rgba(217,185,92,.52)!important;
  background:linear-gradient(135deg,rgba(217,185,92,.12),rgba(255,255,255,.025))!important;
  color:var(--ivory)!important;
}
.ai-create-assist-btn:hover{border-color:var(--gold)!important;box-shadow:0 0 18px rgba(217,185,92,.10);}
.ai-create-overlay{
  position:fixed;inset:0;z-index:4200;
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.ai-create-dialog{
  width:min(760px,100%);max-height:min(88vh,860px);overflow:auto;
  border:1px solid rgba(217,185,92,.42);border-radius:16px;
  background:linear-gradient(180deg,rgba(25,25,27,.99),rgba(12,12,14,.99));
  box-shadow:0 24px 80px rgba(0,0,0,.62),0 0 32px rgba(217,185,92,.06);
}
.ai-create-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);
}
.ai-create-kicker{font:800 11px var(--font-d);letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;}
.ai-create-title{margin-top:3px;font:800 22px var(--font-d);color:var(--white);}
.ai-create-sub{margin-top:5px;font-size:12px;line-height:1.6;color:var(--metal-dim);}
.ai-create-close{
  flex:0 0 auto;width:38px;height:38px;border:1px solid rgba(255,255,255,.12);
  border-radius:10px;background:rgba(255,255,255,.03);color:var(--metal);
  font-size:18px;cursor:pointer;
}
.ai-create-body{padding:18px;}
.ai-create-source{
  width:100%;min-height:250px;resize:vertical;
  padding:14px;border:1px solid var(--border);border-radius:12px;
  background:rgba(0,0,0,.28);color:var(--white);
  font:500 14px/1.7 "Noto Sans TC",sans-serif;outline:none;
}
.ai-create-source:focus{border-color:var(--gold-dim);box-shadow:0 0 0 2px rgba(217,185,92,.07);}
.ai-create-meta{display:flex;justify-content:space-between;gap:12px;margin-top:7px;color:var(--metal-dim);font-size:10.5px;}
.ai-create-fields{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
.ai-create-chip{
  padding:5px 9px;border:1px solid rgba(255,255,255,.1);border-radius:999px;
  background:rgba(255,255,255,.025);color:var(--metal);font-size:10.5px;
}
.ai-create-safety{
  margin-top:16px;padding:11px 12px;border:1px solid rgba(217,185,92,.18);
  border-radius:10px;background:rgba(217,185,92,.045);color:var(--metal);
  font-size:11px;line-height:1.65;
}
.ai-create-notice{
  margin-top:12px;padding:10px 12px;border:1px solid rgba(102,180,255,.28);
  border-radius:10px;background:rgba(102,180,255,.055);color:#cfe6ff;
  font-size:11px;line-height:1.6;
}
.ai-create-result{
  margin-top:16px;border:1px solid rgba(255,255,255,.10);border-radius:12px;
  overflow:hidden;background:rgba(255,255,255,.018);
}
.ai-create-result-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.08);
}
.ai-create-result-head strong{color:var(--ivory);font-size:13px;}
.ai-create-schema-badge{
  flex:0 0 auto;padding:4px 8px;border:1px solid rgba(85,184,255,.34);
  border-radius:999px;background:rgba(85,184,255,.07);color:#9ed8ff;
  font:800 9.5px var(--font-d);letter-spacing:.45px;
}
.ai-create-result-body{padding:13px;}
.ai-create-shared-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
}
.ai-create-data-box{
  min-width:0;padding:9px 10px;border:1px solid rgba(255,255,255,.075);
  border-radius:9px;background:rgba(0,0,0,.16);
}
.ai-create-data-box span{display:block;color:var(--metal-dim);font-size:9.5px;margin-bottom:3px;}
.ai-create-data-box strong{
  display:block;color:var(--white);font-size:12px;line-height:1.45;
  overflow-wrap:anywhere;
}
.ai-create-event-list{display:grid;gap:9px;margin-top:12px;}
.ai-create-event-card{
  padding:11px;border:1px solid rgba(217,185,92,.18);border-radius:10px;
  background:rgba(217,185,92,.025);
}
button.ai-create-event-card{
  width:100%;text-align:left;color:inherit;cursor:pointer;font:inherit;
  transition:border-color .16s ease,background .16s ease,box-shadow .16s ease,transform .16s ease;
}
button.ai-create-event-card:hover{
  border-color:rgba(217,185,92,.46);background:rgba(217,185,92,.055);transform:translateY(-1px);
}
button.ai-create-event-card.is-selected{
  border-color:var(--gold);background:rgba(217,185,92,.085);
  box-shadow:0 0 0 1px rgba(217,185,92,.12),0 0 20px rgba(217,185,92,.07);
}
.ai-create-selected-mark{
  display:inline-flex;align-items:center;gap:5px;margin-left:auto;
  color:var(--gold);font-size:9.5px;font-weight:800;
}
.ai-create-event-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:8px;color:var(--ivory);font:800 13px var(--font-d);
}
.ai-create-event-tag{
  padding:3px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.10);
  color:var(--metal-dim);font-size:9px;font-weight:700;
}
.ai-create-event-meta{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;
}
.ai-create-event-meta div{
  padding:7px 8px;border-radius:8px;background:rgba(0,0,0,.14);
  color:var(--metal);font-size:10.5px;line-height:1.45;
}
.ai-create-warning-list{display:grid;gap:7px;margin-top:12px;}
.ai-create-warning{
  padding:9px 10px;border-radius:9px;font-size:10.5px;line-height:1.55;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);
}
.ai-create-warning.warning{border-color:rgba(255,193,85,.34);color:#ffd58a;background:rgba(255,193,85,.055);}
.ai-create-warning.info{border-color:rgba(102,180,255,.24);color:#cfe6ff;background:rgba(102,180,255,.045);}
.ai-create-schema-errors{
  margin-top:12px;padding:10px 12px;border:1px solid rgba(255,105,105,.35);
  border-radius:10px;background:rgba(255,80,80,.05);color:#ffb3b3;
  font-size:10.5px;line-height:1.6;
}
.ai-create-draft-lock{
  margin-top:12px;padding:9px 10px;border:1px dashed rgba(255,255,255,.13);
  border-radius:9px;color:var(--metal-dim);font-size:10.5px;line-height:1.55;
}
.ai-create-map-preview{
  margin-top:12px;padding:11px;border:1px solid rgba(95,215,147,.22);
  border-radius:10px;background:rgba(95,215,147,.035);
}
.ai-create-map-preview>strong{display:block;color:#b9f0cd;font-size:11.5px;margin-bottom:8px;}
.ai-create-map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
.ai-create-map-grid div{
  min-width:0;padding:7px 8px;border-radius:8px;background:rgba(0,0,0,.14);
  color:var(--metal);font-size:10px;line-height:1.45;overflow-wrap:anywhere;
}
.ai-create-map-grid b{color:var(--white);font-weight:750;}
.ai-create-unmapped{margin-top:8px;color:#ffd58a;font-size:10px;line-height:1.55;}
.ai-create-applied-banner{
  margin:0 0 16px;padding:12px 14px;border:1px solid rgba(95,215,147,.30);
  border-radius:11px;background:rgba(95,215,147,.05);color:#d8f7e4;
  font-size:11px;line-height:1.65;
}
.ai-create-applied-banner strong{display:block;color:#b9f0cd;font-size:12.5px;margin-bottom:3px;}
.ai-create-applied-warnings{margin-top:7px;color:#ffd58a;}
.ai-create-review-panel{
  margin:0 0 18px;padding:14px;border:1px solid rgba(255,255,255,.10);
  border-radius:12px;background:rgba(255,255,255,.018);
}
.ai-create-review-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;
}
.ai-create-review-head strong{display:block;color:var(--ivory);font-size:13px;}
.ai-create-review-head span{display:block;color:var(--metal-dim);font-size:10px;margin-top:3px;line-height:1.5;}
.ai-create-review-status{
  flex:0 0 auto;padding:5px 9px;border-radius:999px;font:800 9.5px var(--font-d);letter-spacing:.35px;
  border:1px solid rgba(255,255,255,.12);color:var(--metal);
}
.ai-create-review-status.blocked{border-color:rgba(255,105,105,.40);background:rgba(255,80,80,.07);color:#ffb3b3;}
.ai-create-review-status.pending{border-color:rgba(255,193,85,.40);background:rgba(255,193,85,.065);color:#ffd58a;}
.ai-create-review-status.ready{border-color:rgba(95,215,147,.36);background:rgba(95,215,147,.06);color:#b9f0cd;}
.ai-create-review-list{display:grid;gap:7px;}
.ai-create-review-item{
  display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;
  padding:9px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.075);background:rgba(0,0,0,.14);
}
.ai-create-review-item .icon{font-size:13px;line-height:1.4;}
.ai-create-review-item b{display:block;color:var(--white);font-size:10.5px;margin-bottom:2px;}
.ai-create-review-item p{margin:0;color:var(--metal);font-size:10px;line-height:1.55;}
.ai-create-review-item.blocker{border-color:rgba(255,105,105,.28);background:rgba(255,80,80,.035);}
.ai-create-review-item.warning{border-color:rgba(255,193,85,.25);background:rgba(255,193,85,.035);}
.ai-create-review-item.info{opacity:.86;}
.ai-create-review-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:11px;flex-wrap:wrap;}
.ai-create-review-confirmed{color:#b9f0cd;font-size:10.5px;font-weight:800;}
.ai-create-suggestion-panel{
  margin:0 0 14px;padding:14px;border:1px solid rgba(102,180,255,.26);
  border-radius:12px;background:rgba(102,180,255,.035);
}
.ai-create-suggestion-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;
}
.ai-create-suggestion-head strong{display:block;color:#d9edff;font-size:13px;}
.ai-create-suggestion-head span{display:block;color:var(--metal-dim);font-size:10px;line-height:1.55;margin-top:3px;}
.ai-create-suggestion-count{
  flex:0 0 auto;padding:4px 8px;border:1px solid rgba(102,180,255,.28);
  border-radius:999px;color:#a9d9ff;font:800 9.5px var(--font-d);
}
.ai-create-suggestion-list{display:grid;gap:8px;}
.ai-create-suggestion-card{
  display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:flex-start;
  padding:10px;border:1px solid rgba(255,255,255,.085);border-radius:9px;background:rgba(0,0,0,.15);
}
.ai-create-suggestion-card input{margin-top:2px;width:16px;height:16px;}
.ai-create-suggestion-title{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--white);font-size:11px;font-weight:800;}
.ai-create-suggestion-badge{
  padding:2px 6px;border-radius:999px;font:800 8.5px var(--font-d);letter-spacing:.25px;
  border:1px solid rgba(255,255,255,.12);color:var(--metal);
}
.ai-create-suggestion-badge.source{border-color:rgba(95,215,147,.30);color:#b9f0cd;background:rgba(95,215,147,.05);}
.ai-create-suggestion-badge.recommended{border-color:rgba(255,193,85,.34);color:#ffd58a;background:rgba(255,193,85,.055);}
.ai-create-suggestion-card p{margin:4px 0 0;color:var(--metal);font-size:10px;line-height:1.55;}
.ai-create-suggestion-value{margin-top:5px;color:#d9edff;font-size:10.5px;font-weight:750;}
.ai-create-suggestion-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:10px;}
.venue-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.venue-settings-grid .venue-map-field{grid-column:1/-1;}
.venue-nav-toggle{margin-top:2px;}
.venue-detail-value{display:flex;flex-direction:column;gap:3px;min-width:0;}
.venue-detail-name{font-weight:800;color:var(--white);overflow-wrap:anywhere;}
.venue-detail-address-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.venue-detail-address{color:var(--metal);font-size:10px;line-height:1.45;overflow-wrap:anywhere;}
.venue-nav-menu{position:relative;display:inline-block;}
.venue-nav-menu>summary{
  list-style:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  min-height:26px;padding:3px 8px;border:1px solid rgba(95,215,147,.30);border-radius:999px;
  color:#b9f0cd;background:rgba(95,215,147,.055);font-size:9.5px;font-weight:800;white-space:nowrap;
}
.venue-nav-menu>summary::-webkit-details-marker{display:none;}
.venue-nav-menu[open]>summary{border-color:rgba(95,215,147,.55);background:rgba(95,215,147,.10);}
.venue-nav-options{
  position:absolute;z-index:80;right:0;top:calc(100% + 5px);min-width:148px;
  padding:6px;border:1px solid rgba(255,255,255,.12);border-radius:10px;
  background:#17181b;box-shadow:0 12px 30px rgba(0,0,0,.42);
}
.venue-nav-options a{
  display:block;padding:8px 9px;border-radius:7px;color:var(--white);font-size:10.5px;
  text-decoration:none;white-space:nowrap;
}
