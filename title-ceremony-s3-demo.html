<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020203;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.scene{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,#153f72 0,#07182d 29%,#03060b 65%,#010102 100%);color:#fff}.scene:before{content:"";position:absolute;width:155vmax;height:155vmax;background:repeating-conic-gradient(from -12deg,rgba(255,203,87,.11) 0 1.6deg,transparent 1.6deg 12deg);-webkit-mask:radial-gradient(circle,#000 0 22%,transparent 67%);mask:radial-gradient(circle,#000 0 22%,transparent 67%);opacity:0;animation:rays 2.3s .35s ease-out forwards}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 24vw #000;pointer-events:none}.stage{position:relative;z-index:2;width:min(94vw,760px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(30px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}.eyebrow{font-size:10px;letter-spacing:.34em;color:#cda94f;opacity:0;animation:rise .5s .1s forwards}.congrats{font-size:clamp(19px,5vw,30px);font-weight:900;letter-spacing:.2em;color:#ffe8a4;margin-top:15px;opacity:0;transform:translateY(14px);animation:rise .6s .35s forwards}.artbox{position:relative;width:min(92vw,650px);height:min(42vw,260px);min-height:150px;margin:18px 0 4px;display:grid;place-items:center;opacity:0;filter:blur(9px);transform:scale(.35) translateY(28px);animation:award 1.2s .7s cubic-bezier(.12,.72,.18,1.15) forwards}.halo{position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,235,165,.76),rgba(65,151,255,.25) 36%,transparent 69%);filter:blur(18px);opacity:0;transform:scale(.2);animation:halo 1.2s .8s forwards,pulse 2.5s 2s ease-in-out infinite}.art{position:relative;z-index:2;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 20px 28px #000) drop-shadow(0 0 18px rgba(255,183,58,.52))}.sweep{position:absolute;z-index:3;inset:4% 8%;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.78) 49%,rgba(255,213,101,.48) 53%,transparent 65%);mix-blend-mode:screen;transform:translateX(-150%) skewX(-15deg);animation:sweep 1.05s 1.62s ease-in-out forwards}.tier{display:flex;gap:7px;align-items:center;color:#f0c85d;font-weight:900;font-size:clamp(13px,3.4vw,18px);letter-spacing:.13em;opacity:0;animation:rise .5s 1.68s forwards}.title{margin:8px 0 0;font-size:clamp(38px,10vw,72px);line-height:1.04;letter-spacing:.05em;font-weight:1000;background:linear-gradient(#fff9dc,#f6d274 42%,#bb791d 76%,#ffe49c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 2px #08264c);opacity:0;transform:scale(.82);animation:title .72s 1.86s cubic-bezier(.2,.9,.2,1.15) forwards}.desc{margin:12px 0 0;color:#d7d0c0;font-size:12px;line-height:1.6;opacity:0;animation:rise .5s 2.18s forwards}.seal{margin-top:15px;border:1px solid rgba(235,194,87,.55);border-radius:999px;padding:7px 14px;color:#e8c76b;font-size:9px;letter-spacing:.23em;opacity:0;animation:rise .5s 2.38s forwards}.actions{margin-top:20px;display:flex;gap:9px;opacity:0;animation:rise .45s 2.62s forwards}.btn{appearance:none;border:1px solid rgba(232,196,99,.55);border-radius:999px;padding:11px 18px;background:rgba(17,11,8,.72);color:#fae8b3;font-weight:850;font-size:13px}.btn.primary{background:linear-gradient(#e0bd62,#a66b19);color:#160c04;border-color:#f2d681}.skip{position:absolute;z-index:6;right:14px;top:max(14px,env(safe-area-inset-top));appearance:none;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 11px;background:rgba(0,0,0,.3);color:#ddd;font-size:11px}.particles{position:absolute;z-index:1;left:50%;top:50%;width:1px;height:1px}.particles i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#ffd77a;box-shadow:0 0 9px #79bdff;opacity:0;animation:particle 1.6s var(--d) cubic-bezier(.15,.65,.2,1) forwards}.flash{position:absolute;z-index:1;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff6c9;box-shadow:0 0 30px 12px #a8d7ff;opacity:0;animation:flash 1.05s 1.25s ease-out forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes rays{to{opacity:.5;transform:rotate(18deg) scale(1.02)}}@keyframes award{55%{opacity:1;filter:blur(0);transform:scale(1.08) translateY(0)}100%{opacity:1;filter:blur(0);transform:scale(1) translateY(0)}}@keyframes halo{to{opacity:1;transform:scale(1)}}@keyframes pulse{50%{opacity:.7;transform:scale(1.12)}}@keyframes sweep{to{transform:translateX(150%) skewX(-15deg)}}@keyframes title{to{opacity:1;transform:scale(1)}}@keyframes particle{0%{opacity:0;transform:translate(0,0) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}38%{opacity:1;transform:translate(-50%,-50%) scale(5)}100%{opacity:0;transform:translate(-50%,-50%) scale(22)}}@media(max-width:520px){.artbox{height:44vw;min-height:142px}.desc{max-width:90vw}.stage{justify-content:center}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0ms!important}.scene:before,.particles,.flash{display:none}.eyebrow,.congrats,.artbox,.halo,.tier,.title,.desc,.seal,.actions{opacity:1!important;transform:none!important;filter:none!important}}

<body>
<div class="scene">

<script>
(function(){const layer=document.getElementById('particles'),n=58;for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.PI*2*i/n+(Math.random()*.3),d=110+Math.random()*260;p.style.setProperty('--x',Math.cos(a)*d+'px');p.style.setProperty('--y',Math.sin(a)*d+'px');p.style.setProperty('--s',(2+Math.random()*5)+'px');p.style.setProperty('--d',(.7+Math.random()*.9)+'s');layer.appendChild(p)}try{setTimeout(()=>navigator.vibrate?.([20,45,28]),800);setTimeout(()=>navigator.vibrate?.([35,35,70]),1900)}catch(e){}})();
