<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BXH ARENA Management UI V2 Preview</title><link rel="stylesheet" href="management-ui-v2.css"><style>:root{--bg:#08090a;--bg-soft:#0e0f11;--panel:#17181b;--panel-2:#1e2023;--border:#2c2e33;--neon:#e9ff2e;--neon-dim:#b9c918;--gold:#d9b95c;--metal:#9a9ea6;--white:#f4f5f2;--font-d:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:system-ui,sans-serif}.topbar{padding:18px 16px;background:linear-gradient(#101113,#08090a);border-bottom:2px solid var(--neon);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand b{color:var(--neon)}.role{border:1px solid var(--border);border-radius:9px;padding:8px 10px}.context{padding:10px 12px;color:var(--gold);background:#0c0d0f}.panel{margin:14px 12px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:12px}.panel h2{margin:0 0 12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px}.card strong{display:block;margin-bottom:5px}.card small{color:var(--metal)}</style><script src="management-ui-v2.js"></script></head><body><header class="topbar"><div class="brand">BXH <b>ARENA</b><div style="font-size:11px;color:#aaa;letter-spacing:1px">戰鬥陀螺賽事系統</div></div><div class="role">管理員</div></header><div class="context">● 比賽中　代碼 BXH-X9JKRJ</div><div id="nav"></div><main><section class="panel"><h2 id="title">賽事管理</h2><div class="cards" id="cards"></div></section></main><script>const tabs=["management","registrations","settings","people","live","bracket","referee","duty","ladder","member-raffles","inventory-admin","operations","history","version"];let active="management";function draw(){const m=BXH_MANAGEMENT_UI_V2,gs=m.visibleGroups(tabs),g=m.groupForTab(active),sel=gs.find(x=>x.id===g.id)||gs[0];document.getElementById("nav").innerHTML='<nav class="management-v2-groups">'+gs.map(x=>'<button data-g="'+x.id+'" class="'+(x.id===sel.id?'active':'')+'">'+x.label+'</button>').join("")+'</nav><nav class="management-v2-children">'+sel.tabs.map(x=>'<button data-t="'+x+'" class="'+(x===active?'active':'')+'">'+m.LABELS[x]+'</button>').join("")+'</nav>';document.getElementById("title").textContent=sel.label+"工作區";document.getElementById("cards").innerHTML=sel.tabs.map(x=>'<div class="card"><strong>'+m.LABELS[x]+'</strong><small>沿用現行功能與權限</small></div>').join("");document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{active=m.firstVisibleTab(b.dataset.g,tabs);draw()});document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{active=b.dataset.t;draw()})}draw();</script></body></html>
